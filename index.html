, điều kiện họp, người chủ trì họp, nội dung biên bản họp, cách thức biểu quyết, quyết định các vấn đề thuộc quyền hạn, trách nhiệm của Ban quản trị, hiệu lực các quyết định của Ban quản trị; cách thức làm việc của Ban quản trị; c) Quyền, trách nhiệm của Ban quản trị và trách nhiệm cụ thể của từng thành viên Ban quản trị, trong đó nêu rõ trách nhiệm ký các văn bản của Ban quản trị, chuẩn bị hồ sơ mời đơn vị quản lý vận hành, hồ sơ mời đơn vị thực hiện bảo trì, giám sát việc thực hiện bảo trì (nếu có), ký kết hợp đồng với đơn vị quản lý vận hành, đơn vị bảo trì phần sở hữu chung nhà chung cư, dự kiến kế hoạch bảo trì nhà chung cư; trách nhiệm điều hành, ký văn bản khi vắng mặt Trưởng ban hoặc Phó ban quản trị; trách nhiệm quản lý con dấu của Ban quản trị (nếu có con dấu); ký kết hợp đồng khai thác các tiện ích đối với phần sở hữu chung; d) Quyền được cung cấp thông tin và trách nhiệm cung cấp thông tin giữa các thành viên Ban quản trị, giữa Ban quản trị với các chủ sở hữu, người sử dụng nhà chung cư, giữa Ban quản trị và cơ quan quản lý nhà nước về nhà ở trên địa bàn; đ) Việc tiếp nhận, phản hồi các kiến nghị của chủ sở hữu, người sử dụng nhà chung cư, việc xử lý các trường hợp liên quan đến việc bãi nhiệm, miễn nhiệm thành viên Ban quản trị và trách nhiệm bồi thường thiệt hại của người có hành vi vi phạm; e) Cơ chế báo cáo, thông qua quyết định các khoản chi của Ban quản trị; người chịu trách nhiệm quản lý hồ sơ, giấy tờ hoạt động của Ban quản trị; g) Xử lý các quyền và trách nhiệm của thành viên Ban quản trị trong trường hợp bị miễn nhiệm, bãi nhiệm mà chưa bầu thay thế được thành viên này; h) Xử lý trong trường hợp Ban quản trị bị miễn nhiệm, bãi nhiệm mà chưa bầu được Ban quản trị mới để bàn giao hồ sơ nhà chung cư và tài khoản hoạt động của Ban quản trị; i) Kinh phí hoạt động của Ban quản trị; k) Các nội dung khác tùy thuộc vào đặc điểm của từng tòa nhà, cụm nhà chung cư. 3. Quy chế thu, chi tài chính của Ban quản trị tòa nhà chung cư, cụm nhà chung cư bao gồm các nội dung sau đây: a) Quy định về các khoản thu do Ban quản trị quản lý, tên người đứng chủ tài khoản hoạt động, tài khoản quản lý kinh phí bảo trì phần sở hữu chung do Ban quản trị quản lý, quy định về kỳ hạn tiền gửi kinh phí bảo trì phần sở hữu chung của nhà chung cư; b) Quy định về mức thù lao của từng thành viên Ban quản trị và các chi phí phục vụ cho hoạt động của Ban quản trị; c) Phân công trách nhiệm trong việc thu kinh phí, thay mặt Ban quản trị để ký duyệt chi các kinh phí hoạt động của Ban quản trị, ký văn bản đề nghị rút kinh phí bảo trì phần sở hữu chung của nhà chung cư và ký các giấy tờ thanh quyết toán kinh phí với đơn vị bảo trì, đơn vị quản lý vận hành; d) Quy định quy trình rút tiền và các hồ sơ giấy tờ cụ thể để làm thủ tục rút tiền tại các tài khoản do Ban quản trị đang quản lý; đ) Phân giao trách nhiệm ghi chép, quản lý sổ sách, hóa đơn chứng từ thu, chi tài chính của Ban quản trị; e) Quy định mức tiền mặt tối đa Ban quản trị được rút để trực tiếp thanh toán cho đơn vị thực hiện bảo trì phần sở hữu chung của nhà chung cư; quy định mức kinh phí Ban quản trị được sử dụng để bảo trì các công việc đột xuất mà không phải họp Hội nghị nhà chung cư hoặc xin ý kiến của các chủ sở hữu nhà chung cư để quyết định; g) Quy định hình thức xử lý vi phạm khi có hành vi chi tiêu sai mục đích hoặc chiếm dụng kinh phí do Ban quản trị quản lý hoặc có sai phạm trong ghi chép, quản lý sổ sách hóa đơn, chứng từ thu, chi tài chính; h) Quy định các nội dung khác có liên quan.", "dieu": "24"}, "17-VBHN-BXD-2026/quy-che/d20": {"heading": "Yêu cầu đối với thành viên Ban quản trị", "text": "Điều 20. Yêu cầu đối với thành viên Ban quản trị 1. Đối với nhà chung cư có nhiều chủ sở hữu và có từ 20 căn hộ trở lên thì phải thành lập Ban quản trị; thành viên Ban quản trị bao gồm đại diện các chủ sở hữu, người sử dụng nhà chung cư nếu chủ sở hữu không tham dự, chủ đầu tư dự án đầu tư xây dựng nhà ở còn sở hữu diện tích trong nhà chung cư, trừ trường hợp chủ đầu tư dự án không cử đại diện tham gia Ban quản trị. Đối với nhà chung cư có một chủ sở hữu thì thành viên Ban quản trị là đại diện chủ sở hữu và người đang sử dụng nhà chung cư. 2. Sau khi được cơ quan có thẩm quyền công nhận Ban quản trị theo quy định tại Điều 23 của Quy chế này thì trong thời hạn không quá 03 tháng, kể từ ngày được công nhận, các thành viên Ban quản trị phải tham gia khóa đào tạo, bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư và được cấp Giấy chứng nhận hoàn thành khóa đào tạo, bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư theo quy định của pháp luật về nhà ở. 3. Khuyến khích người có kinh nghiệm, kiến thức về xây dựng, kiến trúc, tài chính, pháp luật, phòng cháy, chữa cháy tham gia Ban quản trị. Trường hợp thành viên Ban quản trị là người nước ngoài thì phải là người sử dụng được tiếng Việt trong quá trình thực hiện các nhiệm vụ của Ban quản trị.", "dieu": "20"}}};
const state = { sel: {}, all: false, zoom: 1 };   // sel: đường dẫn nút → chỉ số lựa chọn
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function rich(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[\[([^\]\s]+)\]\]([.,;:])?/g, (m, code, punct) => {
      const c = DATA.cites[code];
      if (!c) return m;
      const chip = `<a href="#" role="button" class="cite" data-cite="${esc(code)}" title="Xem nguyên văn ${esc(c.ref)}, ${esc(c.doc)}">${esc(c.label)}</a>`;
      return punct ? `<span class="nw">${chip}${punct}</span>` : chip;   // dấu câu không rơi xuống dòng riêng
    });
}
const resolve = n => (n && n.goto) ? DATA.nodes[n.goto] : n;
const ICON = { step: '›', info: 'i', warn: '!', end: '✓' };

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

/* Vẽ một chuỗi bắt đầu từ node, path là khoá trạng thái */
let seenGoto = new Set();   // chế độ "tất cả nhánh": bước dùng chung chỉ vẽ một lần
function renderChain(node, path, depth = 0) {
  const wrap = el('<div class="chain"></div>');
  let ref = node, n = resolve(node), p = path, guard = 0;
  while (n && guard++ < 60) {
    if (state.all && ref && ref.goto) {
      if (seenGoto.has(ref.goto)) {
        const b = el(`<button class="goto-ref">↪ Tiếp tục ở: <strong>${esc(n.title)}</strong></button>`);
        const id = ref.goto;
        b.onclick = () => { const t = document.querySelector(`[data-goto="${CSS.escape(id)}"]`); if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); const c = t.matches('.card') ? t : t.querySelector('.card,.diamond'); if (c) { c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); } } };
        wrap.append(b);
        break;
      }
      seenGoto.add(ref.goto);
    }
    const anchor = (ref && ref.goto) ? ` data-goto="${esc(ref.goto)}"` : '';
    if (n.kind === 'question') { const qb = renderQuestion(n, p, depth); if (anchor) qb.firstChild.dataset.goto = ref.goto; wrap.append(qb); break; }
    const c = el(`<article class="card ${n.kind}" data-path="${esc(p)}"${anchor}>
      <h3><span class="ico" aria-hidden="true">${ICON[n.kind] || '›'}</span><span>${rich(n.title)}</span></h3>
      ${n.points ? '<ul>' + n.points.map(x => `<li>${rich(x)}</li>`).join('') + '</ul>' : ''}
    </article>`);
    if (n.jump) {
      const b = el(`<button class="jump">↪ ${esc(n.jump.label)}</button>`);
      b.onclick = () => jumpTo(n.jump.to);
      c.append(b);
    }
    wrap.append(c);
    if (!n.next) break;
    wrap.append(el('<div class="vline arrow" aria-hidden="true"></div>'));
    ref = n.next; n = resolve(n.next); p = p + '>';
  }
  return wrap;
}

function renderQuestion(n, path, depth) {
  const box = el('<div class="chain"></div>');
  const isRoot = path === 'r';
  const q = el(`<div class="q${isRoot ? ' root' : ''}" data-path="${esc(path)}">
     <div class="diamond" role="heading" aria-level="${isRoot ? 2 : 3}"><span>${esc(n.title)}</span></div>
     ${n.note ? `<div class="qnote">${rich(n.note)}</div>` : ''}
   </div>`);
  box.append(q);
  box.append(el('<div class="vline" aria-hidden="true"></div>'));
  const chosen = state.sel[path];

  if (state.all) {
    const row = el('<div class="branches"></div>');
    n.options.forEach((o, i) => {
      const br = el('<div class="branch"></div>');
      br.append(el('<div class="vline" aria-hidden="true"></div>'));
      const e = el(`<button class="edge">${esc(o.label)}</button>`);
      e.onclick = () => { state.all = false; selectOnly(path, i); };
      br.append(e, el('<div class="vline arrow" aria-hidden="true"></div>'), renderChain(o.node, `${path}.${i}`, depth + 1));
      row.append(br);
    });
    box.append(row);
    return box;
  }

  const choices = el(`<div class="choices" role="group" aria-label="${esc(n.title)}"></div>`);
  n.options.forEach((o, i) => {
    const b = el(`<button class="opt" aria-expanded="${chosen === i}"><span class="n">${i + 1}.</span> ${esc(o.label)}</button>`);
    b.onclick = () => {
      if (state.sel[path] === i) { clearBelow(path); delete state.sel[path]; }
      else { clearBelow(path); state.sel[path] = i; }
      render(`${path}.${state.sel[path] ?? ''}`);
    };
    choices.append(b);
  });
  box.append(choices);
  if (chosen === undefined) {
    box.append(el(`<div class="hint">${isRoot ? 'Chọn một việc để bắt đầu' : 'Chọn một trường hợp'}</div>`));
  } else {
    box.append(el('<div class="vline arrow" aria-hidden="true"></div>'));
    box.append(renderChain(n.options[chosen].node, `${path}.${chosen}`, depth + 1));
  }
  return box;
}

function clearBelow(path) { for (const k of Object.keys(state.sel)) if (k !== path && k.startsWith(path)) delete state.sel[k]; }
function selectOnly(path, i) { clearBelow(path); state.sel[path] = i; render(`${path}.${i}`); }

/* Đường đang xem: đi từ gốc theo các lựa chọn */
function crumbs() {
  const out = [{ t: DATA.root.title, p: 'r' }];
  let n = DATA.root, p = 'r', g = 0;
  while (n && g++ < 80) {
    if (n.kind === 'question') {
      const i = state.sel[p];
      if (i === undefined) break;
      out.push({ t: n.options[i].label, p: `${p}.${i}` });
      n = resolve(n.options[i].node); p = `${p}.${i}`;
    } else { if (!n.next) break; n = resolve(n.next); p = p + '>'; }
  }
  const nav = $('#crumbs');
  nav.innerHTML = state.all ? '<span>Đang hiện tất cả nhánh. Bấm nhãn nhánh để chỉ xem nhánh đó.</span>' : '<span>Đang xem:</span>';
  if (state.all) { nav.scrollLeft = 0; nav.style.whiteSpace = 'normal'; return; }
  nav.style.whiteSpace = '';
  out.forEach((c, k) => {
    if (k) nav.append(el('<span class="sep" aria-hidden="true">›</span>'));
    const b = el(`<button>${esc(c.t)}</button>`);
    b.onclick = () => scrollToPath(c.p, true);
    nav.append(b);
  });
  nav.scrollLeft = nav.scrollWidth;   // điện thoại: luôn thấy bước cuối
}

function scrollToPath(p, flash) {
  const node = document.querySelector(`[data-path="${CSS.escape(p)}"]`) || document.querySelector(`[data-path^="${CSS.escape(p)}"]`);
  if (!node) return;
  node.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  const card = node.classList.contains('card') ? node : node.querySelector('.card');
  if (flash && card) { card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
}

function render(focusPath) {
  const cv = $('#canvas');
  seenGoto = new Set();
  cv.classList.toggle('all', state.all);
  cv.replaceChildren(renderChain(DATA.root, 'r'));
  cv.style.zoom = state.zoom;
  $('#btnAll').setAttribute('aria-pressed', state.all);
  crumbs();
  const top = state.sel['r'];
  const id = top === undefined ? '' : DATA.root.options[top].id;
  if (('#' + id) !== location.hash && !(id === '' && location.hash === '')) {
    try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (e) { /* trang mở dạng data:/sandbox */ }
  }
  if (focusPath) requestAnimationFrame(() => scrollToPath(focusPath, false));
}

function jumpTo(id) {
  const i = DATA.root.options.findIndex(o => o.id === id);
  if (i < 0) return;
  state.all = false; state.sel = { r: i }; render(`r.${i}`);
}

/* Hộp thoại căn cứ */
function lawHtml(text, hiAll) {
  // tách "1. ", "a) " thành dòng riêng cho dễ đọc
  const parts = text.split(/\s(?=(?:\d{1,2}[a-z]?\.\s)|(?:[a-zđ]\)\s))/);
  return parts.map(s => /^[a-zđ]\)\s/.test(s) ? `<p class="pt">${esc(s)}</p>` : `<p>${esc(s)}</p>`).join('');
}
function openCite(code) {
  const c = DATA.cites[code];
  if (!c) return;
  const ref = c.ref.charAt(0).toUpperCase() + c.ref.slice(1);
  $('#dlgTitle').innerHTML = `${esc(ref)}${c.heading ? '. ' + esc(c.heading) : ''}<span class="doc">${esc(c.doc)}</span>`;
  const st = c.status === 'Còn hiệu lực' ? 'ok' : (c.status ? 'part' : '');
  let h = c.status ? `<div><span class="badge ${st}" title="Tình trạng của cả văn bản, không riêng điều khoản này">Văn bản: ${esc(c.status.toLowerCase())}</span></div>` : '';
  h += `<div class="law">${lawHtml(c.text)}</div>`;
  const notes = [...c.notes, ...c.amended.map(a => 'Sửa đổi: ' + a), ...c.footnotes.map(f => 'Ghi chú trong văn bản hợp nhất: ' + f)];
  if (notes.length) h += `<div class="notes"><ul>${notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if (c.article && DATA.articles[c.article]) {
    const a = DATA.articles[c.article];
    h += `<details><summary>Xem toàn bộ Điều ${esc(a.dieu)}${a.heading ? '. ' + esc(a.heading) : ''}</summary><div class="law">${lawHtml(a.text)}</div></details>`;
  }
  h += `<p class="src">Nguyên văn lấy từ văn bản pháp luật Việt Nam. Thông tin tham khảo, không thay thế tư vấn của luật sư.</p>`;
  $('#dlgBody').innerHTML = h;
  const d = $('#dlg');
  if (!d.open) d.showModal();
  $('#dlgBody').scrollTop = 0;
}

document.addEventListener('click', e => {
  const b = e.target.closest('.cite');
  if (b) { e.preventDefault(); openCite(b.dataset.cite); }
});
$('#dlgClose').onclick = () => $('#dlg').close();
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#btnAll').onclick = () => { state.all = !state.all; render(); };
$('#btnReset').onclick = () => { state.all = false; state.sel = {}; state.zoom = 1; render(); scrollTo({ top: 0 }); };
$('#zoomIn').onclick = () => { state.zoom = Math.min(1.4, +(state.zoom + .1).toFixed(2)); render(); };
$('#zoomOut').onclick = () => { state.zoom = Math.max(.4, +(state.zoom - .1).toFixed(2)); render(); };
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id) jumpTo(id); });

$('#foot').textContent = 'Nội dung rút từ các tài liệu nghiên cứu pháp luật Việt Nam, áp dụng cho chung cư thương mại nhiều chủ sở hữu, một toà nhà; chỉ để tham khảo, không thay thế tư vấn pháp lý.';

const initial = location.hash.slice(1);
const ii = DATA.root.options.findIndex(o => o.id === initial);
if (ii >= 0) state.sel.r = ii;
render();
</script>
</body>
</html>
