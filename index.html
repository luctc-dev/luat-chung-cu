cư; trường hợp không thỏa thuận được giá dịch vụ quản lý vận hành nhà chung cư thì áp dụng mức giá trong khung giá dịch vụ do Ủy ban nhân dân cấp tỉnh ban hành.", "dieu": "151"}, "17-VBHN-BXD-2026/quy-che/d7": {"heading": "Các hoạt động quản lý vận hành nhà chung cư", "text": "Điều 7. Các hoạt động quản lý vận hành nhà chung cư 1. Hoạt động quản lý vận hành nhà chung cư bao gồm các công việc sau đây: a) Điều khiển, duy trì hoạt động, kiểm tra thường xuyên hệ thống thang máy, bảo dưỡng máy bơm nước, máy phát điện, hệ thống báo cháy tự động, hệ thống chữa cháy, dụng cụ chữa cháy, các thiết bị dự phòng và các thiết bị khác thuộc phần sở hữu chung, sử dụng chung của tòa nhà chung cư, cụm nhà chung cư để đảm bảo cho các hệ thống thiết bị này hoạt động bình thường; b) Cung cấp các dịch vụ bảo vệ, vệ sinh môi trường, thu gom rác thải, chăm sóc vườn hoa, cây cảnh, diệt côn trùng và các dịch vụ khác bảo đảm cho nhà chung cư hoạt động bình thường; c) Các công việc khác có liên quan do Hội nghị nhà chung cư quyết định. 2. Trường hợp nhà chung cư phải có đơn vị quản lý vận hành theo quy định tại khoản 1 Điều 149 của Luật Nhà ở thì tất cả các công việc quy định tại khoản 1 Điều này phải do đơn vị quản lý vận hành thực hiện; chủ sở hữu, người sử dụng nhà chung cư không được thuê riêng các dịch vụ khác nhau để thực hiện quản lý vận hành. Đơn vị quản lý vận hành nhà chung cư có thể ký hợp đồng với đơn vị cung cấp dịch vụ để thực hiện các công việc quản lý vận hành nhà chung cư nhưng phải chịu trách nhiệm về việc quản lý vận hành theo nội dung hợp đồng dịch vụ đã ký kết với Ban quản trị.", "dieu": "7"}, "17-VBHN-BXD-2026/quy-che/d14": {"heading": "Hội nghị nhà chung cư", "text": "Điều 14. Hội nghị nhà chung cư 1. Đối với nhà chung cư có một chủ sở hữu thì Hội nghị nhà chung cư là hội nghị của chủ sở hữu nhà chung cư và người sử dụng nhà chung cư. 2. Đối với nhà chung cư có nhiều chủ sở hữu thì Hội nghị nhà chung cư là hội nghị của các chủ sở hữu hoặc người sử dụng nếu chủ sở hữu không tham dự và có văn bản ủy quyền có chữ ký xác nhận của chủ sở hữu này (bao gồm cả trường hợp đã nhận bàn giao căn hộ hoặc phần diện tích khác trong nhà chung cư nhưng chưa thanh toán hết tiền cho chủ đầu tư, trừ trường hợp thuộc diện chấm dứt hợp đồng mua bán, thuê mua căn hộ). 3. Hội nghị nhà chung cư có quyền quyết định các nội dung liên quan đến việc quản lý, sử dụng nhà chung cư theo quy định tại khoản 3 hoặc khoản 4 Điều 145 của Luật Nhà ở và quy định tại Quy chế này. Các quyết định của Hội nghị nhà chung cư phải lập thành biên bản có chữ ký của các thành viên chủ trì hội nghị và thư ký Hội nghị nhà chung cư.", "dieu": "14"}, "17-VBHN-BXD-2026/quy-che/d18": {"heading": "Thành phần tham dự và việc biểu quyết tại Hội nghị nhà chung cư", "text": "Điều 18. Thành phần tham dự và việc biểu quyết tại Hội nghị nhà chung cư 1. Đối với tòa nhà chung cư, cụm nhà chung cư có một chủ sở hữu thì thành phần tham dự Hội nghị nhà chung cư bao gồm đại diện chủ sở hữu, người sử dụng nhà chung cư và mời đại diện của Ủy ban nhân dân cấp xã nơi có nhà chung cư tham dự. 2. Đối với tòa nhà chung cư, cụm nhà chung cư có nhiều chủ sở hữu thì thành phần tham dự Hội nghị nhà chung cư được quy định như sau: a) Trường hợp tổ chức Hội nghị nhà chung cư lần đầu thì thành phần tham dự bao gồm đại diện chủ đầu tư, đại diện chủ sở hữu căn hộ đã nhận bàn giao, đại diện đơn vị quản lý vận hành nhà chung cư (nếu có) và mời đại diện của Ủy ban nhân dân cấp xã; trường hợp chủ đầu tư không tổ chức Hội nghị nhà chung cư theo quy định tại Điều 15 của Quy chế này và cũng không cử đại diện tham dự thì vẫn phải chấp hành các quyết định của Hội nghị nhà chung cư; b) Trường hợp tổ chức Hội nghị nhà chung cư bất thường và Hội nghị nhà chung cư thường niên thì thành phần tham dự bao gồm đại diện chủ sở hữu căn hộ đã nhận bàn giao, đại diện chủ đầu tư (nếu chủ đầu tư còn sở hữu diện tích trong nhà chung cư), đại diện đơn vị quản lý vận hành (nếu nhà chung cư phải thuê đơn vị quản lý vận hành) và mời đại diện của Ủy ban nhân dân cấp xã; trường hợp các thành phần quy định tại điểm này không cử đại diện tham dự thì vẫn phải chấp hành các quyết định của Hội nghị nhà chung cư. 3. Quyền biểu quyết tại Hội nghị tòa nhà chung cư, cụm nhà chung cư được tính theo diện tích sở hữu riêng của chủ sở hữu căn hộ, chủ sở hữu phần diện tích khác trong nhà chung cư theo nguyên tắc 1m2 diện tích sở hữu riêng tương đương với 01 phiếu biểu quyết; nếu diện tích căn hộ có số lẻ không đủ 1m2 thì không được tính 01 phiếu để biểu quyết; trường hợp không thống nhất được về diện tích sở hữu riêng của chủ sở hữu nhà chung cư thì xác định theo diện tích ghi trong hợp đồng mua bán, thuê mua căn hộ hoặc phần diện tích khác trong nhà chung cư. Các quyết định của Hội nghị nhà chung cư được thông qua theo nguyên tắc đa số phiếu biểu quyết của các chủ sở hữu, người sử dụng tham dự Hội nghị nhà chung cư. 4. Việc biểu quyết tại Hội nghị tòa nhà chung cư, cụm nhà chung cư được thực hiện theo quy định tại khoản 5 Điều 145 của Luật Nhà ở; trường hợp do dịch bệnh, thiên tai mà không thể tổ chức họp trực tiếp thì họp trực tuyến hoặc trực tiếp kết hợp trực tuyến để biểu quyết nhưng phải đáp ứng đủ số lượng và thành phần tham dự Hội nghị nhà chung cư theo quy định của Quy chế này. Đối với chủ sở hữu, người sử dụng là người khuyết tật không thể tham dự Hội nghị nhà chung cư thì lấy phiếu biểu quyết tại địa chỉ căn hộ nơi người này cư trú. 5. Chủ sở hữu căn hộ hoặc chủ sở hữu phần diện tích khác trong nhà chung cư được ủy quyền cho chủ sở hữu khác trong nhà chung cư đó hoặc người đang sử dụng nhà chung cư đó dự họp và thay mặt chủ sở hữu biểu quyết tại Hội nghị nhà chung cư. Đối với các căn hộ thuộc tài sản công (bao gồm cả căn hộ chưa có người sử dụng) thì cơ quan đại diện chủ sở hữu dự họp và thực hiện quyền biểu quyết. Trường hợp căn hộ đang có người sử dụng mà cơ quan đại diện chủ sở hữu ủy quyền cho người sử dụng căn hộ tham gia dự họp thì người sử dụng căn hộ được dự họp và thực hiện biểu quyết tại Hội nghị nhà chung cư. 6. Trường hợp biểu quyết để thực hiện phá dỡ, cải tạo xây dựng lại nhà chung cư thì việc biểu quyết thực hiện theo quy định của pháp luật về cải tạo, xây dựng lại nhà chung cư.", "dieu": "18"}, "140-2025-ND-CP/d15": {"heading": "Nhiệm vụ, thẩm quyền liên quan đến giải quyết khiếu nại, giải quyết tranh chấp về nhà ở", "text": "Điều 15. Nhiệm vụ, thẩm quyền liên quan đến giải quyết khiếu nại, giải quyết tranh chấp về nhà ở 1. Trách nhiệm giải quyết khiếu nại trong quá trình thực hiện các quy định liên quan đến nhà đất trong quá trình thực hiện các chính sách quản lý nhà đất và chính sách cải tạo xã hội chủ nghĩa trước ngày 01 tháng 7 năm 1991 quy định tại khoản 1, khoản 4 Điều 16 Nghị quyết số 755/2005/UBTVQH11 ngày 02 tháng 4 năm 2005 của Ủy ban Thường vụ Quốc hội quy định việc giải quyết đối với một số trường hợp cụ thể về nhà đất trong quá trình thực hiện các chính sách quản lý nhà đất và chính sách cải tạo xã hội chủ nghĩa trước ngày 01 tháng 7 năm 1991 do Chủ tịch Ủy ban nhân dân cấp xã thực hiện. 2. Trách nhiệm xác nhận số người cùng sinh sống trong hộ gia đình quy định tại điểm b khoản 3 Điều 9 Nghị định số 127/2005/NĐ-CP ngày 10 tháng 10 năm 2005 của Chính phủ hướng dẫn thực hiện Nghị quyết số 23/2003/QH11 ngày 26 tháng 11 năm 2003 của Quốc hội và Nghị quyết số 755/2005/NQ-UBTVQH11 ngày 02 tháng 4 năm 2005 của Ủy ban Thường vụ Quốc hội quy định việc giải quyết đối với một số trường hợp cụ thể về nhà đất trong quá trình thực hiện các chính sách quản lý nhà đất và chính sách cải tạo xã hội chủ nghĩa trước ngày 01 tháng 7 năm 1991 do cơ quan công an cấp xã thực hiện. 3. Trách nhiệm giải quyết tranh chấp về kinh phí quản lý vận hành nhà chung cư, quản lý sử dụng kinh phí bảo trì quy định tại khoản 4 Điều 194 Luật Nhà ở năm 2023 do Ủy ban nhân dân cấp xã thực hiện.", "dieu": "15"}, "27-2023-QH15/d153": {"heading": "Quản lý, bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "text": "Điều 153. Quản lý, bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu 1. Chủ đầu tư dự án đầu tư xây dựng nhà ở có trách nhiệm lập tài khoản để quản lý kinh phí bảo trì theo quy định sau đây: a) Trước khi ký hợp đồng mua bán, thuê mua căn hộ, phần diện tích khác trong nhà chung cư, chủ đầu tư dự án đầu tư xây dựng nhà ở có trách nhiệm mở một tài khoản thanh toán tại một tổ chức tín dụng hoặc chi nhánh ngân hàng nước ngoài đang hoạt động trên địa bàn nơi có nhà chung cư để người mua, thuê mua căn hộ, phần diện tích khác trong nhà chung cư và chủ đầu tư dự án đầu tư xây dựng nhà ở nộp kinh phí bảo trì theo quy định tại Điều 152 của Luật này. Trong thời hạn 05 ngày làm việc, kể từ ngày mở tài khoản, chủ đầu tư dự án đầu tư xây dựng nhà ở phải có văn bản thông báo cho cơ quan quản lý nhà ở cấp tỉnh nơi có dự án biết về tên chủ tài khoản, số tài khoản đã mở, tên tổ chức tín dụng, chi nhánh ngân hàng nước ngoài nơi mở tài khoản và kỳ hạn gửi tiền. Chủ đầu tư dự án đầu tư xây dựng nhà ở không được yêu cầu tổ chức tín dụng, chi nhánh ngân hàng nước ngoài trích kinh phí mà các bên đã nộp vào tài khoản đã lập theo quy định tại điểm này để sử dụng vào bất kỳ mục đích nào khác khi chưa bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư. Trường hợp trong thời gian chưa bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư mà phát sinh việc bảo trì hạng mục, trang thiết bị thuộc phần sở hữu chung của nhà chung cư đã hết thời hạn bảo hành theo quy định thì chủ đầu tư dự án đầu tư xây dựng nhà ở có trách nhiệm sử dụng kinh phí của chủ đầu tư dự án đầu tư xây dựng nhà ở để thực hiện việc bảo trì hạng mục, trang thiết bị này nhưng phải tuân thủ kế hoạch, quy trình bảo trì công trình được lập theo quy định của pháp luật về xây dựng. Khi bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư, chủ đầu tư dự án đầu tư xây dựng nhà ở được hoàn trả lại các khoản kinh phí đã sử dụng cho việc bảo trì này nhưng phải có văn bản báo cáo cụ thể kèm theo kế hoạch, quy trình bảo trì đã lập và phải có hóa đơn, chứng từ chứng minh việc bảo trì này; b) Khi ký hợp đồng mua bán, thuê mua căn hộ, phần diện tích khác trong nhà chung cư, các bên phải ghi rõ trong hợp đồng thông tin về tài khoản đã mở theo quy định tại điểm a khoản này. Người mua, thuê mua trước khi nhận bàn giao căn hộ, phần diện tích khác trong nhà chung cư phải đóng kinh phí bảo trì theo quy định tại Điều 152 của Luật này vào tài khoản đã ghi trong hợp đồng và sao gửi xác nhận đã đóng kinh phí bảo trì cho chủ đầu tư dự án đầu tư xây dựng nhà ở; trường hợp không đóng kinh phí bảo trì thì không được bàn giao căn hộ, phần diện tích khác trong nhà chung cư đã mua, thuê mua; nếu chủ đầu tư dự án đầu tư xây dựng nhà ở vẫn bàn giao thì chủ đầu tư dự án đầu tư xây dựng nhà ở phải nộp khoản kinh phí bảo trì đối với căn hộ, phần diện tích này. 2. Việc bàn giao kinh phí bảo trì được quy định như sau: a) Sau khi có quyết định công nhận Ban quản trị nhà chung cư của cơ quan có thẩm quyền, Ban quản trị nhà chung cư có trách nhiệm mở tài khoản tại tổ chức chức tín dụng, chi nhánh ngân hàng nước ngoài đang hoạt động tại Việt Nam để quản lý kinh phí bảo trì và có văn bản đề nghị chủ đầu tư dự án đầu tư xây dựng nhà ở bàn giao kinh phí bảo trì đã thu theo quy định tại khoản 1 Điều này; b) Trong thời hạn 30 ngày, kể từ ngày có văn bản đề nghị của Ban quản trị nhà chung cư, chủ đầu tư dự án đầu tư xây dựng nhà ở và Ban quản trị nhà chung cư phải thống nhất quyết toán số liệu kinh phí bảo trì để làm cơ sở bàn giao kinh phí bảo trì theo Quy chế quản lý, sử dụng nhà chung cư; c) Căn cứ số liệu quyết toán kinh phí bảo trì quy định tại điểm b khoản này, chủ đầu tư dự án đầu tư xây dựng nhà ở đề nghị tổ chức tín dụng, chi nhánh ngân hàng nước ngoài đang quản lý tài khoản kinh phí bảo trì chuyển kinh phí này và lãi phát sinh từ kinh phí bảo trì sang tài khoản quản lý kinh phí do Ban quản trị nhà chung cư lập; d) Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài có trách nhiệm chuyển kinh phí quy định tại điểm c khoản này cho Ban quản trị nhà chung cư theo số liệu hai bên đã quyết toán. Các chi phí phát sinh từ việc chuyển giao kinh phí bảo trì được khấu trừ vào kinh phí bảo trì. 3. Sau khi bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư, chủ đầu tư dự án đầu tư xây dựng nhà ở có trách nhiệm đóng tài khoản đã lập theo quy định của pháp luật và có văn bản thông báo cho cơ quan quản lý nhà ở cấp tỉnh nơi có nhà chung cư đó biết để theo dõi. 4. Trường hợp nhà chung cư có nguồn thu từ việc khai thác dịch vụ đối với phần sở hữu chung thì phải nộp vào tài khoản kinh phí bảo trì do Ban quản trị nhà chung cư quản lý hoặc người được giao quản lý tài khoản kinh phí bảo trì đối với trường hợp không bắt buộc thành lập Ban quản trị nhà chung cư để bảo trì nhà chung cư. Nguồn thu quy định tại khoản này và lãi phát sinh từ tiền gửi kinh phí bảo trì được sử dụng vào việc bảo trì nhà chung cư.", "dieu": "153"}, "27-2023-QH15/d154": {"heading": "Cưỡng chế bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "text": "Điều 154. Cưỡng chế bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu 1. Trường hợp chủ đầu tư dự án đầu tư xây dựng nhà ở không bàn giao kinh phí bảo trì theo quy định tại khoản 2 Điều 153 của Luật này, Ban quản trị nhà chung cư có văn bản đề nghị Ủy ban nhân dân cấp huyện nơi có nhà chung cư yêu cầu chủ đầu tư dự án đầu tư xây dựng nhà ở bàn giao kinh phí bảo trì. 2. Trong thời hạn 15 ngày, kể từ ngày nhận được văn bản của Ban quản trị nhà chung cư, Ủy ban nhân dân cấp huyện phải có văn bản yêu cầu chủ đầu tư dự án đầu tư xây dựng nhà ở bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư. 3. Trong thời hạn 10 ngày, kể từ ngày có văn bản của Ủy ban nhân dân cấp huyện mà chủ đầu tư dự án đầu tư xây dựng nhà ở không bàn giao kinh phí bảo trì thì Ủy ban nhân dân cấp huyện có trách nhiệm ban hành quyết định cưỡng chế và tổ chức thu hồi kinh phí bảo trì để bàn giao cho Ban quản trị nhà chung cư theo quyết định cưỡng chế. Trong quá trình thực hiện cưỡng chế bàn giao kinh phí bảo trì, nếu phát hiện chủ đầu tư dự án đầu tư xây dựng nhà ở có dấu hiệu tội phạm thì Ủy ban nhân dân cấp huyện kiến nghị bằng văn bản và gửi kèm theo chứng cứ, tài liệu liên quan cho cơ quan điều tra có thẩm quyền xem xét, xử lý theo quy định của pháp luật. 4. Chính phủ quy định chi tiết Điều này.", "dieu": "154"}, "17-VBHN-BXD-2026/quy-che/d23": {"heading": "Thủ tục công nhận và thông báo hoạt động của Ban quản trị", "text": "Điều 23. Thủ tục công nhận và thông báo hoạt động của Ban quản trị 1. Trong thời hạn 10 ngày, kể từ ngày có biên bản bầu Ban quản trị hoặc thành viên Ban quản trị theo quy định (bao gồm trường hợp bầu Ban quản trị lần đầu, bầu Ban quản trị khi hết nhiệm kỳ, bầu Ban quản trị khi bị bãi nhiệm, miễn nhiệm, bầu Ban quản trị mới khi tách, nhập Ban quản trị), Ban quản trị có trách nhiệm nộp trực tiếp hoặc qua dịch vụ bưu chính hoặc trực tuyến 01 bộ hồ sơ đề nghị công nhận Ban quản trị quy định tại Điều 22 của Quy chế này tại Ủy ban nhân dân cấp xã nơi có nhà chung cư. 2. Trong thời hạn 07 ngày làm việc, kể từ ngày nhận đầy đủ hồ sơ đề nghị của Ban quản trị, 31Ủy ban nhân dân cấp xã nơi có nhà chung cư kiểm tra hồ sơ và ban hành quyết định công nhận Ban quản trị. 3. Nội dung quyết định công nhận Ban quản trị bao gồm: a) Tên Ban quản trị; b) Số lượng thành viên Ban quản trị; c) Danh sách các thành viên Ban quản trị, trong đó nêu chức danh Trưởng ban, Phó ban quản trị; d) Nhiệm kỳ hoạt động của Ban quản trị; đ) Trách nhiệm thi hành quyết định của các tổ chức, cá nhân có liên quan; e) Thay thế quyết định công nhận trước đó (nếu có). 4. Sau khi có quyết định công nhận Ban quản trị của 32Ủy ban nhân dân cấp xã, Ban quản trị được công nhận có trách nhiệm lập tài khoản hoạt động của Ban quản trị; trường hợp nhà chung cư có nhiều chủ sở hữu thì Ban quản trị phải lập tài khoản quản lý kinh phí bảo trì phần sở hữu chung theo quy định của pháp luật về nhà ở, Quy chế này và đăng ký con dấu theo quy định của pháp luật về đăng ký quản lý con dấu (tên Ban quản trị khắc trên con dấu phải trùng với tên Ban quản trị đã được công nhận), trừ trường hợp Ban quản trị đã có con dấu và có tài khoản được lập theo quy định. 5. Ban quản trị có một chủ sở hữu được hoạt động kể từ khi được 33Ủy ban nhân dân cấp xã công nhận. Ban quản trị có nhiều chủ sở hữu được hoạt động kể từ khi có con dấu được đăng ký theo quy định của pháp luật và có các tài khoản được lập theo quy định của Quy chế này. Đối với Ban quản trị có nhiều chủ sở hữu đã có con dấu, có tài khoản được lập theo quy định mà không thuộc trường hợp đổi tên Ban quản trị thì phải có văn bản thông báo cho tổ chức tín dụng nơi đã mở tài khoản kèm theo bản sao có chứng thực quyết định công nhận Ban quản trị để thực hiện các giao dịch với tổ chức tín dụng theo quy định. 6. Trường hợp thay thế một hoặc một số thành viên Ban quản trị thì Ban quản trị chỉ đề xuất công nhận các thành viên được bầu thay thế và cơ quan có thẩm quyền quy định tại khoản 4 Điều này ban hành quyết định công nhận Ban quản trị mới để thay thế cho quyết định công nhận đã ban hành trước đó.", "dieu": "23"}, "17-VBHN-BXD-2026/quy-che/d17": {"heading": "Hội nghị nhà chung cư thường niên", "text": "Điều 17. Hội nghị nhà chung cư thường niên 1. Hội nghị nhà chung cư thường niên được tổ chức mỗi năm một lần khi có tối thiểu 30% đại diện chủ sở hữu căn hộ đã nhận bàn giao tham dự hoặc có số lượng ít hơn do các chủ sở hữu nhà chung cư thống nhất trong Hội nghị nhà chung cư lần đầu. Hội nghị tòa nhà chung cư, cụm nhà chung cư thường niên có các nội dung sau đây: a) Thông qua báo cáo của Ban quản trị về kết quả hoạt động của Ban quản trị và thông qua các khoản thu, chi hàng năm của Ban quản trị; b) Xem xét, thông qua quyết toán kinh phí bảo trì phần sở hữu chung của nhà chung cư trong năm và thông qua kế hoạch bảo trì phần sở hữu chung nhà chung cư của năm sau do Ban quản trị báo cáo; c) Xem xét, quyết định việc tiếp tục ký hợp đồng với đơn vị quản lý vận hành nhà chung cư trong trường hợp hợp đồng có thời hạn 12 tháng; d) Quyết định các nội dung khác theo quy định tại điểm g khoản 3 Điều 145 của Luật Nhà ở (nếu có). 2. Đối với Hội nghị tòa nhà chung cư thường niên mà kết hợp quyết định một trong các vấn đề sau đây thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao tham dự: a) Bầu thay thế Trưởng ban hoặc Phó ban quản trị trong trường hợp phải bầu các vị trí này theo quy định tại điểm a khoản 3 Điều 26 hoặc điểm a khoản 4 Điều 26 của Quy chế này; b) Miễn nhiệm hoặc bãi nhiệm toàn bộ các thành viên Ban quản trị và bầu Ban quản trị mới; c) Bầu thay thế thành viên Ban quản trị không phải là Trưởng ban, Phó ban do bị miễn nhiệm, bãi nhiệm hoặc bị chết, mất tích trong trường hợp đã tổ chức lấy ý kiến của các chủ sở hữu nhà chung cư nhưng không đủ số người đồng ý theo quy định tại điểm b khoản 3 Điều 26 hoặc theo quy định tại điểm b khoản 4 Điều 26 của Quy chế này; d) Quyết định nội dung quy định tại điểm d khoản 1 Điều 16 của Quy chế này hoặc việc tiếp tục ký hợp đồng dịch vụ quản lý vận hành với đơn vị đang thực hiện quản lý vận hành nhưng hết hạn hợp đồng theo quy định tại khoản 1 Điều 29 của Quy chế này. 3. Đối với Hội nghị cụm nhà chung cư thường niên mà kết hợp quyết định các vấn đề quy định tại điểm a, b, c và điểm d khoản 1 Điều 16 của Quy chế này thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao của cụm nhà chung cư đó tham dự. 4. Đối với Hội nghị tòa nhà, cụm nhà chung cư thường niên mà kết hợp quyết định việc phá dỡ để cải tạo xây dựng lại nhà chung cư theo quy định của pháp luật về nhà ở thì thực hiện theo quy định của pháp luật về cải tạo, xây dựng lại nhà chung cư. 5. Ban quản trị có trách nhiệm chuẩn bị nội dung, thông báo thời gian, địa điểm và tổ chức họp hội nghị chính thức cho các chủ sở hữu, người sử dụng nhà chung cư; Ban quản trị có thể tổ chức họp trù bị để chuẩn bị các nội dung cho cuộc họp hội nghị chính thức. 6. Trường hợp quyết định các nội dung quy định tại khoản 2 hoặc khoản 3 Điều này mà không đủ số người tham dự thì Ban quản trị có văn bản đề nghị Ủy ban nhân dân cấp xã tổ chức Hội nghị nhà chung cư theo quy định tại khoản 5, khoản 6 Điều 16 của Quy chế này; đối với trường hợp thuộc diện quy định tại điểm b khoản 2 Điều này mà Ban quản trị không có văn bản đề nghị thì phải có đơn của đại diện chủ sở hữu gửi Ủy ban nhân dân cấp xã. 7. Trường hợp qua giám sát, thảo luận tại Hội nghị nhà chung cư mà chủ sở hữu nhà chung cư phát hiện có hành vi vi phạm về tài chính của Ban quản trị, thành viên Ban quản trị thì tùy theo mức độ vi phạm, Hội nghị nhà chung cư có thể quyết định bãi nhiệm một, một số hoặc toàn bộ thành viên Ban quản trị và bầu thay thế các thành viên khác theo quy định tại khoản 2 hoặc khoản 3 và khoản 6 Điều này; trường hợp có xuất hiện hành vi có liên quan đến pháp luật hình sự thì Hội nghị nhà chung cư xem xét, đề nghị cơ quan có thẩm quyền xử lý theo quy định của pháp luật. Trong trường hợp cần thiết, Hội nghị nhà chung cư quyết định lập tổ kiểm tra hoặc thuê đơn vị có chuyên môn để kiểm tra sổ sách và việc thu, chi tài chính của Ban quản trị; trường hợp thuê đơn vị chuyên môn thì các chủ sở hữu, người sử dụng nhà chung cư phải đóng góp kinh phí để thanh toán chi phí cho đơn vị này theo thỏa thuận.", "dieu": "17"}, "HN-25-2026-QD-UBND/d1": {"heading": "Sửa đổi, bổ sung khoản 1 Điều 3", "text": "Điều 1. Sửa đổi, bổ sung khoản 1 Điều 3 “1. Khung giá dịch vụ quản lý vận hành nhà chung cư: 2 Đơn vị tính: đồng/m2 sàn thông thủy/tháng. Giá tối thiểu Giá tối đa Loại nhà chung cư (đồng/m /tháng) (đồng/m2/tháng) 2 1. Nhà chung cư không có thang máy 700 5.000 2. Nhà chung cư có thang máy 1.200 16.500 (Trong khung giá này chưa bao gồm: Bảo hiểm cháy nổ; mức thù lao của các thành viên của Ban quản trị; các khoản thu được từ kinh doanh dịch vụ cao cấp như tắm hơi, bể bơi, truyền hình cáp, internet, hoặc các dịch vụ cao cấp khác)”", "dieu": "1"}, "339-2026-ND-CP/d59": {"heading": "Vi phạm quy định của chủ đầu tư về quản lý, sử dụng nhà chung cư và kinh phí bảo trì", "text": "Điều 59. Vi phạm quy định của chủ đầu tư về quản lý, sử dụng nhà chung cư và kinh phí bảo trì 1. Phạt tiền từ 80.000.000 đồng đến 100.000.000 đồng đối với một trong các hành vi sau đây: a) Không mở tài khoản thanh toán hoặc mở tài khoản thanh toán để quản lý kinh phí bảo trì phần sở hữu chung nhà chung cư không đúng quy định; b) Không có hoặc chậm có văn bản đề nghị Ủy ban nhân dân cấp xã tổ chức Hội nghị nhà chung cư lần đầu đối với trường hợp không đủ điều kiện về số lượng người tham gia Hội nghị nhà chung cư lần đầu theo quy định; c) Không có văn bản thông báo hoặc thông báo không đầy đủ thông tin cho cơ quan quản lý nhà ở cấp tỉnh nơi có dự án biết về tên tài khoản, số tài khoản đã mở, tên tổ chức tín dụng nơi mở tài khoản, chi nhánh ngân hàng nước ngoài nơi mở tài khoản và kỳ hạn gửi tiền kinh phí bảo trì; d) Không lập kế hoạch bảo trì hoặc lập kế hoạch bảo trì không đúng quy định; đ) Không thực hiện hoặc thực hiện không đầy đủ trách nhiệm bảo trì, quản lý vận hành, khai thác theo nội dung dự án đã được phê duyệt theo quy định trong thời gian chưa bàn giao công trình hạ tầng kỹ thuật khu vực có nhà chung cư theo quy định; e) Không công khai hồ sơ theo quy định của pháp luật về nhà ở cho người mua, thuê mua căn hộ trước khi bàn giao căn hộ chung cư theo quy định hoặc bàn giao nhưng không lập biên bản kèm theo các giấy tờ pháp lý có liên quan đến nhà ở mua bán, thuê mua. 2. Phạt tiền từ 160.000.000 đồng đến 200.000.000 đồng đối với một trong các hành vi sau đây: a) Xác định kinh phí bảo trì phần sở hữu chung nhà chung cư không đúng quy định; b) Không ghi hoặc ghi không đúng thông tin về tài khoản thanh toán để quản lý kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định trong hợp đồng mua bán, thuê mua nhà ở hoặc phần diện tích khác của nhà chung cư; c) Không đề nghị tổ chức tín dụng, chi nhánh ngân hàng nước ngoài đang quản lý tài khoản kinh phí bảo trì chuyển kinh phí và lãi phát sinh từ kinh phí bảo trì sang tài khoản quản lý kinh phí bảo trì do Ban quản trị nhà chung cư lập; d) Bán, cho thuê chỗ để xe ô tô trong nhà chung cư không đúng quy định. 3. Phạt tiền từ 200.000.000 đồng đến 260.000.000 đồng đối với một trong các hành vi sau đây: a) Không bố trí diện tích hoặc bố trí không đủ diện tích để làm nhà sinh hoạt cộng đồng, không gian sinh hoạt cộng đồng theo quy định; b) Quản lý, sử dụng kinh phí quản lý vận hành không đúng quy định; c) Không tổ chức Hội nghị nhà chung cư lần đầu theo quy định; d) Không lập hoặc lập không đúng, không đầy đủ tài liệu quyết toán kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định. 4. Phạt tiền từ 260.000.000 đồng đến 300.000.000 đồng đối với một trong các hành vi sau đây: a) Tự ý chuyển đổi công năng, mục đích sử dụng phần sở hữu chung, sử dụng chung của nhà chung cư hoặc sử dụng căn hộ chung cư vào mục đích không phải để ở; b) Tự ý sử dụng phần diện tích và trang thiết bị thuộc quyền sở hữu chung, sử dụng chung không đúng quy định; c) Thay đổi mục đích sử dụng phần diện tích làm dịch vụ trong nhà chung cư có mục đích sử dụng hỗn hợp mà không được cơ quan nhà nước có thẩm quyền cho phép; d) Xác định diện tích căn hộ hoặc phần diện tích khác trong nhà chung cư thuộc sở hữu riêng không đúng quy định; đ) Không đóng hoặc đóng không đầy đủ kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định đối với diện tích căn hộ, phần diện tích khác mà chủ đầu tư giữ lại không bán hoặc chưa bán, chưa cho thuê mua tính đến thời điểm bàn giao đưa nhà chung cư vào sử dụng; e) Không bàn giao hoặc bàn giao không đầy đủ hoặc bàn giao không đúng thời hạn hồ sơ nhà chung cư cho Ban quản trị nhà chung cư theo quy định; g) Không bàn giao, bàn giao chậm, bàn giao không đầy đủ kinh phí bảo trì và tiền lãi gửi kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định; h) Quản lý, sử dụng kinh phí bảo trì không đúng quy định. 5. Biện pháp khắc phục hậu quả: a) Buộc mở tài khoản thanh toán để quản lý kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định đối với hành vi quy định tại điểm a khoản 1 Điều này; b) Buộc có văn bản đề nghị Ủy ban nhân dân cấp xã tổ chức Hội nghị nhà chung cư theo quy định đối với hành vi quy định tại điểm b khoản 1 Điều này; c) Buộc có văn bản thông báo đầy đủ thông tin về việc mở tài khoản gửi tiền kinh phí bảo trì theo quy định cho cơ quan quản lý nhà ở cấp tỉnh đối với hành vi quy định tại điểm c khoản 1 Điều này; d) Buộc lập kế hoạch bảo trì theo quy định đối với hành vi quy định tại điểm d khoản 1 Điều này; đ) Buộc thực hiện trách nhiệm bảo trì, quản lý vận hành, khai thác theo quy định trong trường hợp chưa bàn giao công trình đối với hành vi quy định tại điểm đ khoản 1 Điều này; e) Buộc công khai hồ sơ theo quy định của pháp luật về nhà ở cho người mua, thuê mua căn hộ trước khi bàn giao căn hộ chung cư theo quy định hoặc buộc lập biên bản bàn giao kèm theo các giấy tờ pháp lý có liên quan đến nhà ở mua bán, thuê mua đối với hành vi quy định tại điểm e khoản 1 Điều này; g) Buộc xác định lại kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định đối với hành vi quy định tại điểm a khoản 2 Điều này; h) Buộc bổ sung đầy đủ thông tin về tài khoản thanh toán kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định đối với hành vi quy định tại điểm b khoản 2 Điều này trong trường hợp khách hàng chưa nộp đủ kinh phí bảo trì; i) Buộc có văn bản đề nghị theo quy định đối với hành vi quy định tại điểm c khoản 2 Điều này; k) Buộc điều chỉnh việc bán, cho thuê chỗ để xe ô tô trong nhà chung cư đúng quy định đối với hành vi quy định tại điểm d khoản 2 Điều này; l) Buộc bố trí đủ diện tích theo quy định đối với hành vi quy định tại điểm a khoản 3 Điều này; m) Buộc bồi hoàn số tiền sử dụng không đúng quy định đối với hành vi quy định tại điểm b khoản 3 và điểm h khoản 4 Điều này; n) Buộc tổ chức Hội nghị nhà chung cư lần đầu theo quy định đối với hành vi quy định tại điểm c khoản 3 Điều này; o) Buộc lập đầy đủ tài liệu quyết toán kinh phí bảo trì theo quy định đối với hành vi quy định tại điểm d khoản 3 Điều này, trừ tài liệu không thể lập sau thời điểm ban hành quyết định xử phạt; p) Buộc khôi phục lại tình trạng ban đầu hoặc buộc sử dụng đúng mục đích đối với các hành vi quy định tại điểm a, điểm b, điểm c khoản 4 Điều này; q) Buộc xác định diện tích căn hộ hoặc phần diện tích khác trong nhà chung cư thuộc sở hữu riêng theo quy định đối với hành vi quy định tại điểm d khoản 4 Điều này đối với hợp đồng mua bán, thuê mua nhà ở chưa thanh lý; r) Buộc đóng đầy đủ kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định đối với hành vi quy định tại điểm đ khoản 4 Điều này; s) Buộc bàn giao hồ sơ theo quy định đối với hành vi quy định tại điểm e khoản 4 Điều này; t) Buộc bàn giao kinh phí bảo trì phần sở hữu chung nhà chung cư và toàn bộ phần lãi phát sinh theo quy định đối với hành vi quy định tại điểm g khoản 4 Điều này.", "dieu": "59"}, "27-2023-QH15/d194": {"heading": "Giải quyết tranh chấp về nhà ở", "text": "Điều 194. Giải quyết tranh chấp về nhà ở 1. Nhà nước khuyến khích các bên giải quyết tranh chấp về nhà ở thông qua hòa giải. 2. Tranh chấp về quyền sở hữu, quyền sử dụng nhà ở của tổ chức, cá nhân, tranh chấp liên quan đến giao dịch về nhà ở, quản lý vận hành nhà chung cư do Tòa án, trọng tài thương mại giải quyết theo quy định của pháp luật. 3. Tranh chấp về quản lý, sử dụng nhà ở thuộc tài sản công được giải quyết như sau: a) Ủy ban nhân dân cấp tỉnh giải quyết đối với nhà ở được giao cho địa phương quản lý; b) Bộ Xây dựng giải quyết đối với nhà ở được giao cho cơ quan trung ương quản lý, trừ nhà ở do Bộ Quốc phòng, Bộ Công an quản lý; c) Bộ Quốc phòng, Bộ Công an giải quyết đối với nhà ở do Bộ Quốc phòng, Bộ Công an quản lý; d) Tòa án giải quyết theo quy định của pháp luật về tố tụng hành chính. 4. Tranh chấp về kinh phí quản lý vận hành nhà chung cư, quản lý, sử dụng kinh phí bảo trì do Ủy ban nhân dân cấp huyện nơi có nhà ở đó hoặc Tòa án, trọng tài thương mại giải quyết theo quy định của pháp luật. 5. Chính phủ quy định chi tiết khoản 3 Điều này.", "dieu": "194"}, "27-2023-QH15/d152": {"heading": "Kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "text": "Điều 152. Kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu 1. Đối với căn hộ, phần diện tích khác trong nhà chung cư mà chủ đầu tư dự án đầu tư xây dựng nhà ở bán, cho thuê mua thì người mua, thuê mua phải đóng kinh phí bảo trì là 2% giá trị căn hộ, phần diện tích bán, cho thuê mua này; khoản tiền này được tính riêng với tiền bán, tiền thuê mua căn hộ, phần diện tích khác trong nhà chung cư và được quy định rõ trong hợp đồng mua bán, hợp đồng thuê mua. 2. Đối với căn hộ, phần diện tích khác trong nhà chung cư mà chủ đầu tư dự án đầu tư xây dựng nhà ở giữ lại không bán, không cho thuê mua hoặc chưa bán, chưa cho thuê mua tính tại thời điểm bàn giao đưa nhà chung cư vào sử dụng, trừ phần diện tích thuộc sở hữu chung thì chủ đầu tư dự án đầu tư xây dựng nhà ở phải đóng kinh phí bảo trì là 2% giá trị căn hộ, phần diện tích giữ lại; phần giá trị này được tính theo giá bán căn hộ có giá cao nhất của nhà chung cư đó tại thời điểm bàn giao đưa nhà chung cư vào sử dụng. 3. Trường hợp chủ đầu tư dự án đầu tư xây dựng nhà ở ký hợp đồng mua bán, thuê mua căn hộ hoặc phần diện tích khác trong nhà chung cư trước ngày 01 tháng 7 năm 2006 mà chưa thu kinh phí bảo trì thì các chủ sở hữu nhà chung cư họp Hội nghị nhà chung cư để thống nhất mức đóng góp kinh phí này; mức đóng góp kinh phí có thể được nộp hằng tháng vào tài khoản tại tổ chức tín dụng hoặc chi nhánh ngân hàng nước ngoài đang hoạt động tại Việt Nam do Ban quản trị nhà chung cư lập hoặc được đóng khi phát sinh công việc cần bảo trì. 4. Trường hợp chủ đầu tư dự án đầu tư xây dựng nhà ở ký hợp đồng mua bán, thuê mua căn hộ hoặc phần diện tích khác trong nhà chung cư kể từ ngày 01 tháng 7 năm 2006 đến trước ngày Luật này có hiệu lực thi hành mà trong hợp đồng mua bán, thuê mua căn hộ, phần diện tích khác trong nhà chung cư không có thỏa thuận về kinh phí bảo trì thì chủ đầu tư dự án đầu tư xây dựng nhà ở phải đóng khoản tiền này; trường hợp trong hợp đồng mua bán, thuê mua căn hộ, phần diện tích khác trong nhà chung cư mà giá mua, giá thuê mua chưa tính kinh phí bảo trì thì chủ sở hữu thực hiện đóng khoản kinh phí bảo trì theo quy định tại khoản 3 Điều này.", "dieu": "152"}, "27-2023-QH15/d145": {"heading": "Hội nghị nhà chung cư", "text": "Điều 145. Hội nghị nhà chung cư 1. Hội nghị nhà chung cư là hội nghị của các chủ sở hữu hoặc người sử dụng nhà chung cư nếu chủ sở hữu nhà chung cư không tham dự; đối với nhà chung cư có một chủ sở hữu thì Hội nghị nhà chung cư bao gồm chủ sở hữu nhà chung cư và người sử dụng nhà chung cư. 2. Hội nghị nhà chung cư phải tổ chức họp để quyết định các vấn đề quy định tại khoản 3 hoặc khoản 4 Điều này khi có đủ điều kiện theo Quy chế quản lý, sử dụng nhà chung cư. Việc tổ chức Hội nghị nhà chung cư được thực hiện thông qua hình thức họp trực tiếp; trường hợp do dịch bệnh, thiên tai không thể họp trực tiếp thì có thể tổ chức họp trực tuyến hoặc kết hợp họp trực tiếp và họp trực tuyến. 3. Đối với nhà chung cư có nhiều chủ sở hữu thì Hội nghị nhà chung cư quyết định các vấn đề sau đây: a) Đề cử, bầu, miễn nhiệm, bãi nhiệm thành viên Ban quản trị nhà chung cư; thông qua, sửa đổi, bổ sung nội quy quản lý, sử dụng nhà chung cư; b) Thông qua, sửa đổi, bổ sung quy chế hoạt động, quy chế thu, chi tài chính của Ban quản trị nhà chung cư; quyết định mức thù lao của thành viên Ban quản trị nhà chung cư và chi phí khác phục vụ hoạt động của Ban quản trị nhà chung cư; c) Thông qua mức giá dịch vụ quản lý vận hành nhà chung cư và việc sử dụng kinh phí bảo trì; đối với nhà chung cư quy định tại khoản 4 Điều 155 của Luật này mà trong hợp đồng mua bán, thuê mua căn hộ nhà chung cư các bên không có thỏa thuận về việc phân chia tỷ lệ kinh phí bảo trì thì Hội nghị nhà chung cư xem xét, quyết định việc phân chia tỷ lệ kinh phí này; d) Quyết định lựa chọn đơn vị quản lý vận hành nhà chung cư trong trường hợp không còn chủ đầu tư dự án đầu tư xây dựng nhà ở hoặc chủ đầu tư dự án đầu tư xây dựng nhà ở không có chức năng, năng lực quản lý vận hành nhà chung cư hoặc có chức năng, năng lực quản lý vận hành nhưng không tham gia quản lý vận hành hoặc tham gia quản lý vận hành nhưng không đáp ứng được các yêu cầu đã thỏa thuận trong hợp đồng cung cấp dịch vụ ký với Ban quản trị nhà chung cư; đ) Thông qua kế hoạch bảo trì phần sở hữu chung của nhà chung cư; e) Thông qua báo cáo về hoạt động quản lý vận hành, hoạt động bảo trì phần sở hữu chung của nhà chung cư; g) Nội dung khác có liên quan đến việc quản lý, sử dụng nhà chung cư. 4. Đối với nhà chung cư có một chủ sở hữu thì Hội nghị nhà chung cư được tổ chức họp để quyết định vấn đề quy định tại các điểm a, b và e khoản 3 Điều này. Trường hợp nhà chung cư thuộc tài sản công, Hội nghị nhà chung cư được tổ chức họp để quyết định vấn đề quy định tại điểm b và điểm e khoản 3 Điều này. 5. Quyết định của Hội nghị nhà chung cư về vấn đề quy định tại khoản 3 Điều này được thông qua theo nguyên tắc đa số bằng hình thức biểu quyết hoặc bỏ phiếu, được lập thành biên bản có chữ ký của các thành viên chủ trì Hội nghị và thư ký Hội nghị nhà chung cư.", "dieu": "145"}, "17-VBHN-BXD-2026/quy-che/d25": {"heading": "Biểu quyết thông qua các quyết định của Ban quản trị", "text": "Điều 25. Biểu quyết thông qua các quyết định của Ban quản trị 1. Các quyết định của Ban quản trị tòa nhà chung cư, cụm nhà chung cư được thông qua bằng hình thức biểu quyết hoặc bỏ phiếu theo quy chế hoạt động của Ban quản trị, được lập thành biên bản, có chữ ký của thư ký cuộc họp, các thành viên Ban quản trị dự họp và có đóng dấu của Ban quản trị (đối với trường hợp có con dấu). Trường hợp tỷ lệ biểu quyết tán thành đạt 50% số thành viên Ban quản trị thì kết quả cuối cùng được xác định theo biểu quyết của Trưởng ban hoặc Phó ban chủ trì cuộc họp (nếu vắng Trưởng ban), trừ trường hợp quy định tại khoản 2, khoản 3 Điều này. 2. Đối với nhà chung cư có nhiều chủ sở hữu thì các đề xuất sau đây chỉ được thông qua khi có tối thiểu 50% tổng số thành viên của Ban quản trị nhà chung cư, cụm nhà chung cư tán thành: a) Đề xuất thay đổi đơn vị quản lý vận hành; b) Đề xuất hình thức lựa chọn đơn vị bảo trì, trừ trường hợp bảo trì đột xuất phát sinh không trong thời gian tổ chức Hội nghị nhà chung cư thường niên hoặc không tổ chức Hội nghị nhà chung cư bất thường; c) Đề xuất thay đổi giá dịch vụ quản lý vận hành nhà chung cư; d) Các đề xuất, yêu cầu của Ban quản trị đối với chủ đầu tư trong quá trình quản lý, sử dụng nhà chung cư; đ) Các trường hợp khác do Hội nghị nhà chung cư quyết định. 3. Đối với quyết định chi tiêu kinh phí bảo trì phần sở hữu chung của nhà chung cư có nhiều chủ sở hữu thì thực hiện biểu quyết theo quy định sau đây: a) Trường hợp Ban quản trị tòa nhà chung cư quyết định việc bảo trì phần sở hữu chung của tòa nhà chung cư thì phải được 75% tổng số thành viên Ban quản trị đồng ý; b) Trường hợp Ban quản trị cụm nhà chung cư quyết định việc bảo trì phần sở hữu chung của cả cụm nhà chung cư thì phải được 75% tổng số thành viên Ban quản trị cụm nhà chung cư đồng ý; nếu chỉ bảo trì phần sở hữu chung của một hoặc một số tòa nhà trong cụm thì phải được Trưởng ban và 75% tổng số thành viên Ban quản trị là đại diện của một hoặc một số tòa nhà đó đồng ý.", "dieu": "25"}, "27-2023-QH15/d155": {"heading": "Sử dụng kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "text": "Điều 155. Sử dụng kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu 1. Kinh phí bảo trì chỉ được sử dụng để bảo trì, thay thế các hạng mục, trang thiết bị thuộc phần sở hữu chung của nhà chung cư theo kế hoạch bảo trì được Hội nghị nhà chung cư thông qua. Ban quản trị nhà chung cư không được sử dụng kinh phí bảo trì này vào mục đích quản lý vận hành nhà chung cư và các mục đích khác. Trường hợp nhà chung cư phải phá dỡ theo quy định của Luật này mà kinh phí bảo trì chưa sử dụng hết thì được sử dụng để hỗ trợ tái định cư hoặc đưa vào quỹ bảo trì phần sở hữu chung của nhà chung cư mới sau khi được xây dựng lại. 2. Việc sử dụng kinh phí bảo trì phải có hóa đơn, chứng từ và phải báo cáo Hội nghị nhà chung cư. 3. Trường hợp sử dụng hết kinh phí bảo trì đã đóng thì các chủ sở hữu nhà chung cư có trách nhiệm đóng kinh phí bảo trì khi thực hiện bảo trì theo kế hoạch bảo trì đã được Hội nghị nhà chung cư thông qua hoặc khi xuất hiện hạng mục, trang thiết bị cần bảo trì đột xuất. 4. Trường hợp nhà chung cư có mục đích sử dụng hỗn hợp mà phân chia được riêng biệt các khu chức năng khác nhau trong cùng một tòa nhà chung cư bao gồm khu chức năng căn hộ, khu chức năng kinh doanh dịch vụ và mỗi khu chức năng này có phần sở hữu chung được tách biệt với phần sở hữu chung của cả tòa nhà chung cư, được quản lý vận hành độc lập thì chủ đầu tư dự án đầu tư xây dựng nhà ở và người mua, thuê mua căn hộ hoặc phần diện tích khác trong nhà chung cư thỏa thuận trong hợp đồng mua bán, thuê mua hoặc lập phụ lục hợp đồng về việc phân chia tỷ lệ kinh phí bảo trì thành nhiều phần để quản lý, sử dụng. Việc thỏa thuận phân chia tỷ lệ kinh phí bảo trì quy định tại khoản này được tính theo nguyên tắc tỷ lệ phần trăm diện tích sàn xây dựng của từng khu chức năng trong tòa nhà chung cư trên tổng diện tích sàn xây dựng của tòa nhà chung cư đó. 5. Việc quản lý kinh phí bảo trì quy định tại khoản 4 Điều này được thực hiện như sau: a) Đối với kinh phí bảo trì của tòa nhà chung cư và phần sở hữu chung của khu căn hộ thì chuyển vào tài khoản do Ban quản trị nhà chung cư lập theo quy định tại điểm a khoản 2 Điều 153 của Luật này để quản lý, sử dụng; b) Đối với phần kinh phí bảo trì của khu kinh doanh dịch vụ thì chủ sở hữu khu kinh doanh dịch vụ tự quản lý, sử dụng để bảo trì phần sở hữu chung của khu chức năng này. 6. Đối với nhà chung cư không bắt buộc thành lập Ban quản trị nhà chung cư theo quy định của Luật này thì chủ sở hữu, người sử dụng nhà chung cư thống nhất cử người đại diện quản lý tài khoản kinh phí bảo trì, việc sử dụng kinh phí bảo trì.", "dieu": "155"}, "91-2025-QH15/d16": {"heading": "Công khai dữ liệu cá nhân", "text": "Điều 16. Công khai dữ liệu cá nhân 1. Dữ liệu cá nhân chỉ được công khai với mục đích cụ thể. Phạm vi công khai, loại dữ liệu cá nhân được công khai phải phù hợp với mục đích công khai. Việc công khai dữ liệu cá nhân không được xâm phạm đến quyền, lợi ích hợp pháp của chủ thể dữ liệu cá nhân. 2. Dữ liệu cá nhân chỉ được công khai trong các trường hợp sau đây: a) Khi có sự đồng ý của chủ thể dữ liệu cá nhân; b) Thực hiện theo quy định của pháp luật; c) Trường hợp quy định tại điểm b khoản 1 Điều 19 của Luật này; d) Thực hiện nghĩa vụ theo hợp đồng. 3. Dữ liệu cá nhân công khai phải bảo đảm phản ánh đúng dữ liệu cá nhân từ nguồn dữ liệu gốc và tạo thuận lợi cho cơ quan, tổ chức, cá nhân trong việc tiếp cận, khai thác, sử dụng. 4. Hình thức công khai dữ liệu cá nhân, bao gồm: đăng tải dữ liệu trên trang thông tin điện tử, cổng thông tin điện tử, phương tiện thông tin đại chúng và các hình thức khác theo quy định của pháp luật. 5. Cơ quan, tổ chức, cá nhân công khai dữ liệu cá nhân phải kiểm soát và giám sát chặt chẽ việc công khai dữ liệu cá nhân để bảo đảm tuân thủ đúng mục đích, phạm vi và quy định của pháp luật; ngăn chặn việc truy cập, sử dụng, tiết lộ, sao chép, sửa đổi, xóa, hủy hoặc các hành vi xử lý trái phép khác đối với dữ liệu cá nhân đã công khai trong khả năng, điều kiện của mình.", "dieu": "16"}, "140-2025-ND-CP/d12": {"heading": "Nhiệm vụ, thẩm quyền liên quan đến quản lý nhà chung cư", "text": "Điều 12. Nhiệm vụ, thẩm quyền liên quan đến quản lý nhà chung cư 1. Trách nhiệm phối hợp, thực hiện kiểm định, đánh giá chất lượng nhà chung cư quy định tại khoản 1 Điều 61 Luật Nhà ở năm 2023 do Ủy ban nhân dân cấp xã thực hiện. 2. Trách nhiệm xây dựng hoặc thuê đơn vị tư vấn theo quy định của pháp luật đấu thầu để xây dựng kế hoạch cải tạo, xây dựng lại nhà chung cư, báo cáo Ủy ban nhân dân cấp tỉnh phê duyệt và đăng tải quy định tại khoản 2, khoản 5 Điều 65 Luật Nhà ở năm 2023 do Ủy ban nhân dân cấp xã thực hiện nếu được giao. Trình tự, thủ tục xây dựng hoặc thuê đơn vị tư vấn theo quy định của pháp luật đấu thầu để xây dựng kế hoạch cải tạo, xây dựng lại nhà chung cư được thực hiện theo quy định tại Điều 7, Điều 8 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ. Cơ quan công an cấp xã có trách nhiệm bảo đảm an ninh, trật tự trong quá trình cưỡng chế, thu hồi nhà ở trên cơ sở yêu cầu bằng văn bản của Ủy ban nhân dân cấp xã. 3. Trách nhiệm tổ chức cưỡng chế bàn giao kinh phí bảo trì phần sở hữu chung trong nhà chung cư quy định tại Điều 154 Luật Nhà ở năm 2023, Điều 88, Điều 89, Điều 90, Điều 91 Nghị định số 95/2024/NĐ-CP ngày 24 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện. 4. Trách nhiệm phối hợp tổ chức rà soát, kiểm định, đánh giá chất lượng nhà chung cư quy định tại khoản 2 Điều 5 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện. 5. Trách nhiệm trong việc thực hiện kế hoạch cải tạo nhà chung cư và đăng tải công khai kế hoạch cải tạo nhà chung cư quy định tại điểm g khoản 2 và khoản 3 Điều 7 Nghị định 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện. 6. Trách nhiệm cho ý kiến thẩm định chấp thuận chủ trương đầu tư dự án cải tạo, xây dựng lại nhà chung cư không bằng nguồn vốn đầu tư công của Ủy ban nhân dân cấp huyện quy định tại điểm b khoản 1, điểm a khoản 2 Điều 11 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã nơi có dự án thực hiện. 7. Trách nhiệm trong việc triển khai dự án cải tạo, xây dựng lại nhà chung cư của Ủy ban nhân dân cấp huyện trong nội dung chấp thuận chủ trương đầu tư dự án quy định tại điểm i khoản 1 Điều 13 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện. 8. Trách nhiệm tiếp nhận và công khai thông tin về dự án cải tạo, xây dựng lại nhà chung cư, tiếp nhận hồ sơ đăng ký tham gia làm chủ đầu tư dự án, phối hợp với Sở Xây dựng tổ chức lấy ý kiến các chủ sở hữu nhà chung cư, ký xác nhận biên bản lựa chọn chủ đầu tư dự án quy định tại khoản 2, khoản 3, khoản 4 khoản 5 và khoản 6 Điều 17 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện. 9. Trách nhiệm phối hợp với Sở Xây dựng trình Ủy ban nhân dân cấp tỉnh phê duyệt phương án bồi thường, hỗ trợ tái định cư quy định khoản 9 Điều 18 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện. 10. Trách nhiệm tổ chức thực hiện việc cưỡng chế di dời quy định tại khoản 3 Điều 74 của Luật Nhà ở năm 2023 do Ủy ban nhân dân cấp tỉnh thực hiện hoặc Ủy ban nhân dân cấp xã nơi có nhà chung cư thực hiện trong trường hợp được Ủy ban nhân dân cấp tỉnh giao. 11. Trách nhiệm chủ trì tổ chức di dời khẩn cấp chủ sở hữu, người sử dụng nhà chung cư, đề xuất Ủy ban nhân dân cấp tỉnh bố trí kinh phí di dời khẩn cấp quy định tại điểm b, điểm c khoản 1 Điều 24 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp tỉnh thực hiện hoặc Ủy ban nhân dân cấp xã nơi có nhà chung cư thực hiện trong trường hợp được Ủy ban nhân dân cấp tỉnh giao. 12. Trách nhiệm chủ trì tổ chức di dời chủ sở hữu, người sử dụng nhà chung cư, chủ trì cưỡng chế di dời chủ sở hữu, người sử dụng nhà chung cư quy định tại điểm b khoản 2 Điều 24, Điều 25 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp tỉnh thực hiện hoặc Ủy ban nhân dân cấp xã nơi có nhà chung cư thực hiện trong trường hợp được Ủy ban nhân dân cấp tỉnh giao. Cơ quan công an cấp xã có trách nhiệm bảo đảm an ninh, trật tự trong quá trình cưỡng chế, thu hồi nhà ở trên cơ sở yêu cầu bằng văn bản của Ủy ban nhân dân cấp xã. 13. Trách nhiệm tổ chức cưỡng chế bàn giao kinh phí bảo trì phần sở hữu chung của nhà chung cư, quản lý nhà nước về nhà ở trên địa bàn quy định tại khoản 3 Điều 93 Nghị định số 95/2024/NĐ-CP ngày 24 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện. 14. Trách nhiệm phối hợp xác định số tiền được khấu trừ khi lập phương án bồi thường tái định cư bổ sung quy định tại khoản 10 Điều 48 Nghị định số 98/2024/NĐ-CP ngày 25 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện.", "dieu": "12"}, "17-VBHN-BXD-2026/quy-che/d15": {"heading": "Hội nghị nhà chung cư lần đầu", "text": "Điều 15. Hội nghị nhà chung cư lần đầu 1. Điều kiện để tổ chức Hội nghị nhà chung cư lần đầu được quy định như sau: a) Hội nghị của tòa nhà chung cư phải được tổ chức trong thời hạn 12 tháng, kể từ ngày nhà chung cư đó được bàn giao đưa vào sử dụng và có tối thiểu 50% số căn hộ đã được bàn giao cho người mua, thuê mua (không bao gồm số căn hộ mà chủ đầu tư giữ lại không bán, không cho thuê mua hoặc chưa bán, chưa cho thuê mua); trường hợp quá thời hạn quy định tại điểm này mà tòa nhà chung cư chưa có đủ 50% số căn hộ được bàn giao thì Hội nghị nhà chung cư được tổ chức sau khi có đủ 50% số căn hộ được bàn giao; b) Hội nghị của cụm nhà chung cư được tổ chức khi có tối thiểu 50% số căn hộ của mỗi tòa nhà trong cụm đã được bàn giao cho người mua, thuê mua (không bao gồm số căn hộ mà chủ đầu tư giữ lại không bán, không cho thuê mua hoặc chưa bán, chưa cho thuê mua) và có tối thiểu 50% đại diện chủ sở hữu căn hộ của từng tòa nhà đã nhận bàn giao đưa vào sử dụng đồng ý nhập tòa nhà vào cụm nhà chung cư. 2. Điều kiện về số lượng người tham dự cuộc họp Hội nghị nhà chung cư lần đầu được quy định như sau: a) Đối với Hội nghị của tòa nhà chung cư thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao tham dự theo hình thức quy định tại khoản 2 Điều 145 của Luật Nhà ở. Trường hợp không đủ số người tham dự quy định tại điểm này thì trong thời hạn 07 ngày làm việc, kể từ ngày tổ chức họp hội nghị được ghi trong thông báo mời họp, chủ đầu tư hoặc đại diện chủ sở hữu căn hộ có văn bản đề nghị Ủy ban nhân dân cấp xã nơi có nhà chung cư tổ chức Hội nghị nhà chung cư; b) Đối với Hội nghị của cụm nhà chung cư thì phải đảm bảo số lượng đại diện chủ sở hữu đã đồng ý nhập tòa nhà vào cụm nhà chung cư theo quy định tại điểm b khoản 1 Điều này tham dự theo hình thức quy định tại khoản 2 Điều 145 của Luật Nhà ở; trường hợp không đủ số người tham dự theo quy định thì trong thời hạn 07 ngày làm việc, kể từ ngày tổ chức họp hội nghị được ghi trong thông báo mời họp, chủ đầu tư hoặc đại diện chủ sở hữu căn hộ có văn bản đề nghị Ủy ban nhân dân cấp xã tổ chức Hội nghị nhà chung cư, trừ trường hợp tòa nhà trong cụm tổ chức họp Hội nghị nhà chung cư riêng theo quy định tại điểm a khoản này. 3. Chủ đầu tư (nếu là nhà chung cư có nhiều chủ sở hữu) hoặc chủ sở hữu (nếu là nhà chung cư có một chủ sở hữu) có trách nhiệm chuẩn bị các nội dung họp, thông báo thời gian, địa điểm và tổ chức họp hội nghị chính thức cho các chủ sở hữu, người sử dụng nhà chung cư. Chủ đầu tư hoặc chủ sở hữu có thể tổ chức họp trù bị để chuẩn bị các nội dung cho Hội nghị nhà chung cư chính thức. Nội dung chuẩn bị tổ chức Hội nghị nhà chung cư lần đầu bao gồm các công việc sau đây: a) Kiểm tra, xác định tư cách đại diện chủ sở hữu căn hộ tham dự hội nghị; trường hợp ủy quyền thì phải có văn bản ủy quyền của chủ sở hữu căn hộ. Văn bản ủy quyền bao gồm các nội dung sau: họ, tên và số điện thoại liên hệ (nếu có) của người ủy quyền và người được ủy quyền, địa chỉ căn hộ hoặc phần diện tích khác trong nhà chung cư của người ủy quyền, các nội dung ủy quyền liên quan đến Hội nghị nhà chung cư, quyền và trách nhiệm của các bên ủy quyền và được ủy quyền, văn bản ủy quyền phải có đầy đủ chữ ký của người ủy quyền và người được ủy quyền; b) Dự thảo quy chế họp Hội nghị nhà chung cư; c) Dự kiến đề xuất sửa đổi, bổ sung Bản nội quy quản lý, sử dụng nhà chung cư mà chủ đầu tư đã xây dựng nếu có đề xuất sửa đổi; d) Dự thảo quy chế bầu Ban quản trị, đề xuất tên gọi của Ban quản trị theo quy định tại điểm a khoản 1 Điều 22 của Quy chế này, đề xuất số lượng thành viên Ban quản trị, danh sách thành viên Ban quản trị, dự kiến cơ cấu Ban quản trị (nếu nhà chung cư thuộc diện phải có Ban quản trị); dự kiến kế hoạch bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư cho các thành viên Ban quản trị. Đối với nhà chung cư có nhiều chủ sở hữu thì cần chuẩn bị thêm các nội dung, bao gồm: đề xuất mức giá dịch vụ quản lý vận hành nhà chung cư, dự thảo kế hoạch bảo trì phần sở hữu chung của nhà chung cư, đề xuất đơn vị quản lý vận hành trong trường hợp nhà chung cư phải có đơn vị quản lý vận hành nhưng chủ đầu tư không đủ điều kiện quản lý vận hành nhà chung cư hoặc có đủ điều kiện quản lý vận hành nhà chung cư nhưng không tham gia quản lý vận hành; trường hợp nhà chung cư phải có Ban quản trị thì phải có dự thảo quy chế hoạt động, quy chế thu, chi tài chính của Ban quản trị; đ) Thông báo giá dịch vụ phải trả phí như bể bơi, phòng tập, sân tennis, khu spa và các dịch vụ khác (nếu có); e) Các đề xuất khác có liên quan đến việc quản lý, sử dụng nhà chung cư cần báo cáo để Hội nghị nhà chung cư lần đầu thông qua. 4. Hội nghị nhà chung cư lần đầu quyết định các nội dung sau đây: a) Quy chế họp Hội nghị nhà chung cư (bao gồm họp lần đầu, họp thường niên và họp bất thường); b) Quy chế bầu Ban quản trị, tên gọi của Ban quản trị, số lượng thành viên Ban quản trị, danh sách thành viên Ban quản trị, Trưởng ban, Phó ban quản trị (nếu nhà chung cư có thành lập Ban quản trị); nếu chủ đầu tư còn sở hữu diện tích trong nhà chung cư thì chủ đầu tư cử đại diện làm Phó ban quản trị, trừ trường hợp chủ đầu tư có văn bản thông báo không cử đại diện tham gia Ban quản trị nhà chung cư; c) Kế hoạch bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư cho các thành viên Ban quản trị; d) Sửa đổi, bổ sung Bản nội quy quản lý, sử dụng nhà chung cư (nếu có); đ) Các nội dung quy định tại điểm d khoản 3 Điều này; đối với giá dịch vụ quản lý vận hành nhà chung cư thì Hội nghị nhà chung cư quyết định trên cơ sở quy định của Quy chế này và thỏa thuận, thống nhất với đơn vị quản lý vận hành; e) Các khoản kinh phí mà chủ sở hữu, người sử dụng nhà chung cư phải đóng góp trong quá trình sử dụng nhà chung cư; g) Tỷ lệ số lượng chủ sở hữu, người sử dụng nhà chung cư tham dự Hội nghị nhà chung cư thường niên trong trường hợp có ít hơn 30% số đại diện chủ sở hữu tham dự theo quy định tại khoản 1 Điều 17 của Quy chế này; h) Hình thức lựa chọn đơn vị bảo trì, các hạng mục bảo trì cần giám sát, phương thức thanh toán kinh phí thực hiện bảo trì, trừ trường hợp bảo trì đột xuất phát sinh không trong thời gian tổ chức Hội nghị nhà chung cư thường niên hoặc không tổ chức Hội nghị nhà chung cư bất thường; i) Các nội dung khác phải thông qua Hội nghị nhà chung cư theo quy định của Quy chế này hoặc các nội dung khác có liên quan đến quản lý vận hành nhà chung cư. 5. Ủy ban nhân dân cấp xã nơi có nhà chung cư có trách nhiệm tổ chức Hội nghị nhà chung cư lần đầu khi có một trong các trường hợp sau đây: a) Nhà chung cư đã được bàn giao đưa vào sử dụng quá thời hạn 12 tháng và đã có đủ 50% số căn hộ được bàn giao theo quy định tại điểm a khoản 1 Điều này nhưng chủ đầu tư không tổ chức Hội nghị nhà chung cư và có đơn đề nghị của đại diện chủ sở hữu căn hộ đã nhận bàn giao; b) Trường hợp không đủ số người tham dự Hội nghị nhà chung cư theo quy định tại khoản 2 Điều này và có văn bản đề nghị của chủ đầu tư hoặc có đơn đề nghị của đại diện chủ sở hữu căn hộ đã nhận bàn giao; c) Chủ đầu tư chấm dứt hoạt động do bị giải thể hoặc phá sản theo quy định của pháp luật và có đơn đề nghị của đại diện chủ sở hữu căn hộ đã nhận bàn giao. 6. Trường hợp Ủy ban nhân dân cấp xã tổ chức Hội nghị nhà chung cư lần đầu theo quy định tại khoản 5 Điều này thì không yêu cầu phải đáp ứng tỷ lệ số người tham dự quy định tại khoản 2 Điều này; kinh phí tổ chức hội nghị này do các chủ sở hữu, người sử dụng nhà chung cư đóng góp. 7. Trong thời hạn 30 ngày, kể từ ngày nhận được đơn của đại diện chủ sở hữu căn hộ đã nhận bàn giao hoặc nhận được văn bản đề nghị của chủ đầu tư theo quy định tại khoản 5 Điều này, Ủy ban nhân dân cấp xã có trách nhiệm tổ chức Hội nghị nhà chung cư lần đầu. Kết quả của Hội nghị nhà chung cư lần đầu do Ủy ban nhân dân cấp xã tổ chức có giá trị áp dụng đối với các chủ sở hữu, người đang sử dụng nhà chung cư như Hội nghị nhà chung cư lần đầu do chủ đầu tư tổ chức.", "dieu": "15"}, "17-VBHN-BXD-2026/quy-che/d36": {"heading": "Lập, bàn giao và quản lý kinh phí bảo trì phần sở hữu chung của nhà chung cư có nhiều chủ sở hữu", "text": "Điều 36. Lập, bàn giao và quản lý kinh phí bảo trì phần sở hữu chung của nhà chung cư có nhiều chủ sở hữu 1. Đối với nhà chung cư có mục đích để ở, nhà chung cư có mục đích sử dụng hỗn hợp để ở và sử dụng vào mục đích khác nhưng không phân chia riêng biệt được phần sở hữu chung của khu chức năng căn hộ và khu chức năng kinh doanh dịch vụ thì sau khi tổ chức Hội nghị nhà chung cư lần đầu, việc lập tài khoản, bàn giao và quản lý kinh phí bảo trì phần sở hữu chung được thực hiện như sau: a) Ban quản trị nhà chung cư mở tài khoản tại tổ chức tín dụng, chi nhánh ngân hàng nước ngoài đang hoạt động tại Việt Nam (gọi tắt là tổ chức tín dụng) để quản lý, sử dụng kinh phí bảo trì phần sở hữu chung của cả tòa nhà chung cư; b) Trong thời hạn 30 ngày, kể từ ngày Ban quản trị có văn bản đề nghị chuyển giao kinh phí bảo trì, chủ đầu tư và Ban quản trị có trách nhiệm quyết toán số liệu kinh phí bảo trì để chuyển sang tài khoản do Ban quản trị lập theo quy định tại điểm a khoản này để quản lý, sử dụng theo quy định của pháp luật; c) Chủ tài khoản tiền gửi kinh phí bảo trì đối với nhà chung cư có mục đích để ở có thể do một thành viên Ban quản trị hoặc nhiều thành viên Ban quản trị đứng tên đồng chủ tài khoản do Hội nghị nhà chung cư quyết định. Chủ tài khoản tiền gửi kinh phí bảo trì đối với nhà chung cư có mục đích sử dụng hỗn hợp có tối thiểu là 03 thành viên Ban quản trị đứng tên đồng chủ tài khoản, số lượng thành viên tối đa do Hội nghị nhà chung cư quyết định. Các thành viên tham gia đồng chủ tài khoản này phải có ít nhất 01 đại diện chủ sở hữu khu căn hộ, 01 đại diện chủ sở hữu diện tích khác (nếu có), 01 đại diện chủ đầu tư (nếu có) và một số thành viên khác do Hội nghị nhà chung cư quyết định (nếu có). Kỳ hạn gửi tiền và việc đứng tên đồng chủ tài khoản tiền gửi kinh phí bảo trì quy định tại khoản này được quy định trong quy chế thu, chi tài chính của Ban quản trị do Hội nghị nhà chung cư thông qua. 2. Đối với nhà chung cư có mục đích sử dụng hỗn hợp mà phân chia được riêng biệt các khu chức năng khác nhau trong cùng một tòa nhà chung cư, bao gồm khu chức năng căn hộ, khu chức năng kinh doanh dịch vụ và mỗi khu chức năng này có phần sở hữu chung được tách biệt với phần sở hữu chung của cả tòa nhà chung cư, được quản lý vận hành độc lập thì sau khi tổ chức Hội nghị nhà chung cư lần đầu, việc lập tài khoản, bàn giao và quản lý kinh phí bảo trì phần sở hữu chung được thực hiện như sau: a) Ban quản trị nhà chung cư mở tài khoản tại tổ chức tín dụng để quản lý, sử dụng kinh phí bảo trì phần sở hữu chung của khu căn hộ và kinh phí bảo trì phần sở hữu chung của cả tòa nhà chung cư; b) Kỳ hạn tiền gửi và chủ tài khoản tiền gửi kinh phí bảo trì quy định tại điểm a khoản này được xác định như đối với trường hợp nhà chung cư có mục đích để ở quy định tại điểm c khoản 1 Điều này; c) Chủ sở hữu phần diện tích khu chức năng kinh doanh dịch vụ có trách nhiệm tự quản lý kinh phí được để lại theo quy định tại khoản 4 Điều 155 của Luật Nhà ở để bảo trì phần sở hữu chung của khu chức năng này; d) Việc bàn giao kinh phí bảo trì phần sở hữu chung của nhà chung cư quy định tại khoản này được thực hiện theo quy định tại khoản 3 Điều này. 3. Việc bàn giao, quản lý kinh phí bảo trì đối với trường hợp quy định tại khoản 2 Điều này được quy định như sau: a) Trong thời hạn 15 ngày, kể từ ngày hoàn thành việc quyết toán kinh phí bảo trì phần sở hữu chung theo quy định tại Điều 39 của Quy chế này, chủ đầu tư có trách nhiệm chuyển giao kinh phí bảo trì đã thu của người mua, thuê mua và kinh phí bảo trì mà chủ đầu tư phải nộp đối với phần diện tích căn hộ không bán, không cho thuê mua hoặc chưa bán, chưa cho thuê mua theo quy định tại khoản 2 Điều 152 của Luật Nhà ở sang tài khoản do Ban quản trị đã lập theo quy định tại điểm a khoản 2 Điều này để quản lý, sử dụng theo quy định; b) Đối với phần kinh phí bảo trì mà chủ đầu tư phải nộp cho phần diện tích kinh doanh dịch vụ thì chủ đầu tư chuyển phần kinh phí theo tỷ lệ đã thống nhất với người mua, thuê mua trong hợp đồng mua bán, thuê mua căn hộ quy định tại khoản 4 Điều 155 của Luật Nhà ở sang tài khoản do Ban quản trị lập quy định tại điểm a khoản 2 Điều này để quản lý, bảo trì phần sở hữu chung của cả tòa nhà; đối với phần kinh phí bảo trì còn lại thì chủ đầu tư được tự quản lý và sử dụng theo quy định tại điểm c khoản 2 Điều này. 4. Trường hợp thành lập cụm nhà chung cư thì căn cứ vào mục đích sử dụng của từng tòa nhà, Ban quản trị cụm nhà chung cư phải lập các tài khoản riêng để quản lý kinh phí bảo trì cho từng tòa nhà theo quy định tại các khoản 1, 2 và 3 Điều này. 5. Bên bàn giao và bên nhận bàn giao kinh phí bảo trì phần sở hữu chung của nhà chung cư quy định tại Điều này có trách nhiệm làm thủ tục quyết toán số liệu kinh phí này trước khi tiến hành việc bàn giao kinh phí. Tài liệu quyết toán kinh phí bảo trì phần sở hữu chung được thực hiện theo quy định tại khoản 2 Điều 39 của Quy chế này.", "dieu": "36"}, "17-VBHN-BXD-2026/quy-che/d22": {"heading": "Hồ sơ đề nghị công nhận Ban quản trị", "text": "Điều 22. Hồ sơ đề nghị công nhận Ban quản trị 1. Đối với Ban quản trị được bầu tại Hội nghị nhà chung cư lần đầu thì hồ sơ đề nghị công nhận Ban quản trị bao gồm: a) Văn bản đề nghị của chủ đầu tư, trong đó nêu rõ tên Ban quản trị đã được Hội nghị nhà chung cư thông qua; nếu thành lập Ban quản trị của tòa nhà chung cư thì tên Ban quản trị được đặt theo tên hoặc số tòa nhà; nếu thành lập Ban quản trị của cụm nhà chung cư thì tên Ban quản trị do Hội nghị nhà chung cư quyết định; b) Biên bản họp Hội nghị nhà chung cư về việc bầu Ban quản trị; c) Danh sách các thành viên Ban quản trị, trong đó nêu chức danh Trưởng ban, Phó ban quản trị; d) Quy chế hoạt động của Ban quản trị đã được Hội nghị nhà chung cư thông qua. 2. Trường hợp bầu lại Ban quản trị khi hết nhiệm kỳ, bầu Ban quản trị mới do bị miễn nhiệm, bãi nhiệm theo quy định hoặc bầu thay thế thành viên Ban quản trị, bầu thay thế Trưởng ban, bầu thay thế Phó ban quản trị không phải là đại diện của chủ đầu tư hoặc do chủ đầu tư không cử đại diện thay thế thì hồ sơ đề nghị công nhận Ban quản trị bao gồm: a) Văn bản đề nghị của Ban quản trị được bầu; b) Bản gốc quyết định công nhận Ban quản trị; c) Biên bản họp Hội nghị nhà chung cư về việc bầu lại, bầu thay thế Ban quản trị hoặc thành viên Ban quản trị hoặc bầu thay thế Trưởng ban, Phó ban quản trị; trường hợp bầu thay thế thành viên Ban quản trị theo hình thức xin ý kiến các chủ sở hữu căn hộ thì phải có biên bản theo quy định tại điểm b khoản 3 Điều 26 của Quy chế này; d) Danh sách các thành viên Ban quản trị, trong đó nêu chức danh Trưởng ban, Phó ban quản trị; đ) Quy chế hoạt động của Ban quản trị đã được Hội nghị nhà chung cư thông qua (nếu có sửa đổi, bổ sung quy chế này). 3. Trường hợp tách Ban quản trị cụm nhà chung cư theo quy định tại khoản 2 Điều 27 của Quy chế này thì hồ sơ đề nghị công nhận Ban quản trị được quy định như sau: a) Trường hợp đề nghị công nhận Ban quản trị của tòa nhà sau khi tách khỏi cụm nhà chung cư thì hồ sơ bao gồm các giấy tờ quy định tại khoản 1 Điều này kèm theo biên bản thống nhất tách khỏi cụm nhà chung cư của đại diện các chủ sở hữu nhà chung cư theo quy định tại điểm a khoản 2 Điều 27 của Quy chế này; trường hợp thuộc diện quy định tại điểm c khoản 2 Điều 27 của Quy chế này thì phải có thêm bản gốc quyết định công nhận Ban quản trị; b) Trường hợp đề nghị công nhận Ban quản trị của cụm nhà chung cư sau khi có tòa nhà tách khỏi cụm thì hồ sơ bao gồm văn bản đề nghị của Ban quản trị cụm nhà chung cư, bản gốc quyết định công nhận Ban quản trị cụm nhà chung cư, danh sách các thành viên Ban quản trị cụm nhà chung cư còn lại (ghi rõ họ, tên và chức danh trong Ban quản trị); trường hợp phải bầu lại Trưởng ban quản trị cụm nhà chung cư theo quy định tại điểm b khoản 2 Điều 27 của Quy chế này thì phải kèm theo biên bản họp Hội nghị nhà chung cư về việc bầu Trưởng ban và danh sách người được bầu. 4. Trường hợp nhập Ban quản trị theo quy định tại khoản 3 Điều 27 của Quy chế này thì hồ sơ đề nghị công nhận Ban quản trị cụm nhà chung cư được quy định như sau: a) Trường hợp đề nghị công nhận Ban quản trị cụm nhà chung cư sau khi nhập các Ban quản trị của các tòa nhà thì hồ sơ bao gồm các giấy tờ quy định tại khoản 1 Điều này, biên bản đề nghị tập thể của đại diện các chủ sở hữu nhà chung cư theo quy định tại điểm a khoản 3 Điều 27 của Quy chế này và bản gốc các quyết định công nhận các Ban quản trị tòa nhà chung cư; b) Trường hợp đề nghị công nhận Ban quản trị cụm nhà chung cư do nhập Ban quản trị của tòa nhà vào Ban quản trị của cụm nhà chung cư thì hồ sơ bao gồm văn bản đề nghị của Ban quản trị cụm nhà chung cư kèm theo các biên bản họp quy định tại điểm b khoản 3 Điều 27 của Quy chế này, danh sách các thành viên Ban quản trị của cụm (bao gồm cả thành viên mới của tòa nhà nhập vào cụm) và bản gốc quyết định công nhận Ban quản trị tòa nhà, cụm nhà chung cư.", "dieu": "22"}, "28-VBHN-VPQH-2026/d21": {"heading": "Thẩm quyền của Chủ tịch Ủy ban nhân dân cấp tỉnh", "text": "Điều 21. Thẩm quyền của Chủ tịch Ủy ban nhân dân cấp tỉnh 1. Giải quyết khiếu nại lần đầu đối với quyết định hành chính, hành vi hành chính của mình. 2. Giải quyết khiếu nại lần hai đối với quyết định hành chính, hành vi hành chính của Chủ tịch Ủy ban nhân dân cấp xã, Thủ trưởng cơ quan chuyên môn, tổ chức hành chính khác thuộc Ủy ban nhân dân cấp tỉnh đã giải quyết lần đầu nhưng còn khiếu nại hoặc khiếu nại lần đầu đã hết thời hạn nhưng chưa được giải quyết. 3. Giải quyết tranh chấp về thẩm quyền giải quyết khiếu nại giữa các cơ quan, đơn vị thuộc phạm vi quản lý của mình.", "dieu": "21"}, "91-2025-QH15/d11": {"heading": "Thu thập, phân tích, tổng hợp dữ liệu cá nhân", "text": "Điều 11. Thu thập, phân tích, tổng hợp dữ liệu cá nhân 1. Dữ liệu cá nhân được thu thập phải được sự đồng ý của chủ thể dữ liệu cá nhân trước khi thu thập, trừ trường hợp pháp luật có quy định khác. 2. Cơ quan Đảng, Nhà nước có thẩm quyền được phân tích, tổng hợp dũ liệu cá nhân từ nguồn dữ liệu tự thu thập hoặc được chia sẻ, cung cấp, chuyển giao, khai thác, sử dụng để phục vụ công tác lãnh đạo, chỉ đạo, quản lý nhà nước, phát triển kinh tế - xã hội theo quy định của pháp luật. 3. Cơ quan, tổ chức, cá nhân không thuộc quy định tại khoản 2 Điều này được phân tích, tổng hợp dữ liệu cá nhân từ nguồn dữ liệu cá nhân được phép xử lý theo quy định của pháp luật.", "dieu": "11"}, "21-VBHN-BXD-2026/d85": {"heading": "Trình tự, thủ tục thông báo đơn vị đủ điều kiện thực hiện quản lý vận hành nhà chung cư", "text": "Điều 85. Trình tự, thủ tục thông báo đơn vị đủ điều kiện thực hiện quản lý vận hành nhà chung cư 1. 23 Đơn vị có nhu cầu gửi 01 bộ hồ sơ quy định tại khoản 2 Điều 84 của Nghị định này đến cơ quan quản lý nhà ở cấp tỉnh. 2. Cơ quan tiếp nhận hồ sơ có trách nhiệm kiểm tra hồ sơ; trường hợp không đủ hoặc không đúng các giấy tờ theo quy định thì trong thời hạn tối đa 15 ngày, kể từ ngày tiếp nhận hồ sơ, cơ quan tiếp nhận phải có văn bản thông báo cho đơn vị nộp hồ sơ các giấy tờ còn thiếu. Trường hợp trong quá trình thụ lý hồ sơ đề nghị mà phát hiện đơn vị mượn giấy tờ chứng minh nhân viên của đơn vị quản lý vận hành khác được công nhận thì có văn bản thông báo từ chối công nhận đơn vị đủ điều kiện quản lý vận hành nhà chung cư. Trường hợp hồ sơ đủ các giấy tờ theo quy định thì trong thời hạn tối đa 30 ngày, kể từ ngày nhận đủ hồ sơ, cơ quan tiếp nhận hồ sơ có trách nhiệm kiểm tra, ban hành văn bản thông báo đủ điều kiện thực hiện quản lý vận hành nhà chung cư, gửi cho đơn vị quản lý vận hành và đăng tải công khai thông báo này trên Cổng thông tin điện tử của cơ quan tiếp nhận hồ sơ; văn bản thông báo này có các nội dung: tên đơn vị, địa chỉ, thông tin người đại diện theo pháp luật và có giá trị trong thời hạn 05 năm, kể từ ngày ký, trừ trường hợp quy định tại khoản 2 Điều 86 của Nghị định này. Trường hợp cơ quan quản lý nhà ở cấp tỉnh thực hiện thông báo thì trong thời hạn tối đa 15 ngày, kể từ ngày có văn bản thông báo, phải gửi một bản thông báo đến Bộ Xây dựng để đăng tải trên Cổng thông tin điện tử của Bộ Xây dựng24; 3. Khi hết thời hạn nêu trong văn bản thông báo quy định tại khoản 2 Điều này, nếu đơn vị có nhu cầu tiếp tục thực hiện việc quản lý vận hành thì phải nộp 01 bộ hồ sơ theo quy định tại khoản 2 Điều 84 của Nghị định này để được xem xét, thông báo đơn vị đủ điều kiện thực hiện việc quản lý vận hành nhà chung cư. 4. Cơ quan có thẩm quyền thông báo đơn vị đủ điều kiện thực hiện quản lý vận hành nhà chung cư có trách nhiệm lập danh sách nhân viên của đơn vị quản lý vận hành đã gửi kèm theo hồ sơ đề nghị thông báo đơn vị đủ điều kiện để làm cơ sở xác định danh sách nhân viên tham gia tại một đơn vị quản lý vận hành. 5. Đơn vị quản lý vận hành nhà chung cư chỉ được ký hợp đồng dịch vụ quản lý vận hành nhà chung cư sau khi đã có văn bản thông báo đủ điều kiện thực hiện quản lý vận hành nhà chung cư của cơ quan có thẩm quyền.", "dieu": "85"}, "17-VBHN-BXD-2026/quy-che/d29": {"heading": "Hợp đồng dịch vụ quản lý vận hành nhà chung cư", "text": "Điều 29. Hợp đồng dịch vụ quản lý vận hành nhà chung cư 1. Việc quản lý vận hành nhà chung cư phải được thực hiện thông qua hợp đồng dịch vụ quản lý vận hành nhà chung cư ký giữa đơn vị quản lý vận hành và Ban quản trị. Trong trường hợp bầu Ban quản trị mới tại Hội nghị nhà chung cư lần đầu mà chưa được cơ quan có thẩm quyền công nhận Ban quản trị theo quy định tại Điều 23 của Quy chế này thì các bên thực hiện quyền và trách nhiệm quản lý vận hành theo nội dung đã được Hội nghị nhà chung cư thông qua. Sau khi Ban quản trị được công nhận thì thỏa thuận, thống nhất ký hợp đồng dịch vụ quản lý vận hành nhà chung cư theo quy định của pháp luật. Hợp đồng dịch vụ quản lý vận hành nhà chung cư có thời hạn tối thiểu 12 tháng, trừ trường hợp quy định tại khoản 2 Điều này và tối đa có thời hạn bằng nhiệm kỳ của Ban quản trị quy định tại khoản 3 Điều 19 của Quy chế này; trường hợp hợp đồng dịch vụ quản lý vận hành có thời hạn 12 tháng thì khi hết thời hạn này, việc tiếp tục ký hoặc không ký tiếp hợp đồng dịch vụ quản lý vận hành do Hội nghị nhà chung cư quyết định trên cơ sở thống nhất với đơn vị quản lý vận hành. Trường hợp ký hợp đồng dịch vụ quản lý vận hành theo nhiệm kỳ của Ban quản trị nhưng Ban quản trị mới chưa được thành lập và chưa được công nhận thì đơn vị quản lý vận hành tiếp tục thực hiện việc quản lý vận hành đến khi Ban quản trị mới được công nhận và ký hợp đồng với đơn vị quản lý vận hành mới, trừ trường hợp thuộc diện đơn phương chấm dứt hợp đồng do một hoặc các bên vi phạm nội dung thuộc diện chấm dứt hợp đồng. 2. Trường hợp đơn vị quản lý vận hành nhà chung cư đang thực hiện quản lý vận hành theo hợp đồng dịch vụ quy định tại khoản 1 Điều này mà bị phá sản hoặc giải thể hoặc bị ngừng hoạt động cùng với thời gian kết thúc nhiệm kỳ của Ban quản trị thì thực hiện chấm dứt hợp đồng và phải bàn giao hồ sơ nhà chung cư cho Ban quản trị theo quy định; trường hợp nhiệm kỳ hoạt động của Ban quản trị vẫn còn thì đơn vị quản lý vận hành phải tiếp tục thực hiện việc quản lý vận hành cho đến khi Ban quản trị ký kết hợp đồng với đơn vị quản lý vận hành mới; đơn vị quản lý vận hành thay thế mới được ký kết hợp đồng theo thời hạn tương ứng với nhiệm kỳ hoạt động còn lại của Ban quản trị. 3. Hợp đồng dịch vụ quản lý vận hành nhà chung cư có các nội dung sau đây: a) Họ tên, địa chỉ, người đại diện tham gia ký kết hợp đồng; b) Quy mô, diện tích các bộ phận trong và ngoài nhà chung cư thuộc phần sở hữu chung cần quản lý vận hành; c) Nội dung và yêu cầu về chất lượng, thời gian, địa điểm cung cấp dịch vụ quản lý vận hành; d) Giá dịch vụ quản lý vận hành tính theo đơn vị mét vuông (m2) sử dụng; phương thức đóng các khoản phí; đ) Thời hạn thực hiện hợp đồng dịch vụ; e) Các trường hợp chấm dứt hợp đồng, thời gian và trách nhiệm thông báo của các bên trước khi chấm dứt hợp đồng; g) Quyền và nghĩa vụ của các bên; trách nhiệm phối hợp của các bên; việc xử lý các tranh chấp về nội dung của hợp đồng; h) Các thỏa thuận khác; i) Hiệu lực của hợp đồng. 4. Việc nghiệm thu, thanh toán, quyết toán và thanh lý hợp đồng dịch vụ quản lý vận hành nhà chung cư được thực hiện theo thỏa thuận trong hợp đồng và theo quy định của pháp luật dân sự. 5. Đối với nhà ở nhiều tầng nhiều căn hộ quy định tại khoản 2 Điều 1 của Quy chế này thì chủ sở hữu nhà ở có thể thuê đơn vị có đủ điều kiện quản lý vận hành quy định tại Điều 28 của Quy chế này thực hiện quản lý vận hành hoặc tự quản lý vận hành. Trường hợp tự quản lý vận hành thì người trực tiếp quản lý vận hành phải có kiến thức nghiệp vụ phòng cháy, chữa cháy theo quy định của pháp luật về phòng cháy, chữa cháy và có Giấy chứng nhận đã hoàn thành khóa đào tạo, bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư theo quy định của pháp luật về nhà ở.", "dieu": "29"}, "27-2023-QH15/d150": {"heading": "Điều kiện của đơn vị quản lý vận hành nhà chung cư", "text": "Điều 150. Điều kiện của đơn vị quản lý vận hành nhà chung cư 1. Đơn vị quản lý vận hành nhà chung cư phải đáp ứng các điều kiện sau đây: a) Là đơn vị sự nghiệp công lập hoặc doanh nghiệp, hợp tác xã, liên hiệp hợp tác xã có chức năng quản lý vận hành nhà chung cư; b) Phải có các phòng, ban về kỹ thuật, chăm sóc khách hàng, bảo vệ an ninh, phòng cháy, chữa cháy, vệ sinh, môi trường và bộ phận khác có liên quan để thực hiện các dịch vụ quản lý vận hành nhà chung cư; c) Người quản lý, nhân viên trực tiếp tham gia công tác quản lý vận hành của đơn vị quản lý vận hành nhà chung cư phải có trình độ chuyên môn trong các lĩnh vực xây dựng, kỹ thuật điện, nước, phòng cháy, chữa cháy, vận hành trang thiết bị gắn với nhà chung cư và phải có Giấy chứng nhận hoàn thành khóa đào tạo, bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư. 2. Đơn vị quản lý vận hành nhà chung cư chỉ được cung cấp dịch vụ quản lý vận hành nhà chung cư sau khi có văn bản thông báo đơn vị đủ điều kiện quản lý vận hành nhà chung cư của cơ quan nhà nước có thẩm quyền. 3. Chính phủ quy định chi tiết Điều này.", "dieu": "150"}, "91-2025-QH15/d14": {"heading": "Xóa, hủy, khử nhận dạng dữ liệu cá nhân", "text": "Điều 14. Xóa, hủy, khử nhận dạng dữ liệu cá nhân 1. Việc xóa, hủy dữ liệu cá nhân được thực hiện trong các trường hợp sau đây: a) Chủ thể dữ liệu cá nhân có yêu cầu và chấp nhận các rủi ro, thiệt hại có thê xảy ra đôi với mình. Yêu câu của chủ thê dữ liệu cá nhân trong trường hợp này phải tuân thủ đầy đủ các nguyên tắc quy định tại khoản 3 Điều 4 của Luật này; b) Đã hoàn thành mục đích xử lý dữ liệu cá nhân; c) Hết thời hạn lưu trữ theo quy định của pháp luật; d) Thực hiện theo quyết định của cơ quan nhà nước có thẩm quyền; đ) Thực hiện theo thỏả thuận; e) Trường hợp khác theo quy định của pháp luật. 2. Không thực hiện yêu cầu của chủ thể dữ liệu cá nhân về việc xóa, hủy dữ liệu cá nhân trong các trường hợp quy định tại Điều 19 của Luật này hoặc việc xóa, hủy dữ liệu cá nhân vi phạm quy định tại khoản 3 Điều 4 của Luật này. 3. Bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân xóa, hủy dữ liệu cá nhân trong các trường hợp quy định tại khoản 1 Điều này hoặc yêu cầu bên xử lý dữ liệu cá nhân, bên thứ ba xóa, hủy dữ liệu cá nhân của chủ thể dữ liệu cá nhân. Việc xóa, hủy dữ liệu cá nhân phải được thực hiện bằng các biện pháp an toàn; ngăn chặn hoạt động xâm nhập và khôi phục trái phép dữ liệu cá nhân đã bị xóa, hủy. 4. Cơ quan, tổ chức, cá nhân không được cố ý khôi phục trái phép dữ liệu cá nhân đã bị xóa, hủy. 5. Bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân, bên xử lý dữ liệu cá nhân có trách nhiệm tuân thủ quy định của Luật này. Trường hợp không thể xóa, hủy dữ liệu cá nhân vì lý do chính đáng sau khi nhận được yêu cầu của chủ thể dữ liệu cá nhân, bên kiểm soát dữ liệu cá nhân, bên kiểm soát và xử lý dữ liệu cá nhân phải thông báo để chủ thể dữ liệu cá nhân biết. 6. Việc khử nhận dạng dữ liệu cá nhân được quy định như sau: a) Cơ quan, tổ chức, cá nhân khử nhận dạng dữ liệu cá nhân có trách nhiệm kiểm soát và giám sát chặt chẽ quá trình khử nhận dạng dữ liệu cá nhân; ngăn chặn việc truy cập trái phép, sao chép, chiếm đoạt, làm lộ, làm mất dữ liệu cá nhân trong quá trình khử nhận dạng; b) Không được tái nhận dạng dữ liệu cá nhân sau khi đã được khử nhận dạng, trừ trường hợp pháp luật có quy định khác; c) Việc khử nhận dạng dữ liệu cá nhân tuân thủ quy định của Luật này và quy định khác của pháp luật có liên quan. [[--- trang p-08.png ---]] 9", "dieu": "14"}, "HN-33-2025-QD-UBND/d4": {"heading": "Tổ chức thực hiện", "text": "Điều 4. Tổ chức thực hiện 1. Trách nhiệm của Sở Xây dựng Chủ trì, phối hợp Sở Tài chính, Sở Nông nghiệp và Môi trường, Chi Cục Thuế khu vực I cùng đơn vị liên quan: tiếp nhận, tổng hợp các ý kiến trong việc quản lý giá dịch vụ nhà chung cư từ các đơn vị, cá nhân; tổ chức xây dựng giá dịch vụ nhà chung cư khi có biến động giá vật tư, nhiên liệu và chính sách tiền lương, xây dựng điều chỉnh khung giá dịch vụ nhà chung cư (theo quy định tại khoản 3, Điều 59 Nghị định số 95/2024 NĐ-CP ngày 24 tháng 7 năm 2024 của Chính phủ) phù hợp với tình hình thực tế, báo cáo Ủy ban nhân dân Thành phố xem xét, quyết định. 2. Trách nhiệm của Ủy ban nhân dân các quận, huyện, thị xã (chính quyền cấp cơ sở): a) Chủ trì kiểm tra hoạt động của chủ đầu tư, đơn vị quản lý vận hành nhà chung cư, Ban quản trị nhà chung cư trong quản lý tài chính về dịch vụ quản lý, vận hành nhà chung cư thuộc tài sản công trên địa bàn quản lý, giải quyết các tranh chấp có liên quan đến các hoạt động trong tòa nhà. b) Đôn đốc, kiểm tra chủ đầu tư, đơn vị quản lý vận hành nhà chung cư, Ban quản trị nhà chung cư thuộc tài sản công trên địa bàn quản lý: báo cáo tình hình quản lý tài chính về dịch vụ quản lý, vận hành nhà chung cư, thực hiện trách nhiệm quản lý vận hành nhà chung cư. c) Báo cáo về các vướng mắc, phát sinh tranh chấp trong lĩnh vực quản lý dịch vụ quản lý vận hành nhà chung cư thuộc tài sản công tại địa phương gửi Sở Xây dựng tổng hợp, báo cáo Ủy ban nhân dân Thành phố. d) Giải quyết các tranh chấp về kinh phí quản lý vận hành nhà chung cư không thuộc tài sản công, về việc bàn giao, quản lý, sử dụng kinh phí bảo trì phần sở hữu chung của nhà chung cư theo quy định của Luật Nhà ở ngày 27 tháng 11 năm 2023. 3. Trách nhiệm của Chủ đầu tư, đơn vị quản lý vận hành, Ban quản trị nhà chung cư. Căn cứ phương pháp xác định giá dịch vụ quản lý vận hành nhà chung cư theo quy định tại khoản 3, Điều 59 của Nghị định số 95/2024/NĐ-CP ngày 24 tháng 7 năm 2024 của Chính phủ để xây dựng giá (hoặc điều chỉnh giá) dịch vụ quản lý vận hành nhà chung cư báo cáo Hội nghị nhà chung cư quyết định mức giá dịch vụ nhà chung cư để làm cơ sở tổ chức thực hiện. Điều 5 Điều khoản thi hành Quyết định này có hiệu lực sau 10 ngày, kể từ ngày ký. Chấm dứt hiệu lực của Quyết định số 243/QĐ-UBND ngày 12 tháng 01 năm 2017 của Ủy ban nhân dân Thành phố về việc công bố khung giá dịch vụ nhà chung cư trên địa bàn thành phố Hà Nội kể từ ngày Quyết định này có hiệu lực. Chánh Văn phòng Ủy ban nhân dân Thành phố; Giám đốc các Sở: Xây dựng, Tài chính, Nông nghiệp và Môi trường; Chi cục trưởng Chi cục Thuế khu vực I; Chủ tịch UBND các quận, huyện, thị xã (chính quyền cấp cơ sở); Chủ đầu tư; Ban quản trị nhà chung cư; các tổ chức, cá nhân có liên quan khác chịu trách nhiệm thi hành Quyết định này./.", "dieu": "4"}, "91-2025-QH15/d9": {"heading": "Sự đồng ý của chủ thể dữ liệu cá nhân", "text": "Điều 9. Sự đồng ý của chủ thể dữ liệu cá nhân 1. Sự đồng ý của chủ thể dữ liệu cá nhân là việc chủ thể dữ liệu cá nhân cho phép xử lý dữ liệu cá nhân của mình, trừ trường hợp pháp luật có quy định khác. 2. Sự đồng ý của chủ thể dữ liệu cá nhân chỉ có hiệu lực khi dựa trên sự tự nguyện và biết rõ các thông tin sau đây: a) Loại dữ liệu cá nhân được xử lý, mục đích xử lý dữ liệu cá nhân; b) Bên kiểm soát dữ liệu cá nhân hoặc bên kiểm soát và xử lý dữ liệu cá nhân; c) Các quyền, nghĩa vụ của chủ thể dữ liệu cá nhân. 3. Sự đồng ý của chủ thể dữ liệu cá nhân được thể hiện bằng phương thức rõ ràng, cụ thể, có thể in, sao chép bằng văn bản, bao gồm cả dưới dạng điện tử hoặc định dạng kiểm chứng được. 4. Sự đồng ý của chủ thể dữ liệu cá nhân phải bảo đảm các nguyên tắc sau đây: a) Thể hiện sự đồng ý đối với từng mục đích; b) Không được kèm theo điều kiện bắt buộc phải đồng ý với các mục đích khác với nội dung thỏa thuận; c) Sự đồng ý có hiệu lực cho đến khi chủ thể dữ liệu cá nhân thay đổi sự đồng ý đó hoặc theo quy định của pháp luật; d) Sự im lặng hoặc không phản hồi không được coi là sự đồng ý. 5. Chính phủ quy định chi tiết khoản 3 Điều này.", "dieu": "9"}, "17-VBHN-BXD-2026/quy-che/d24": {"heading": "Quy chế hoạt động và quy chế thu, chi tài chính của Ban quản trị", "text": "Điều 24. Quy chế hoạt động và quy chế thu, chi tài chính của Ban quản trị 1. Quy chế hoạt động và quy chế thu, chi tài chính của Ban quản trị tòa nhà chung cư, cụm nhà chung cư do Hội nghị nhà chung cư thông qua, bảo đảm công khai, minh bạch, tuân thủ quy định của Quy chế này, quy định của pháp luật về nhà ở và pháp luật có liên quan. 2. Quy chế hoạt động của Ban quản trị tòa nhà chung cư, cụm nhà chung cư bao gồm các nội dung sau đây: a) Mô hình hoạt động của Ban quản trị được tổ chức theo mô hình tự quản nếu là nhà chung cư có một chủ sở hữu; trường hợp nhà chung cư có nhiều chủ sở hữu thì được tổ chức theo mô hình hội đồng quản trị của công ty cổ phần hoặc mô hình hội đồng quản trị của hợp tác xã; việc phối hợp giữa các thành viên Ban quản trị, giữa Ban quản trị với Ủy ban nhân dân cấp xã nơi có nhà chung cư và các cơ quan, tổ chức có liên quan trong quá trình quản lý, sử dụng nhà chung cư; b) Nguyên tắc tổ chức họp Ban quản trị, bao gồm quy định về người triệu tập họp
