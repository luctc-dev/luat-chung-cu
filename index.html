n dân cấp tỉnh hoặc hết thời hạn quy định mà khiếu nại không được giải quyết thì có quyền khiếu nại lần hai đến Bộ trưởng quản lý ngành, lĩnh vực hoặc khởi kiện vụ án hành chính tại Tòa án theo quy định của Luật Tố tụng hành chính. Trường hợp người khiếu nại không đồng ý với quyết định giải quyết lần hai của Bộ trưởng hoặc hết thời hạn quy định mà khiếu nại không được giải quyết thì có quyền khởi kiện vụ án hành chính tại Tòa án theo quy định của Luật Tố tụng hành chính.", "article": null, "footnotes": [], "amended": [], "notes": []}, "QC/d26/k2/b": {"label": "Điểm b khoản 2 Điều 26 Quy chế nhà chung cư", "ref": "điểm b khoản 2 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Ban quản trị không hoạt động sau khi được bầu;", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "QC/d26/k1/b": {"label": "Điểm b khoản 1 Điều 26 Quy chế nhà chung cư", "ref": "điểm b khoản 1 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Thành viên Ban quản trị không còn trực tiếp cư trú tại nhà chung cư đó;", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "QC/d36/k1/b": {"label": "Điểm b khoản 1 Điều 36 Quy chế nhà chung cư", "ref": "điểm b khoản 1 Điều 36", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Lập, bàn giao và quản lý kinh phí bảo trì phần sở hữu chung của nhà chung cư có nhiều chủ sở hữu", "level": "diem", "text": "Trong thời hạn 30 ngày, kể từ ngày Ban quản trị có văn bản đề nghị chuyển giao kinh phí bảo trì, chủ đầu tư và Ban quản trị có trách nhiệm quyết toán số liệu kinh phí bảo trì để chuyển sang tài khoản do Ban quản trị lập theo quy định tại điểm a khoản này để quản lý, sử dụng theo quy định của pháp luật;", "article": "17-VBHN-BXD-2026/quy-che/d36", "footnotes": [], "amended": [], "notes": []}, "QC/d22/k2": {"label": "Khoản 2 Điều 22 Quy chế nhà chung cư", "ref": "khoản 2 Điều 22", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hồ sơ đề nghị công nhận Ban quản trị", "level": "khoan", "text": "Trường hợp bầu lại Ban quản trị khi hết nhiệm kỳ, bầu Ban quản trị mới do bị miễn nhiệm, bãi nhiệm theo quy định hoặc bầu thay thế thành viên Ban quản trị, bầu thay thế Trưởng ban, bầu thay thế Phó ban quản trị không phải là đại diện của chủ đầu tư hoặc do chủ đầu tư không cử đại diện thay thế thì hồ sơ đề nghị công nhận Ban quản trị bao gồm: a) Văn bản đề nghị của Ban quản trị được bầu; b) Bản gốc quyết định công nhận Ban quản trị; c) Biên bản họp Hội nghị nhà chung cư về việc bầu lại, bầu thay thế Ban quản trị hoặc thành viên Ban quản trị hoặc bầu thay thế Trưởng ban, Phó ban quản trị; trường hợp bầu thay thế thành viên Ban quản trị theo hình thức xin ý kiến các chủ sở hữu căn hộ thì phải có biên bản theo quy định tại điểm b khoản 3 Điều 26 của Quy chế này; d) Danh sách các thành viên Ban quản trị, trong đó nêu chức danh Trưởng ban, Phó ban quản trị; đ) Quy chế hoạt động của Ban quản trị đã được Hội nghị nhà chung cư thông qua (nếu có sửa đổi, bổ sung quy chế này).", "article": "17-VBHN-BXD-2026/quy-che/d22", "footnotes": [], "amended": [], "notes": []}, "QC/d36/k1/a": {"label": "Điểm a khoản 1 Điều 36 Quy chế nhà chung cư", "ref": "điểm a khoản 1 Điều 36", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Lập, bàn giao và quản lý kinh phí bảo trì phần sở hữu chung của nhà chung cư có nhiều chủ sở hữu", "level": "diem", "text": "Ban quản trị nhà chung cư mở tài khoản tại tổ chức tín dụng, chi nhánh ngân hàng nước ngoài đang hoạt động tại Việt Nam (gọi tắt là tổ chức tín dụng) để quản lý, sử dụng kinh phí bảo trì phần sở hữu chung của cả tòa nhà chung cư;", "article": "17-VBHN-BXD-2026/quy-che/d36", "footnotes": [], "amended": [], "notes": []}, "LKN/d21/k2": {"label": "Khoản 2 Điều 21 Luật Khiếu nại", "ref": "khoản 2 Điều 21", "doc": "Luật Khiếu nại (văn bản hợp nhất số 28/VBHN-VPQH năm 2026)", "status": "hop_nhat", "heading": "Thẩm quyền của Chủ tịch Ủy ban nhân dân cấp tỉnh", "level": "khoan", "text": "Giải quyết khiếu nại lần hai đối với quyết định hành chính, hành vi hành chính của Chủ tịch Ủy ban nhân dân cấp xã, Thủ trưởng cơ quan chuyên môn, tổ chức hành chính khác thuộc Ủy ban nhân dân cấp tỉnh đã giải quyết lần đầu nhưng còn khiếu nại hoặc khiếu nại lần đầu đã hết thời hạn nhưng chưa được giải quyết.", "article": "28-VBHN-VPQH-2026/d21", "footnotes": ["Khoản này được sửa đổi, bổ sung theo quy định tại khoản 8 Điều 2 của Luật số 136/2025/QH15 sửa đổi, bổ sung một số điều của Luật Tiếp công dân, Luật Khiếu nại, Luật Tố cáo, có hiệu lực kể từ ngày 01 tháng 7 năm 2026."], "amended": [], "notes": []}, "QC/d26/k2/e": {"label": "Điểm e khoản 2 Điều 26 Quy chế nhà chung cư", "ref": "điểm e khoản 2 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Khi có đơn đề nghị bãi nhiệm có chữ ký của tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao.", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "BVDL/d11/k1": {"label": "Khoản 1 Điều 11 Luật Bảo vệ dữ liệu cá nhân", "ref": "khoản 1 Điều 11", "doc": "Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15", "status": "Còn hiệu lực", "heading": "Thu thập, phân tích, tổng hợp dữ liệu cá nhân", "level": "khoan", "text": "Dữ liệu cá nhân được thu thập phải được sự đồng ý của chủ thể dữ liệu cá nhân trước khi thu thập, trừ trường hợp pháp luật có quy định khác.", "article": "91-2025-QH15/d11", "footnotes": [], "amended": [], "notes": ["Nội dung được nhận dạng từ bản scan của văn bản nên có thể sai chính tả; nên đối chiếu với bản chính thức."]}, "QC/d15/k3": {"label": "Khoản 3 Điều 15 Quy chế nhà chung cư", "ref": "khoản 3 Điều 15", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư lần đầu", "level": "khoan", "text": "Chủ đầu tư (nếu là nhà chung cư có nhiều chủ sở hữu) hoặc chủ sở hữu (nếu là nhà chung cư có một chủ sở hữu) có trách nhiệm chuẩn bị các nội dung họp, thông báo thời gian, địa điểm và tổ chức họp hội nghị chính thức cho các chủ sở hữu, người sử dụng nhà chung cư. Chủ đầu tư hoặc chủ sở hữu có thể tổ chức họp trù bị để chuẩn bị các nội dung cho Hội nghị nhà chung cư chính thức. Nội dung chuẩn bị tổ chức Hội nghị nhà chung cư lần đầu bao gồm các công việc sau đây: a) Kiểm tra, xác định tư cách đại diện chủ sở hữu căn hộ tham dự hội nghị; trường hợp ủy quyền thì phải có văn bản ủy quyền của chủ sở hữu căn hộ. Văn bản ủy quyền bao gồm các nội dung sau: họ, tên và số điện thoại liên hệ (nếu có) của người ủy quyền và người được ủy quyền, địa chỉ căn hộ hoặc phần diện tích khác trong nhà chung cư của người ủy quyền, các nội dung ủy quyền liên quan đến Hội nghị nhà chung cư, quyền và trách nhiệm của các bên ủy quyền và được ủy quyền, văn bản ủy quyền phải có đầy đủ chữ ký của người ủy quyền và người được ủy quyền; b) Dự thảo quy chế họp Hội nghị nhà chung cư; c) Dự kiến đề xuất sửa đổi, bổ sung Bản nội quy quản lý, sử dụng nhà chung cư mà chủ đầu tư đã xây dựng nếu có đề xuất sửa đổi; d) Dự thảo quy chế bầu Ban quản trị, đề xuất tên gọi của Ban quản trị theo quy định tại điểm a khoản 1 Điều 22 của Quy chế này, đề xuất số lượng thành viên Ban quản trị, danh sách thành viên Ban quản trị, dự kiến cơ cấu Ban quản trị (nếu nhà chung cư thuộc diện phải có Ban quản trị); dự kiến kế hoạch bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư cho các thành viên Ban quản trị. Đối với nhà chung cư có nhiều chủ sở hữu thì cần chuẩn bị thêm các nội dung, bao gồm: đề xuất mức giá dịch vụ quản lý vận hành nhà chung cư, dự thảo kế hoạch bảo trì phần sở hữu chung của nhà chung cư, đề xuất đơn vị quản lý vận hành trong trường hợp nhà chung cư phải có đơn vị quản lý vận hành nhưng chủ đầu tư không đủ điều kiện quản lý vận hành nhà chung cư hoặc có đủ điều kiện quản lý vận hành nhà chung cư nhưng không tham gia quản lý vận hành; trường hợp nhà chung cư phải có Ban quản trị thì phải có dự thảo quy chế hoạt động, quy chế thu, chi tài chính của Ban quản trị; đ) Thông báo giá dịch vụ phải trả phí như bể bơi, phòng tập, sân tennis, khu spa và các dịch vụ khác (nếu có); e) Các đề xuất khác có liên quan đến việc quản lý, sử dụng nhà chung cư cần báo cáo để Hội nghị nhà chung cư lần đầu thông qua.", "article": "17-VBHN-BXD-2026/quy-che/d15", "footnotes": [], "amended": [], "notes": []}, "LNO/d153/k2/b": {"label": "Điểm b khoản 2 Điều 153 Luật Nhà ở", "ref": "điểm b khoản 2 Điều 153", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Quản lý, bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "diem", "text": "Trong thời hạn 30 ngày, kể từ ngày có văn bản đề nghị của Ban quản trị nhà chung cư, chủ đầu tư dự án đầu tư xây dựng nhà ở và Ban quản trị nhà chung cư phải thống nhất quyết toán số liệu kinh phí bảo trì để làm cơ sở bàn giao kinh phí bảo trì theo Quy chế quản lý, sử dụng nhà chung cư;", "article": "27-2023-QH15/d153", "footnotes": [], "amended": [], "notes": []}, "ND95/d86a": {"label": "Điều 86a Nghị định 95/2024", "ref": "Điều 86a", "doc": "Nghị định 95/2024/NĐ-CP quy định chi tiết một số điều của Luật Nhà ở (văn bản hợp nhất số 21/VBHN-BXD năm 2026)", "status": "hop_nhat", "heading": "Áp dụng giá dịch vụ nhà chung cư trong trường hợp đơn vị quản lý vận hành và chủ sở hữu không đạt được thỏa thuận", "level": "dieu", "text": "Điều 86a. Áp dụng giá dịch vụ nhà chung cư trong trường hợp đơn vị quản lý vận hành và chủ sở hữu không đạt được thỏa thuận Trường hợp đơn vị quản lý vận hành và các chủ sở hữu, người sử dụng nhà chung cư không thỏa thuận được giá dịch vụ quản lý vận hành nhà chung cư thì đơn vị quản lý vận hành được tạm thu theo mức phí dịch vụ đang thu của năm liền kề trước đó hoặc mức khác, đảm bảo mức tạm thu này không vượt khung giá dịch vụ quản lý vận hành nhà chung cư do Ủy ban nhân dân cấp tỉnh ban hành cho đến khi các bên thỏa thuận được giá dịch vụ.", "article": null, "footnotes": ["Điều này được bổ sung theo quy định tại Điều 24 Nghị định số 54/2026/NĐ-CP sửa đổi, bổ sung một số điều của các Nghị định trong lĩnh vực nhà ở, kinh doanh bất động sản, có hiệu lực thi hành kể từ ngày 09 tháng 02 năm 2026."], "amended": [], "notes": []}, "LKN/d28": {"label": "Điều 28 Luật Khiếu nại", "ref": "Điều 28", "doc": "Luật Khiếu nại (văn bản hợp nhất số 28/VBHN-VPQH năm 2026)", "status": "hop_nhat", "heading": "Thời hạn giải quyết khiếu nại lần đầu", "level": "dieu", "text": "Điều 28. Thời hạn giải quyết khiếu nại lần đầu Thời hạn giải quyết khiếu nại lần đầu không quá 30 ngày, kể từ ngày thụ lý; đối với vụ việc phức tạp thì thời hạn giải quyết có thể kéo dài hơn nhưng không quá 45 ngày, kể từ ngày thụ lý. Ở vùng sâu, vùng xa đi lại khó khăn thì thời hạn giải quyết khiếu nại không quá 45 ngày, kể từ ngày thụ lý; đối với vụ việc phức tạp thì thời hạn giải quyết có thể kéo dài hơn nhưng không quá 60 ngày, kể từ ngày thụ lý.", "article": null, "footnotes": [], "amended": [], "notes": []}, "QC/d26/k1/a": {"label": "Điểm a khoản 1 Điều 26 Quy chế nhà chung cư", "ref": "điểm a khoản 1 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Thành viên Ban quản trị thôi tham gia Ban quản trị hoặc xin miễn nhiệm;", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "ND95/d85/k2": {"label": "Khoản 2 Điều 85 Nghị định 95/2024", "ref": "khoản 2 Điều 85", "doc": "Nghị định 95/2024/NĐ-CP quy định chi tiết một số điều của Luật Nhà ở (văn bản hợp nhất số 21/VBHN-BXD năm 2026)", "status": "hop_nhat", "heading": "Trình tự, thủ tục thông báo đơn vị đủ điều kiện thực hiện quản lý vận hành nhà chung cư", "level": "khoan", "text": "Cơ quan tiếp nhận hồ sơ có trách nhiệm kiểm tra hồ sơ; trường hợp không đủ hoặc không đúng các giấy tờ theo quy định thì trong thời hạn tối đa 15 ngày, kể từ ngày tiếp nhận hồ sơ, cơ quan tiếp nhận phải có văn bản thông báo cho đơn vị nộp hồ sơ các giấy tờ còn thiếu. Trường hợp trong quá trình thụ lý hồ sơ đề nghị mà phát hiện đơn vị mượn giấy tờ chứng minh nhân viên của đơn vị quản lý vận hành khác được công nhận thì có văn bản thông báo từ chối công nhận đơn vị đủ điều kiện quản lý vận hành nhà chung cư. Trường hợp hồ sơ đủ các giấy tờ theo quy định thì trong thời hạn tối đa 30 ngày, kể từ ngày nhận đủ hồ sơ, cơ quan tiếp nhận hồ sơ có trách nhiệm kiểm tra, ban hành văn bản thông báo đủ điều kiện thực hiện quản lý vận hành nhà chung cư, gửi cho đơn vị quản lý vận hành và đăng tải công khai thông báo này trên Cổng thông tin điện tử của cơ quan tiếp nhận hồ sơ; văn bản thông báo này có các nội dung: tên đơn vị, địa chỉ, thông tin người đại diện theo pháp luật và có giá trị trong thời hạn 05 năm, kể từ ngày ký, trừ trường hợp quy định tại khoản 2 Điều 86 của Nghị định này. Trường hợp cơ quan quản lý nhà ở cấp tỉnh thực hiện thông báo thì trong thời hạn tối đa 15 ngày, kể từ ngày có văn bản thông báo, phải gửi một bản thông báo đến Bộ Xây dựng để đăng tải trên Cổng thông tin điện tử của Bộ Xây dựng24;", "article": "21-VBHN-BXD-2026/d85", "footnotes": [], "amended": [], "notes": []}, "LKN/d27": {"label": "Điều 27 Luật Khiếu nại", "ref": "Điều 27", "doc": "Luật Khiếu nại (văn bản hợp nhất số 28/VBHN-VPQH năm 2026)", "status": "hop_nhat", "heading": "Thụ lý giải quyết khiếu nại", "level": "dieu", "text": "Điều 27. Thụ lý giải quyết khiếu nại Trong thời hạn 07 ngày làm việc, kể từ ngày nhận được khiếu nại thuộc thẩm quyền mà không thuộc một trong các trường hợp được quy định tại Điều 11 của Luật này, người có thẩm quyền giải quyết khiếu nại lần đầu phải thụ lý giải quyết; thông báo bằng văn bản cho người khiếu nại, cơ quan, tổ chức, cá nhân có thẩm quyền chuyển khiếu nại đến và cơ quan thanh tra nhà nước cùng cấp biết, trường hợp không thụ lý giải quyết thì phải nêu rõ lý do.", "article": null, "footnotes": ["Cụm từ “10 ngày” được thay thế bằng cụm từ “07 ngày làm việc” theo quy định tại điểm b khoản 15 Điều 2 của Luật số 136/2025/QH15 sửa đổi, bổ sung một số điều của Luật Tiếp công dân, Luật Khiếu nại, Luật Tố cáo, có hiệu lực kể từ ngày 01 tháng 7 năm 2026."], "amended": [], "notes": []}, "QC/d44/k3": {"label": "Khoản 3 Điều 44 Quy chế nhà chung cư", "ref": "khoản 3 Điều 44", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Giải quyết tranh chấp", "level": "khoan", "text": "Các tranh chấp giữa Ban quản trị với chủ sở hữu, người sử dụng nhà chung cư về việc bầu, miễn nhiệm, bãi nhiệm, thay thế thành viên Ban quản trị hoặc các vấn đề khác liên quan đến công tác quản lý vận hành nhà chung cư được giải quyết trên cơ sở thương lượng; trường hợp không thương lượng được thì đề nghị tổ chức họp Hội nghị nhà chung cư để giải quyết.", "article": "17-VBHN-BXD-2026/quy-che/d44", "footnotes": [], "amended": [], "notes": []}, "QC/d29/k3/d": {"label": "Điểm d khoản 3 Điều 29 Quy chế nhà chung cư", "ref": "điểm d khoản 3 Điều 29", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hợp đồng dịch vụ quản lý vận hành nhà chung cư", "level": "diem", "text": "Giá dịch vụ quản lý vận hành tính theo đơn vị mét vuông (m2) sử dụng; phương thức đóng các khoản phí;", "article": "17-VBHN-BXD-2026/quy-che/d29", "footnotes": [], "amended": [], "notes": []}, "QC/d44/k1": {"label": "Khoản 1 Điều 44 Quy chế nhà chung cư", "ref": "khoản 1 Điều 44", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Giải quyết tranh chấp", "level": "khoan", "text": "Các tranh chấp về kinh phí quản lý vận hành nhà chung cư, về việc bàn giao, quản lý, sử dụng kinh phí bảo trì phần sở hữu chung của nhà chung cư do Ủy ban nhân dân cấp xã nơi có nhà chung cư đó hoặc Tòa án hoặc trọng tài thương mại giải quyết theo quy định của pháp luật.", "article": "17-VBHN-BXD-2026/quy-che/d44", "footnotes": ["Cụm từ “Ủy ban nhân dân cấp huyện” được thay thế bằng “Ủy ban nhân dân cấp xã” theo quy định tại điểm c khoản 5 Điều 2 của Thông tư số 09/2025/TT-BXD sửa đổi, bổ sung một số điều của các Thông tư thuộc lĩnh vực quản lý nhà nước của Bộ Xây dựng liên quan đến sắp xếp tổ chức bộ máy, thực hiện chính quyền địa phương 02 cấp và phân cấp cho chính quyền địa phương, có hiệu lực kể từ ngày 01 tháng 7 năm 2025."], "amended": [], "notes": []}, "QC/d16/k5/c": {"label": "Điểm c khoản 5 Điều 16 Quy chế nhà chung cư", "ref": "điểm c khoản 5 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Trường hợp thuộc diện quy định tại điểm a, c, d, e và điểm g khoản 1 Điều này nhưng Ban quản trị không tổ chức Hội nghị nhà chung cư hoặc cụm nhà chung cư và có đơn của tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao đề nghị tổ chức Hội nghị nhà chung cư bất thường;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k1": {"label": "Khoản 1 Điều 16 Quy chế nhà chung cư", "ref": "khoản 1 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "khoan", "text": "Hội nghị nhà chung cư bất thường được tổ chức xem xét, quyết định một trong các vấn đề sau đây: a) Bầu thay thế Trưởng ban hoặc Phó ban quản trị trong trường hợp phải bầu các vị trí này theo quy định tại điểm a khoản 3 hoặc điểm a khoản 4 Điều 26 của Quy chế này; b) Miễn nhiệm hoặc bãi nhiệm toàn bộ các thành viên Ban quản trị và bầu Ban quản trị mới; c) Bầu thay thế thành viên Ban quản trị không phải là Trưởng ban, Phó ban do bị miễn nhiệm, bãi nhiệm hoặc bị chết, mất tích trong trường hợp đã tổ chức lấy ý kiến của các chủ sở hữu nhà chung cư nhưng không đủ số người đồng ý theo quy định tại điểm b khoản 3 Điều 26 của Quy chế này hoặc bầu thay thế thành viên Ban quản trị theo quy định tại điểm b khoản 4 Điều 26 của Quy chế này; d) Ban quản trị đề nghị thay thế đơn vị quản lý vận hành hoặc đề nghị điều chỉnh giá dịch vụ quản lý vận hành nhà chung cư; đ) Trường hợp phá dỡ để cải tạo, xây dựng lại nhà chung cư theo quy định của pháp luật về cải tạo, xây dựng lại nhà chung cư; e) Các nội dung thuộc diện Hội nghị nhà chung cư lần đầu quyết định và do chủ đầu tư tổ chức quy định tại khoản 4 Điều 15 của Quy chế này nhưng Hội nghị nhà chung cư đó chưa quyết định được; g) Báo cáo việc bảo trì, sửa chữa các hạng mục đột xuất không có trong kế hoạch bảo trì đã được Hội nghị nhà chung cư thông qua hoặc sửa đổi, điều chỉnh kế hoạch bảo trì đã được thông qua; h) Các trường hợp khác khi có đơn đề nghị của tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao.", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k1/a": {"label": "Điểm a khoản 1 Điều 16 Quy chế nhà chung cư", "ref": "điểm a khoản 1 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Bầu thay thế Trưởng ban hoặc Phó ban quản trị trong trường hợp phải bầu các vị trí này theo quy định tại điểm a khoản 3 hoặc điểm a khoản 4 Điều 26 của Quy chế này;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "ND339/d61/k2/b": {"label": "Điểm b khoản 2 Điều 61 Nghị định 339/2026", "ref": "điểm b khoản 2 Điều 61", "doc": "Nghị định 339/2026/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực xây dựng, quản lý, phát triển nhà, kinh doanh bất động sản", "status": "Còn hiệu lực", "heading": "Vi phạm quy định của thành viên Ban quản trị, Ban quản trị nhà chung cư về quản lý, sử dụng nhà chung cư", "level": "diem", "text": "Không nhận bàn giao hồ sơ nhà chung cư, không tiếp nhận quỹ bảo trì phần sở hữu chung của nhà chung cư từ chủ đầu tư theo quy định của Luật Nhà ở trong trường hợp chủ đầu tư bàn giao theo đúng quy định của pháp luật về nhà ở;", "article": "339-2026-ND-CP/d61", "footnotes": [], "amended": [], "notes": []}, "QC/d15/k2/a": {"label": "Điểm a khoản 2 Điều 15 Quy chế nhà chung cư", "ref": "điểm a khoản 2 Điều 15", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư lần đầu", "level": "diem", "text": "Đối với Hội nghị của tòa nhà chung cư thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao tham dự theo hình thức quy định tại khoản 2 Điều 145 của Luật Nhà ở. Trường hợp không đủ số người tham dự quy định tại điểm này thì trong thời hạn 07 ngày làm việc, kể từ ngày tổ chức họp hội nghị được ghi trong thông báo mời họp, chủ đầu tư hoặc đại diện chủ sở hữu căn hộ có văn bản đề nghị Ủy ban nhân dân cấp xã nơi có nhà chung cư tổ chức Hội nghị nhà chung cư;", "article": "17-VBHN-BXD-2026/quy-che/d15", "footnotes": [], "amended": [], "notes": []}, "LNO/d150/k2": {"label": "Khoản 2 Điều 150 Luật Nhà ở", "ref": "khoản 2 Điều 150", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Điều kiện của đơn vị quản lý vận hành nhà chung cư", "level": "khoan", "text": "Đơn vị quản lý vận hành nhà chung cư chỉ được cung cấp dịch vụ quản lý vận hành nhà chung cư sau khi có văn bản thông báo đơn vị đủ điều kiện quản lý vận hành nhà chung cư của cơ quan nhà nước có thẩm quyền.", "article": "27-2023-QH15/d150", "footnotes": [], "amended": [], "notes": []}, "BVDL/d14/k1": {"label": "Khoản 1 Điều 14 Luật Bảo vệ dữ liệu cá nhân", "ref": "khoản 1 Điều 14", "doc": "Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15", "status": "Còn hiệu lực", "heading": "Xóa, hủy, khử nhận dạng dữ liệu cá nhân", "level": "khoan", "text": "Việc xóa, hủy dữ liệu cá nhân được thực hiện trong các trường hợp sau đây: a) Chủ thể dữ liệu cá nhân có yêu cầu và chấp nhận các rủi ro, thiệt hại có thê xảy ra đôi với mình. Yêu câu của chủ thê dữ liệu cá nhân trong trường hợp này phải tuân thủ đầy đủ các nguyên tắc quy định tại khoản 3 Điều 4 của Luật này; b) Đã hoàn thành mục đích xử lý dữ liệu cá nhân; c) Hết thời hạn lưu trữ theo quy định của pháp luật; d) Thực hiện theo quyết định của cơ quan nhà nước có thẩm quyền; đ) Thực hiện theo thỏả thuận; e) Trường hợp khác theo quy định của pháp luật.", "article": "91-2025-QH15/d14", "footnotes": [], "amended": [], "notes": ["Nội dung được nhận dạng từ bản scan của văn bản nên có thể sai chính tả; nên đối chiếu với bản chính thức."]}, "LNO/d152/k1": {"label": "Khoản 1 Điều 152 Luật Nhà ở", "ref": "khoản 1 Điều 152", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "khoan", "text": "Đối với căn hộ, phần diện tích khác trong nhà chung cư mà chủ đầu tư dự án đầu tư xây dựng nhà ở bán, cho thuê mua thì người mua, thuê mua phải đóng kinh phí bảo trì là 2% giá trị căn hộ, phần diện tích bán, cho thuê mua này; khoản tiền này được tính riêng với tiền bán, tiền thuê mua căn hộ, phần diện tích khác trong nhà chung cư và được quy định rõ trong hợp đồng mua bán, hợp đồng thuê mua.", "article": "27-2023-QH15/d152", "footnotes": [], "amended": [], "notes": []}, "LNO/d151/k7/b": {"label": "Điểm b khoản 7 Điều 151 Luật Nhà ở", "ref": "điểm b khoản 7 Điều 151", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Giá dịch vụ quản lý vận hành nhà chung cư", "level": "diem", "text": "Làm cơ sở để các bên tham khảo khi thỏa thuận giá dịch vụ quản lý vận hành đối với nhà ở không thuộc tài sản công hoặc trong trường hợp có tranh chấp về giá dịch vụ giữa đơn vị quản lý vận hành nhà chung cư với chủ sở hữu, người sử dụng nhà chung cư; trường hợp không thỏa thuận được giá dịch vụ quản lý vận hành nhà chung cư thì áp dụng mức giá trong khung giá dịch vụ do Ủy ban nhân dân cấp tỉnh ban hành.", "article": "27-2023-QH15/d151", "footnotes": [], "amended": [], "notes": []}, "HN33/d4/k3": {"label": "Khoản 3 Điều 4 Quyết định 33/2025 của UBND Hà Nội", "ref": "khoản 3 Điều 4", "doc": "Quyết định 33/2025/QĐ-UBND của UBND thành phố Hà Nội ban hành khung giá dịch vụ quản lý vận hành nhà chung cư", "status": "Hết hiệu lực một phần", "heading": "Tổ chức thực hiện", "level": "khoan", "text": "Trách nhiệm của Chủ đầu tư, đơn vị quản lý vận hành, Ban quản trị nhà chung cư. Căn cứ phương pháp xác định giá dịch vụ quản lý vận hành nhà chung cư theo quy định tại khoản 3, Điều 59 của Nghị định số 95/2024/NĐ-CP ngày 24 tháng 7 năm 2024 của Chính phủ để xây dựng giá (hoặc điều chỉnh giá) dịch vụ quản lý vận hành nhà chung cư báo cáo Hội nghị nhà chung cư quyết định mức giá dịch vụ nhà chung cư để làm cơ sở tổ chức thực hiện. Điều 5 Điều khoản thi hành Quyết định này có hiệu lực sau 10 ngày, kể từ ngày ký. Chấm dứt hiệu lực của Quyết định số 243/QĐ-UBND ngày 12 tháng 01 năm 2017 của Ủy ban nhân dân Thành phố về việc công bố khung giá dịch vụ nhà chung cư trên địa bàn thành phố Hà Nội kể từ ngày Quyết định này có hiệu lực. Chánh Văn phòng Ủy ban nhân dân Thành phố; Giám đốc các Sở: Xây dựng, Tài chính, Nông nghiệp và Môi trường; Chi cục trưởng Chi cục Thuế khu vực I; Chủ tịch UBND các quận, huyện, thị xã (chính quyền cấp cơ sở); Chủ đầu tư; Ban quản trị nhà chung cư; các tổ chức, cá nhân có liên quan khác chịu trách nhiệm thi hành Quyết định này./.", "article": "HN-33-2025-QD-UBND/d4", "footnotes": [], "amended": [], "notes": []}, "BVDL/d9/k2": {"label": "Khoản 2 Điều 9 Luật Bảo vệ dữ liệu cá nhân", "ref": "khoản 2 Điều 9", "doc": "Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15", "status": "Còn hiệu lực", "heading": "Sự đồng ý của chủ thể dữ liệu cá nhân", "level": "khoan", "text": "Sự đồng ý của chủ thể dữ liệu cá nhân chỉ có hiệu lực khi dựa trên sự tự nguyện và biết rõ các thông tin sau đây: a) Loại dữ liệu cá nhân được xử lý, mục đích xử lý dữ liệu cá nhân; b) Bên kiểm soát dữ liệu cá nhân hoặc bên kiểm soát và xử lý dữ liệu cá nhân; c) Các quyền, nghĩa vụ của chủ thể dữ liệu cá nhân.", "article": "91-2025-QH15/d9", "footnotes": [], "amended": [], "notes": ["Nội dung được nhận dạng từ bản scan của văn bản nên có thể sai chính tả; nên đối chiếu với bản chính thức."]}, "QC/d16/k5/a": {"label": "Điểm a khoản 5 Điều 16 Quy chế nhà chung cư", "ref": "điểm a khoản 5 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Trường hợp quy định tại điểm b khoản 1 Điều này và có đơn của đại diện chủ sở hữu căn hộ đã nhận bàn giao đề nghị tổ chức Hội nghị nhà chung cư bất thường;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d24/k1": {"label": "Khoản 1 Điều 24 Quy chế nhà chung cư", "ref": "khoản 1 Điều 24", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Quy chế hoạt động và quy chế thu, chi tài chính của Ban quản trị", "level": "khoan", "text": "Quy chế hoạt động và quy chế thu, chi tài chính của Ban quản trị tòa nhà chung cư, cụm nhà chung cư do Hội nghị nhà chung cư thông qua, bảo đảm công khai, minh bạch, tuân thủ quy định của Quy chế này, quy định của pháp luật về nhà ở và pháp luật có liên quan.", "article": "17-VBHN-BXD-2026/quy-che/d24", "footnotes": [], "amended": [], "notes": []}, "LNO/d153/k2": {"label": "Khoản 2 Điều 153 Luật Nhà ở", "ref": "khoản 2 Điều 153", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Quản lý, bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "khoan", "text": "Việc bàn giao kinh phí bảo trì được quy định như sau: a) Sau khi có quyết định công nhận Ban quản trị nhà chung cư của cơ quan có thẩm quyền, Ban quản trị nhà chung cư có trách nhiệm mở tài khoản tại tổ chức chức tín dụng, chi nhánh ngân hàng nước ngoài đang hoạt động tại Việt Nam để quản lý kinh phí bảo trì và có văn bản đề nghị chủ đầu tư dự án đầu tư xây dựng nhà ở bàn giao kinh phí bảo trì đã thu theo quy định tại khoản 1 Điều này; b) Trong thời hạn 30 ngày, kể từ ngày có văn bản đề nghị của Ban quản trị nhà chung cư, chủ đầu tư dự án đầu tư xây dựng nhà ở và Ban quản trị nhà chung cư phải thống nhất quyết toán số liệu kinh phí bảo trì để làm cơ sở bàn giao kinh phí bảo trì theo Quy chế quản lý, sử dụng nhà chung cư; c) Căn cứ số liệu quyết toán kinh phí bảo trì quy định tại điểm b khoản này, chủ đầu tư dự án đầu tư xây dựng nhà ở đề nghị tổ chức tín dụng, chi nhánh ngân hàng nước ngoài đang quản lý tài khoản kinh phí bảo trì chuyển kinh phí này và lãi phát sinh từ kinh phí bảo trì sang tài khoản quản lý kinh phí do Ban quản trị nhà chung cư lập; d) Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài có trách nhiệm chuyển kinh phí quy định tại điểm c khoản này cho Ban quản trị nhà chung cư theo số liệu hai bên đã quyết toán. Các chi phí phát sinh từ việc chuyển giao kinh phí bảo trì được khấu trừ vào kinh phí bảo trì.", "article": "27-2023-QH15/d153", "footnotes": [], "amended": [], "notes": []}, "ND339/d61/k4/a": {"label": "Điểm a khoản 4 Điều 61 Nghị định 339/2026", "ref": "điểm a khoản 4 Điều 61", "doc": "Nghị định 339/2026/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực xây dựng, quản lý, phát triển nhà, kinh doanh bất động sản", "status": "Còn hiệu lực", "heading": "Vi phạm quy định của thành viên Ban quản trị, Ban quản trị nhà chung cư về quản lý, sử dụng nhà chung cư", "level": "diem", "text": "Buộc bàn giao lại hồ sơ, giấy tờ đang quản lý cho Ban quản trị mới theo quy định đối với hành vi quy định tại điểm a khoản 2 Điều này;", "article": "339-2026-ND-CP/d61", "footnotes": [], "amended": [], "notes": []}, "LNO/d151/k2": {"label": "Khoản 2 Điều 151 Luật Nhà ở", "ref": "khoản 2 Điều 151", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Giá dịch vụ quản lý vận hành nhà chung cư", "level": "khoan", "text": "Giá dịch vụ quản lý vận hành nhà chung cư không bao gồm kinh phí mua bảo hiểm cháy, nổ, kinh phí bảo trì, chi phí trông giữ xe, chi phí sử dụng nhiên liệu, năng lượng, nước sinh hoạt, dịch vụ truyền hình, thông tin liên lạc, thù lao cho Ban quản trị nhà chung cư và chi phí dịch vụ khác phục vụ cho việc sử dụng riêng của chủ sở hữu, người sử dụng nhà chung cư. Giá dịch vụ quản lý vận hành nhà chung cư được xác định bằng tiền Việt Nam và tính trên mỗi mét vuông diện tích sử dụng căn hộ hoặc phần diện tích khác trong nhà chung cư.", "article": "27-2023-QH15/d151", "footnotes": [], "amended": [], "notes": []}, "LNO/d153/k1/a": {"label": "Điểm a khoản 1 Điều 153 Luật Nhà ở", "ref": "điểm a khoản 1 Điều 153", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Quản lý, bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "diem", "text": "Trước khi ký hợp đồng mua bán, thuê mua căn hộ, phần diện tích khác trong nhà chung cư, chủ đầu tư dự án đầu tư xây dựng nhà ở có trách nhiệm mở một tài khoản thanh toán tại một tổ chức tín dụng hoặc chi nhánh ngân hàng nước ngoài đang hoạt động trên địa bàn nơi có nhà chung cư để người mua, thuê mua căn hộ, phần diện tích khác trong nhà chung cư và chủ đầu tư dự án đầu tư xây dựng nhà ở nộp kinh phí bảo trì theo quy định tại Điều 152 của Luật này. Trong thời hạn 05 ngày làm việc, kể từ ngày mở tài khoản, chủ đầu tư dự án đầu tư xây dựng nhà ở phải có văn bản thông báo cho cơ quan quản lý nhà ở cấp tỉnh nơi có dự án biết về tên chủ tài khoản, số tài khoản đã mở, tên tổ chức tín dụng, chi nhánh ngân hàng nước ngoài nơi mở tài khoản và kỳ hạn gửi tiền. Chủ đầu tư dự án đầu tư xây dựng nhà ở không được yêu cầu tổ chức tín dụng, chi nhánh ngân hàng nước ngoài trích kinh phí mà các bên đã nộp vào tài khoản đã lập theo quy định tại điểm này để sử dụng vào bất kỳ mục đích nào khác khi chưa bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư. Trường hợp trong thời gian chưa bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư mà phát sinh việc bảo trì hạng mục, trang thiết bị thuộc phần sở hữu chung của nhà chung cư đã hết thời hạn bảo hành theo quy định thì chủ đầu tư dự án đầu tư xây dựng nhà ở có trách nhiệm sử dụng kinh phí của chủ đầu tư dự án đầu tư xây dựng nhà ở để thực hiện việc bảo trì hạng mục, trang thiết bị này nhưng phải tuân thủ kế hoạch, quy trình bảo trì công trình được lập theo quy định của pháp luật về xây dựng. Khi bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư, chủ đầu tư dự án đầu tư xây dựng nhà ở được hoàn trả lại các khoản kinh phí đã sử dụng cho việc bảo trì này nhưng phải có văn bản báo cáo cụ thể kèm theo kế hoạch, quy trình bảo trì đã lập và phải có hóa đơn, chứng từ chứng minh việc bảo trì này;", "article": "27-2023-QH15/d153", "footnotes": [], "amended": [], "notes": []}, "ND95/d91/k1": {"label": "Khoản 1 Điều 91 Nghị định 95/2024", "ref": "khoản 1 Điều 91", "doc": "Nghị định 95/2024/NĐ-CP quy định chi tiết một số điều của Luật Nhà ở (văn bản hợp nhất số 21/VBHN-BXD năm 2026)", "status": "hop_nhat", "heading": "Trình tự, thủ tục cưỡng chế kê biên, bán đấu giá tài sản của chủ đầu tư", "level": "khoan", "text": "Trường hợp đã thực hiện cưỡng chế chủ đầu tư bàn giao kinh phí bảo trì phần sở hữu chung theo quy định tại Điều 88 hoặc Điều 90 của Nghị định này mà Ban quản trị vẫn chưa nhận đủ số tiền theo quy định tại Điều 153 của Luật Nhà ở thì Ban quản trị nhà chung cư có văn bản đề nghị Ủy ban nhân dân cấp huyện cưỡng chế kê biên, bán đấu giá tài sản của chủ đầu tư để thu hồi kinh phí bảo trì.", "article": "21-VBHN-BXD-2026/d91", "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 12 Nghị định 140/2025/NĐ-CP."]}, "QC/d29/k1": {"label": "Khoản 1 Điều 29 Quy chế nhà chung cư", "ref": "khoản 1 Điều 29", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hợp đồng dịch vụ quản lý vận hành nhà chung cư", "level": "khoan", "text": "Việc quản lý vận hành nhà chung cư phải được thực hiện thông qua hợp đồng dịch vụ quản lý vận hành nhà chung cư ký giữa đơn vị quản lý vận hành và Ban quản trị. Trong trường hợp bầu Ban quản trị mới tại Hội nghị nhà chung cư lần đầu mà chưa được cơ quan có thẩm quyền công nhận Ban quản trị theo quy định tại Điều 23 của Quy chế này thì các bên thực hiện quyền và trách nhiệm quản lý vận hành theo nội dung đã được Hội nghị nhà chung cư thông qua. Sau khi Ban quản trị được công nhận thì thỏa thuận, thống nhất ký hợp đồng dịch vụ quản lý vận hành nhà chung cư theo quy định của pháp luật. Hợp đồng dịch vụ quản lý vận hành nhà chung cư có thời hạn tối thiểu 12 tháng, trừ trường hợp quy định tại khoản 2 Điều này và tối đa có thời hạn bằng nhiệm kỳ của Ban quản trị quy định tại khoản 3 Điều 19 của Quy chế này; trường hợp hợp đồng dịch vụ quản lý vận hành có thời hạn 12 tháng thì khi hết thời hạn này, việc tiếp tục ký hoặc không ký tiếp hợp đồng dịch vụ quản lý vận hành do Hội nghị nhà chung cư quyết định trên cơ sở thống nhất với đơn vị quản lý vận hành. Trường hợp ký hợp đồng dịch vụ quản lý vận hành theo nhiệm kỳ của Ban quản trị nhưng Ban quản trị mới chưa được thành lập và chưa được công nhận thì đơn vị quản lý vận hành tiếp tục thực hiện việc quản lý vận hành đến khi Ban quản trị mới được công nhận và ký hợp đồng với đơn vị quản lý vận hành mới, trừ trường hợp thuộc diện đơn phương chấm dứt hợp đồng do một hoặc các bên vi phạm nội dung thuộc diện chấm dứt hợp đồng.", "article": "17-VBHN-BXD-2026/quy-che/d29", "footnotes": [], "amended": [], "notes": []}, "QC/d18/k2/b": {"label": "Điểm b khoản 2 Điều 18 Quy chế nhà chung cư", "ref": "điểm b khoản 2 Điều 18", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thành phần tham dự và việc biểu quyết tại Hội nghị nhà chung cư", "level": "diem", "text": "Trường hợp tổ chức Hội nghị nhà chung cư bất thường và Hội nghị nhà chung cư thường niên thì thành phần tham dự bao gồm đại diện chủ sở hữu căn hộ đã nhận bàn giao, đại diện chủ đầu tư (nếu chủ đầu tư còn sở hữu diện tích trong nhà chung cư), đại diện đơn vị quản lý vận hành (nếu nhà chung cư phải thuê đơn vị quản lý vận hành) và mời đại diện của Ủy ban nhân dân cấp xã; trường hợp các thành phần quy định tại điểm này không cử đại diện tham dự thì vẫn phải chấp hành các quyết định của Hội nghị nhà chung cư.", "article": "17-VBHN-BXD-2026/quy-che/d18", "footnotes": [], "amended": [], "notes": []}, "ND95/d88/k1": {"label": "Khoản 1 Điều 88 Nghị định 95/2024", "ref": "khoản 1 Điều 88", "doc": "Nghị định 95/2024/NĐ-CP quy định chi tiết một số điều của Luật Nhà ở (văn bản hợp nhất số 21/VBHN-BXD năm 2026)", "status": "hop_nhat", "heading": "Trình tự, thủ tục cưỡng chế bàn giao kinh phí bảo trì phần sở hữu chung từ tài khoản chung của chủ đầu tư", "level": "khoan", "text": "Trong thời hạn tối đa 15 ngày, kể từ khi nhận được văn bản của Ban quản trị nhà chung cư gửi Ủy ban nhân dân cấp huyện nơi có nhà chung cư yêu cầu chủ đầu tư bàn giao kinh phí bảo trì, Ủy ban nhân dân cấp huyện phải kiểm tra và có văn bản yêu cầu chủ đầu tư bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư. Trường hợp nhà chung cư thuộc diện quy định tại khoản 4 Điều 155 của Luật Nhà ở thì phải xác định rõ phần kinh phí bảo trì mà chủ đầu tư phải nộp cho Ban quản trị nhà chung cư và phần kinh phí bảo trì mà chủ đầu tư được giữ lại theo thỏa thuận trong hợp đồng mua bán, thuê mua căn hộ, phần diện tích khác trong nhà chung cư.", "article": "21-VBHN-BXD-2026/d88", "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 12 Nghị định 140/2025/NĐ-CP."]}, "LKN/d9": {"label": "Điều 9 Luật Khiếu nại", "ref": "Điều 9", "doc": "Luật Khiếu nại (văn bản hợp nhất số 28/VBHN-VPQH năm 2026)", "status": "hop_nhat", "heading": "Thời hiệu khiếu nại", "level": "dieu", "text": "Điều 9. Thời hiệu khiếu nại Thời hiệu khiếu nại là 90 ngày, kể từ ngày nhận được quyết định hành chính hoặc biết được quyết định hành chính, hành vi hành chính. Trường hợp người khiếu nại không thực hiện được quyền khiếu nại theo đúng thời hiệu vì ốm đau, thiên tai, địch họa, đi công tác, học tập ở nơi xa hoặc vì những trở ngại khách quan khác thì thời gian có trở ngại đó không tính vào thời hiệu khiếu nại.", "article": null, "footnotes": [], "amended": [], "notes": []}, "QC/d19/k9": {"label": "Khoản 9 Điều 19 Quy chế nhà chung cư", "ref": "khoản 9 Điều 19", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Ban quản trị nhà chung cư", "level": "khoan", "text": "Mức thù lao của các thành viên Ban quản trị do các chủ sở hữu, người sử dụng nhà chung cư đóng góp theo quyết định của Hội nghị nhà chung cư. Hội nghị nhà chung cư có thể tham khảo mức lương tối thiểu vùng theo quy định của pháp luật để xem xét, quyết định về mức thù lao tương xứng với trách nhiệm, nghĩa vụ của các thành viên Ban quản trị trên cơ sở điều kiện cụ thể của từng tòa nhà, cụm nhà chung cư và từng địa phương, trừ trường hợp thành viên Ban quản trị từ chối nhận thù lao. Trường hợp nhà chung cư có đơn vị quản lý vận hành theo quy định của Luật Nhà ở và Quy chế này thì chủ sở hữu, người đang sử dụng nhà chung cư có trách nhiệm đóng thù lao qua đơn vị này để chi trả cho các thành viên Ban quản trị; khoản tiền này không phải hạch toán vào hoạt động kinh doanh của đơn vị quản lý vận hành. Nếu nhà chung cư không có đơn vị quản lý vận hành theo quy định của Luật Nhà ở và Quy chế này thì thù lao này do Ban quản trị thu và chi trả cho từng thành viên.", "article": "17-VBHN-BXD-2026/quy-che/d19", "footnotes": [], "amended": [], "notes": []}, "ND339/d59/k3/c": {"label": "Điểm c khoản 3 Điều 59 Nghị định 339/2026", "ref": "điểm c khoản 3 Điều 59", "doc": "Nghị định 339/2026/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực xây dựng, quản lý, phát triển nhà, kinh doanh bất động sản", "status": "Còn hiệu lực", "heading": "Vi phạm quy định của chủ đầu tư về quản lý, sử dụng nhà chung cư và kinh phí bảo trì", "level": "diem", "text": "Không tổ chức Hội nghị nhà chung cư lần đầu theo quy định;", "article": "339-2026-ND-CP/d59", "footnotes": [], "amended": [], "notes": []}, "QC/d25/k2": {"label": "Khoản 2 Điều 25 Quy chế nhà chung cư", "ref": "khoản 2 Điều 25", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Biểu quyết thông qua các quyết định của Ban quản trị", "level": "khoan", "text": "Đối với nhà chung cư có nhiều chủ sở hữu thì các đề xuất sau đây chỉ được thông qua khi có tối thiểu 50% tổng số thành viên của Ban quản trị nhà chung cư, cụm nhà chung cư tán thành: a) Đề xuất thay đổi đơn vị quản lý vận hành; b) Đề xuất hình thức lựa chọn đơn vị bảo trì, trừ trường hợp bảo trì đột xuất phát sinh không trong thời gian tổ chức Hội nghị nhà chung cư thường niên hoặc không tổ chức Hội nghị nhà chung cư bất thường; c) Đề xuất thay đổi giá dịch vụ quản lý vận hành nhà chung cư; d) Các đề xuất, yêu cầu của Ban quản trị đối với chủ đầu tư trong quá trình quản lý, sử dụng nhà chung cư; đ) Các trường hợp khác do Hội nghị nhà chung cư quyết định.", "article": "17-VBHN-BXD-2026/quy-che/d25", "footnotes": [], "amended": [], "notes": []}, "ND339/d61/k2/a": {"label": "Điểm a khoản 2 Điều 61 Nghị định 339/2026", "ref": "điểm a khoản 2 Điều 61", "doc": "Nghị định 339/2026/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực xây dựng, quản lý, phát triển nhà, kinh doanh bất động sản", "status": "Còn hiệu lực", "heading": "Vi phạm quy định của thành viên Ban quản trị, Ban quản trị nhà chung cư về quản lý, sử dụng nhà chung cư", "level": "diem", "text": "Không bàn giao lại hồ sơ, giấy tờ đang quản lý cho Ban quản trị mới theo quy định;", "article": "339-2026-ND-CP/d61", "footnotes": [], "amended": [], "notes": []}, "QC/d20/k2": {"label": "Khoản 2 Điều 20 Quy chế nhà chung cư", "ref": "khoản 2 Điều 20", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Yêu cầu đối với thành viên Ban quản trị", "level": "khoan", "text": "Sau khi được cơ quan có thẩm quyền công nhận Ban quản trị theo quy định tại Điều 23 của Quy chế này thì trong thời hạn không quá 03 tháng, kể từ ngày được công nhận, các thành viên Ban quản trị phải tham gia khóa đào tạo, bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư và được cấp Giấy chứng nhận hoàn thành khóa đào tạo, bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư theo quy định của pháp luật về nhà ở.", "article": "17-VBHN-BXD-2026/quy-che/d20", "footnotes": [], "amended": [], "notes": []}, "LNO/d145/k3/d": {"label": "Điểm d khoản 3 Điều 145 Luật Nhà ở", "ref": "điểm d khoản 3 Điều 145", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Hội nghị nhà chung cư", "level": "diem", "text": "Quyết định lựa chọn đơn vị quản lý vận hành nhà chung cư trong trường hợp không còn chủ đầu tư dự án đầu tư xây dựng nhà ở hoặc chủ đầu tư dự án đầu tư xây dựng nhà ở không có chức năng, năng lực quản lý vận hành nhà chung cư hoặc có chức năng, năng lực quản lý vận hành nhưng không tham gia quản lý vận hành hoặc tham gia quản lý vận hành nhưng không đáp ứng được các yêu cầu đã thỏa thuận trong hợp đồng cung cấp dịch vụ ký với Ban quản trị nhà chung cư;", "article": "27-2023-QH15/d145", "footnotes": [], "amended": [], "notes": []}}, "articles": {"17-VBHN-BXD-2026/quy-che/d26": {"heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "text": "Điều 26. Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị 1. Việc miễn nhiệm thành viên Ban quản trị tòa nhà chung cư, cụm nhà chung cư được thực hiện khi có một trong các trường hợp sau đây: a) Thành viên Ban quản trị thôi tham gia Ban quản trị hoặc xin miễn nhiệm; b) Thành viên Ban quản trị không còn trực tiếp cư trú tại nhà chung cư đó; c) Trưởng ban quản trị của tòa nhà chung cư tách khỏi cụm nhà chung cư trong trường hợp quy định tại điểm b khoản 2 Điều 27 của Quy chế này; d) Thành viên Ban quản trị của tòa nhà nhập vào cụm nhà chung cư trong trường hợp quy định tại khoản 3 Điều 27 của Quy chế này. 2. Việc bãi nhiệm Ban quản trị, thành viên Ban quản trị tòa nhà chung cư, cụm nhà chung cư được thực hiện khi có một trong các trường hợp sau đây: a) Ban quản trị không báo cáo kết quả hoạt động cho Hội nghị nhà chung cư theo quy định của Quy chế này; b) Ban quản trị không hoạt động sau khi được bầu; c) Thành viên Ban quản trị không thực hiện các nhiệm vụ được giao trong quy chế hoạt động của nhà chung cư hoặc không tham gia các hoạt động của Ban quản trị trong 03 tháng liên tiếp hoặc không tham dự tối thiểu 30% tổng số các cuộc họp của Ban quản trị trong 01 năm; d) Thành viên Ban quản trị vi phạm quy chế hoạt động hoặc quy chế thu, chi tài chính của Ban quản trị; đ) Thành viên Ban quản trị bị xử phạt vi phạm hành chính do vi phạm quy định về quản lý, sử dụng nhà chung cư hoặc bị truy cứu trách nhiệm hình sự; e) Khi có đơn đề nghị bãi nhiệm có chữ ký của tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao. 3. Việc bầu thay thế thành viên Ban quản trị tòa nhà chung cư trong trường hợp bãi nhiệm, miễn nhiệm hoặc bị chết hoặc mất tích được thực hiện như sau: a) Trường hợp bầu thay thế Ban quản trị hoặc bầu thay thế Trưởng ban hoặc Phó ban quản trị thì phải tổ chức Hội nghị nhà chung cư bất thường để quyết định theo quy định tại Điều 16 của Quy chế này hoặc Hội nghị thường niên tại Điều 17 của Quy chế này để quyết định; trường hợp miễn nhiệm hoặc bãi nhiệm Phó ban quản trị là đại diện của chủ đầu tư thì chủ đầu tư cử đại diện khác thay thế mà không phải tổ chức Hội nghị nhà chung cư; trường hợp chủ đầu tư không cử thành viên khác thay thế mà trong Ban quản trị còn có Phó ban quản trị khác thì không phải tổ chức Hội nghị nhà chung cư để bầu thay thế. Trường hợp sau khi Ban quản trị được công nhận mà chủ đầu tư có văn bản xin thôi tham gia làm Phó ban quản trị mà trong Ban quản trị không có Phó ban khác thì tổ chức Hội nghị nhà chung cư theo quy định tại Điều 16 hoặc Điều 17 của Quy chế này để bầu một trong các chủ sở hữu của toà nhà chung cư làm Phó ban quản trị; chủ đầu tư vẫn phải chịu trách nhiệm về các nội dung liên quan đến kỹ thuật trong việc bảo hành, bảo trì nhà chung cư theo quy định của pháp luật về nhà ở; b) Trường hợp bầu thành viên Ban quản trị không thuộc đối tượng quy định tại điểm a khoản này thì Ban quản trị đề xuất người thay thế và gửi xin ý kiến bằng văn bản của các đại diện chủ sở hữu căn hộ; nếu được tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao hoặc có số lượng ít hơn theo quyết định đã được Hội nghị nhà chung cư lần đầu hoặc Hội nghị nhà chung cư trước đó thống nhất thì người được đề xuất được công nhận là thành viên Ban quản trị; trường hợp không có đủ số người đồng ý theo quy định tại điểm này thì phải họp Hội nghị nhà chung cư bất thường của tòa nhà để bầu người thay thế theo quy định tại Điều 16 của Quy chế này. Việc lấy ý kiến bầu thành viên Ban quản trị quy định tại điểm này cũng phải lập thành biên bản có chữ ký của các thành viên chủ trì việc lấy ý kiến. 4. Việc bầu thay thế thành viên Ban quản trị cụm nhà chung cư trong trường hợp bãi nhiệm, miễn nhiệm hoặc bị chết hoặc mất tích được thực hiện như sau: a) Trường hợp bầu thay thế Ban quản trị cụm nhà chung cư hoặc bầu thay thế Trưởng ban quản trị hoặc Phó ban quản trị thì phải tổ chức Hội nghị cụm nhà chung cư bất thường để quyết định theo quy định tại Điều 16 hoặc Hội nghị thường niên tại Điều 17 của Quy chế này; trường hợp miễn nhiệm hoặc bãi nhiệm Phó ban quản trị là đại diện của chủ đầu tư thì chủ đầu tư cử đại diện khác thay thế mà không phải tổ chức Hội nghị nhà chung cư; trường hợp chủ đầu tư không cử thành viên khác thay thế mà trong Ban quản trị còn có Phó ban quản trị khác thì không phải tổ chức Hội nghị nhà chung cư để bầu thay thế. Trường hợp sau khi Ban quản trị được công nhận mà chủ đầu tư có văn bản xin thôi tham gia làm Phó ban quản trị mà trong Ban quản trị không có Phó ban khác thì tổ chức Hội nghị nhà chung cư theo quy định tại Điều 16 hoặc Điều 17 của Quy chế này để bầu một trong các chủ sở hữu của cụm nhà chung cư làm Phó ban quản trị; chủ đầu tư vẫn phải chịu trách nhiệm về các nội dung liên quan đến kỹ thuật trong việc bảo hành, bảo trì nhà chung cư theo quy định của pháp luật về nhà ở; b) Trường hợp bầu thành viên Ban quản trị cụm nhà chung cư không thuộc đối tượng quy định tại điểm a khoản này thì Ban quản trị đề xuất người thay thế và gửi xin ý kiến bằng văn bản của các đại diện chủ sở hữu căn hộ của tòa nhà có thành viên Ban quản trị cần thay thế; nếu được tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao của tòa nhà này hoặc có số lượng ít hơn theo quyết định đã được Hội nghị nhà chung cư lần đầu hoặc Hội nghị nhà chung cư trước đó thống nhất thì người được đề xuất được công nhận là thành viên Ban quản trị cụm nhà chung cư; trường hợp không có đủ số người đồng ý theo quy định tại điểm này thì phải họp Hội nghị nhà chung cư của tòa nhà này để bầu người thay thế theo quy định tại Điều 16 hoặc Điều 17 của Quy chế này. Việc lấy ý kiến bầu thành viên Ban quản trị quy định tại điểm này cũng phải lập thành biên bản có chữ ký của các thành viên chủ trì việc lấy ý kiến. 5. Khi đề nghị bầu thành viên Ban quản trị mới thay thế thì Ban quản trị đã được công nhận vẫn tiếp tục hoạt động theo quy chế hoạt động đến khi cơ quan có thẩm quyền công nhận Ban quản trị mới; trường hợp bầu lại Ban quản trị do bị miễn nhiệm, bãi nhiệm thì Ban quản trị mới được Hội nghị nhà chung cư bầu phối hợp với Ủy ban nhân dân cấp xã nơi có nhà chung cư và đơn vị quản lý vận hành thực hiện các quyền hạn, trách nhiệm của Ban quản trị cho đến khi cơ quan có thẩm quyền công nhận Ban quản trị mới.", "dieu": "26"}, "17-VBHN-BXD-2026/quy-che/d16": {"heading": "Hội nghị nhà chung cư bất thường", "text": "Điều 16. Hội nghị nhà chung cư bất thường 1. Hội nghị nhà chung cư bất thường được tổ chức xem xét, quyết định một trong các vấn đề sau đây: a) Bầu thay thế Trưởng ban hoặc Phó ban quản trị trong trường hợp phải bầu các vị trí này theo quy định tại điểm a khoản 3 hoặc điểm a khoản 4 Điều 26 của Quy chế này; b) Miễn nhiệm hoặc bãi nhiệm toàn bộ các thành viên Ban quản trị và bầu Ban quản trị mới; c) Bầu thay thế thành viên Ban quản trị không phải là Trưởng ban, Phó ban do bị miễn nhiệm, bãi nhiệm hoặc bị chết, mất tích trong trường hợp đã tổ chức lấy ý kiến của các chủ sở hữu nhà chung cư nhưng không đủ số người đồng ý theo quy định tại điểm b khoản 3 Điều 26 của Quy chế này hoặc bầu thay thế thành viên Ban quản trị theo quy định tại điểm b khoản 4 Điều 26 của Quy chế này; d) Ban quản trị đề nghị thay thế đơn vị quản lý vận hành hoặc đề nghị điều chỉnh giá dịch vụ quản lý vận hành nhà chung cư; đ) Trường hợp phá dỡ để cải tạo, xây dựng lại nhà chung cư theo quy định của pháp luật về cải tạo, xây dựng lại nhà chung cư; e) Các nội dung thuộc diện Hội nghị nhà chung cư lần đầu quyết định và do chủ đầu tư tổ chức quy định tại khoản 4 Điều 15 của Quy chế này nhưng Hội nghị nhà chung cư đó chưa quyết định được; g) Báo cáo việc bảo trì, sửa chữa các hạng mục đột xuất không có trong kế hoạch bảo trì đã được Hội nghị nhà chung cư thông qua hoặc sửa đổi, điều chỉnh kế hoạch bảo trì đã được thông qua; h) Các trường hợp khác khi có đơn đề nghị của tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao. 2. Điều kiện về số lượng người tham dự cuộc họp Hội nghị tòa nhà chung cư bất thường được quy định như sau: a) Trường hợp họp Hội nghị nhà chung cư để quyết định một trong các vấn đề quy định tại các điểm a, b, c, d, e hoặc g khoản 1 Điều này thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao tham dự. Trường hợp quyết định việc phá dỡ để cải tạo, xây dựng lại nhà chung cư quy định tại điểm đ khoản 1 Điều này thì thực hiện theo quy định của pháp luật về cải tạo, xây dựng lại nhà chung cư; b) Trường hợp họp Hội nghị nhà chung cư theo đề nghị của các chủ sở hữu căn hộ quy định tại điểm h khoản 1 Điều này thì phải có tối thiểu 75% số người đã có đơn đề nghị tổ chức họp Hội nghị nhà chung cư bất thường tham dự. 3. Điều kiện về số lượng người tham dự cuộc họp Hội nghị cụm nhà chung cư bất thường được quy định như sau: a) Trường hợp họp Hội nghị cụm nhà chung cư để bầu Trưởng ban hoặc bầu mới toàn bộ Ban quản trị cụm nhà chung cư hoặc quyết định nội dung quy định tại điểm d khoản 1 Điều này thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao của cụm nhà chung cư tham dự. Trong trường hợp tại mỗi một tòa nhà trong cụm có một đơn vị quản lý vận hành riêng mà có tòa nhà đề xuất thay đổi đơn vị quản lý vận hành hoặc đề nghị điều chỉnh giá dịch vụ quản lý vận hành của tòa nhà thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao của tòa nhà đó tham dự và chỉ tổ chức Hội nghị nhà chung cư bất thường của tòa nhà này để quyết định; b) Trường hợp họp Hội nghị cụm nhà chung cư để bầu Phó ban quản trị không phải là đại diện của chủ đầu tư hoặc là đại diện của chủ đầu tư nhưng chủ đầu tư không cử người tham gia hoặc các thành viên Ban quản trị là đại diện của tòa nhà trong cụm nhà chung cư thì chỉ tổ chức Hội nghị nhà chung cư bất thường của tòa nhà này để bầu thành viên khác thay thế; hội nghị của tòa nhà được tổ chức họp để bầu người thay thế khi có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao của tòa nhà đó tham dự; c) Trường hợp tổ chức Hội nghị cụm nhà chung cư theo đề nghị của các chủ sở hữu căn hộ quy định tại điểm h khoản 1 Điều này thì phải có tối thiểu 75% số người đã có đơn đề nghị tổ chức họp Hội nghị cụm nhà chung cư bất thường tham dự. 4. Ban quản trị có trách nhiệm chuẩn bị nội dung, thông báo thời gian, địa điểm và tổ chức họp hội nghị chính thức cho các chủ sở hữu, người sử dụng nhà chung cư đối với các nội dung quy định tại khoản 1 Điều này, trừ trường hợp quy định tại điểm b khoản 1 Điều này. Thời gian tổ chức bầu Ban quản trị hoặc thành viên Ban quản trị trong trường hợp bị miễn nhiệm hoặc bãi nhiệm tối đa không quá 60 ngày, kể từ ngày xuất hiện trường hợp bị miễn nhiệm hoặc bãi nhiệm. 5. Ủy ban nhân dân cấp xã nơi có nhà chung cư có trách nhiệm tổ chức Hội nghị tòa nhà chung cư, cụm nhà chung cư bất thường trong các trường hợp sau đây: a) Trường hợp quy định tại điểm b khoản 1 Điều này và có đơn của đại diện chủ sở hữu căn hộ đã nhận bàn giao đề nghị tổ chức Hội nghị nhà chung cư bất thường; b) Trường hợp đã tổ chức Hội nghị nhà chung cư để quyết định một trong các nội dung quy định tại điểm a, c, d, e và điểm g khoản 1 Điều này nhưng không có đủ số người tham dự theo quy định tại điểm a khoản 2 hoặc điểm a khoản 3 Điều này và có văn bản đề nghị của Ban quản trị; c) Trường hợp thuộc diện quy định tại điểm a, c, d, e và điểm g khoản 1 Điều này nhưng Ban quản trị không tổ chức Hội nghị nhà chung cư hoặc cụm nhà chung cư và có đơn của tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao đề nghị tổ chức Hội nghị nhà chung cư bất thường; d) Khi Ban quản trị hết nhiệm kỳ hoạt động mà chưa lựa chọn được Ban quản trị nhiệm kỳ mới và có văn bản đề nghị của Ban quản trị; trường hợp Ban quản trị không có đề nghị thì phải có đơn của đại diện chủ sở hữu nhà chung cư. 6. Trong thời hạn 30 ngày, kể từ ngày nhận được văn bản đề nghị của Ban quản trị hoặc nhận được đơn của đại diện chủ sở hữu căn hộ quy định tại khoản 5 Điều này, Ủy ban nhân dân cấp xã có trách nhiệm tổ chức Hội nghị nhà chung cư bất thường. Kết quả của Hội nghị nhà chung cư bất thường do Ủy ban nhân dân cấp xã tổ chức có giá trị áp dụng đối với các chủ sở hữu, người đang sử dụng nhà chung cư như Hội nghị nhà chung cư bất thường do Ban quản trị tổ chức quy định tại Điều này.", "dieu": "16"}, "17-VBHN-BXD-2026/quy-che/d19": {"heading": "Ban quản trị nhà chung cư", "text": "Điều 19. Ban quản trị nhà chung cư 1. Đối với nhà chung cư có nhiều chủ sở hữu mà thuộc diện phải thành lập Ban quản trị theo quy định tại khoản 2 Điều 146 của Luật Nhà ở thì Ban quản trị có con dấu và tài khoản để hoạt động theo quy chế hoạt động của Ban quản trị được Hội nghị nhà chung cư thông qua. 2. Đối với nhà chung cư có một chủ sở hữu hoặc nhà chung cư có nhiều chủ sở hữu mà có dưới 20 căn hộ thì Hội nghị nhà chung cư quyết định thành lập Ban quản trị hoặc không thành lập Ban quản trị. Trường hợp thành lập Ban quản trị thì nguyên tắc hoạt động của Ban quản trị được quy định như sau: a) Trường hợp nhà chung cư có một chủ sở hữu thì Ban quản trị hoạt động theo mô hình tự quản theo quy chế hoạt động do Hội nghị nhà chung cư quyết định; Ban quản trị thực hiện các quyền, trách nhiệm quy định tại khoản 2 Điều 147 và khoản 2 Điều 148 của Luật Nhà ở; b) Trường hợp nhà chung cư có nhiều chủ sở hữu thì nguyên tắc hoạt động của Ban quản trị được thực hiện theo quy định tại khoản 1 Điều này. 3. Ban quản trị quy định tại khoản 1, khoản 2 Điều này có nhiệm kỳ hoạt động 03 năm, kể từ ngày có quyết định công nhận của 29Ủy ban nhân dân cấp xã và được bầu lại tại Hội nghị nhà chung cư thường niên của năm cuối nhiệm kỳ, trừ trường hợp phải họp Hội nghị nhà chung cư bất thường để bầu thay thế Ban quản trị do bị miễn nhiệm hoặc bãi nhiệm khi chưa hết nhiệm kỳ theo quy định tại Điều 26 của Quy chế này. 4. Trường hợp sau khi được cơ quan có thẩm quyền công nhận mà có thành viên Ban quản trị thuộc diện bị miễn nhiệm hoặc bãi nhiệm hoặc bị chết, mất tích thì giải quyết như sau: a) Đối với Ban quản trị tòa nhà chung cư nếu thiếu 01 thành viên thì Ban quản trị vẫn tiếp tục hoạt động cho đến khi bầu được thành viên Ban quản trị mới và được công nhận theo quy định tại Điều 23 của Quy chế này; nếu thiếu từ 02 thành viên trở lên thì thành viên Ban quản trị còn lại phải tổ chức họp Hội nghị nhà chung cư theo quy định tại Điều 16 hoặc Điều 17 của Quy chế này để bầu bổ sung các thành viên còn thiếu; b) Đối với Ban quản trị cụm nhà chung cư nếu thiếu 02 thành viên thì Ban quản trị vẫn tiếp tục hoạt động cho đến khi bầu được thành viên Ban quản trị mới và được công nhận theo quy định tại Điều 23 của Quy chế này; nếu thiếu từ 03 thành viên trở lên thì các thành viên Ban quản trị còn lại phải tổ chức họp Hội nghị nhà chung cư theo quy định tại Điều 16 hoặc Điều 17 của Quy chế này để bầu bổ sung các thành viên còn thiếu; c) Trường hợp thiếu thành viên quy định tại điểm a hoặc điểm b khoản này là Trưởng ban thì Phó ban quản trị nhà chung cư đó thực hiện nhiệm vụ của Trưởng ban cho đến khi bầu được Trưởng ban quản trị mới; trường hợp Ban quản trị có 02 Phó ban thì phải thống nhất cử 01 Phó ban làm nhiệm vụ của Trưởng ban; d) Đối với trường hợp Ban quản trị của tòa nhà chung cư thiếu 02 thành viên hoặc Ban quản trị cụm nhà chung cư thiếu từ 03 thành viên trở lên mà trong thời gian chưa bầu bổ sung và chưa được cơ quan có thẩm quyền công nhận thì các thành viên còn lại của Ban quản trị phải có văn bản báo cáo Ủy ban nhân dân cấp xã nơi có nhà chung cư để phối hợp thực hiện các công việc của Ban quản trị. Trường hợp thiếu Phó ban quản trị do chủ đầu tư cử tham gia thì Ban quản trị có văn bản đề nghị chủ đầu tư cử thành viên khác thay thế; nếu chủ đầu tư không cử thành viên thay thế thì Ban quản trị tổ chức bầu bổ sung thành viên khác theo quy định tại điểm a khoản 3 hoặc điểm a khoản 4 Điều 26 của Quy chế này. 5. Các quyết định của Ban quản trị nếu vượt quá quyền hạn quy định tại Điều 147 của Luật Nhà ở thì không có giá trị pháp lý; trường hợp gây thiệt hại đến quyền và lợi ích hợp pháp của các tổ chức, cá nhân thì các thành viên Ban quản trị phải chịu trách nhiệm bồi thường theo quy định của pháp luật. 6. Ban quản trị chịu trách nhiệm nhận bàn giao hồ sơ nhà chung cư, tiếp nhận quỹ bảo trì phần sở hữu chung của nhà chung cư từ chủ đầu tư dự án theo quy định của Luật Nhà ở và thực hiện các công việc theo phân công tại quy chế hoạt động của Ban quản trị đã được Hội nghị nhà chung cư thông qua; trường hợp không nhận bàn giao kinh phí bảo trì theo quy định thì Ban quản trị phải chịu trách nhiệm về các vấn đề có liên quan xảy ra khi không nhận bàn giao kinh phí bảo trì này theo quy định của pháp luật. 7. Ban quản trị có kinh phí hoạt động do chủ sở hữu, người sử dụng nhà chung cư đóng góp hàng năm trên cơ sở quyết định của Hội nghị nhà chung cư; kinh phí này được ghi rõ trong quy chế hoạt động của Ban quản trị và được quản lý thông qua một tài khoản hoạt động riêng của Ban quản trị; Ban quản trị phải sử dụng kinh phí hoạt động đúng mục đích, không được dùng để kinh doanh và phải báo cáo việc thu, chi tại cuộc họp Hội nghị nhà chung cư thường niên. 8. Ban quản trị khi hết nhiệm kỳ phải có trách nhiệm bàn giao hồ sơ nhà chung cư đang lưu giữ, các hồ sơ, giấy tờ liên quan đến việc thu, chi các kinh phí hoạt động, kinh phí bảo trì, bàn giao tài khoản đang được giao quản lý, con dấu và các hồ sơ, giấy tờ có liên quan sang cho Ban quản trị mới trong thời hạn tối đa 15 ngày, kể từ ngày Ban quản trị mới được cơ quan có thẩm quyền công nhận và có văn bản đề nghị bàn giao; trường hợp Ban quản trị bị bãi nhiệm, miễn nhiệm thì vẫn phải tiếp tục thực hiện các quyền và trách nhiệm với đơn vị quản lý vận hành cho đến khi bầu được Ban quản trị mới. 9. Mức thù lao của các thành viên Ban quản trị do các chủ sở hữu, người sử dụng nhà chung cư đóng góp theo quyết định của Hội nghị nhà chung cư. Hội nghị nhà chung cư có thể tham khảo mức lương tối thiểu vùng theo quy định của pháp luật để xem xét, quyết định về mức thù lao tương xứng với trách nhiệm, nghĩa vụ của các thành viên Ban quản trị trên cơ sở điều kiện cụ thể của từng tòa nhà, cụm nhà chung cư và từng địa phương, trừ trường hợp thành viên Ban quản trị từ chối nhận thù lao. Trường hợp nhà chung cư có đơn vị quản lý vận hành theo quy định của Luật Nhà ở và Quy chế này thì chủ sở hữu, người đang sử dụng nhà chung cư có trách nhiệm đóng thù lao qua đơn vị này để chi trả cho các thành viên Ban quản trị; khoản tiền này không phải hạch toán vào hoạt động kinh doanh của đơn vị quản lý vận hành. Nếu nhà chung cư không có đơn vị quản lý vận hành theo quy định của Luật Nhà ở và Quy chế này thì thù lao này do Ban quản trị thu và chi trả cho từng thành viên.", "dieu": "19"}, "21-VBHN-BXD-2026/d88": {"heading": "Trình tự, thủ tục cưỡng chế bàn giao kinh phí bảo trì phần sở hữu chung từ tài khoản chung của chủ đầu tư", "text": "Điều 88. Trình tự, thủ tục cưỡng chế bàn giao kinh phí bảo trì phần sở hữu chung từ tài khoản chung của chủ đầu tư 1. Trong thời hạn tối đa 15 ngày, kể từ khi nhận được văn bản của Ban quản trị nhà chung cư gửi Ủy ban nhân dân cấp huyện nơi có nhà chung cư yêu cầu chủ đầu tư bàn giao kinh phí bảo trì, Ủy ban nhân dân cấp huyện phải kiểm tra và có văn bản yêu cầu chủ đầu tư bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư. Trường hợp nhà chung cư thuộc diện quy định tại khoản 4 Điều 155 của Luật Nhà ở thì phải xác định rõ phần kinh phí bảo trì mà chủ đầu tư phải nộp cho Ban quản trị nhà chung cư và phần kinh phí bảo trì mà chủ đầu tư được giữ lại theo thỏa thuận trong hợp đồng mua bán, thuê mua căn hộ, phần diện tích khác trong nhà chung cư. 2. Hết thời hạn quy định tại khoản 3 Điều 154 của Luật Nhà ở mà chủ đầu tư không bàn giao kinh phí bảo trì theo yêu cầu của Ủy ban nhân dân cấp huyện thì Ban quản trị nhà chung cư có văn bản đề nghị Ủy ban nhân dân cấp huyện ban hành quyết định cưỡng chế thu hồi kinh phí bảo trì để bàn giao cho Ban quản trị nhà chung cư; quyết định cưỡng chế này được gửi đến chủ đầu tư, cơ quan quản lý nhà ở cấp tỉnh nơi có nhà chung cư và tổ chức tín dụng hoặc chi nhánh ngân hàng nước ngoài nơi chủ đầu tư đang mở tài khoản quản lý kinh phí bảo trì này (gọi chung là tổ chức tín dụng). 3. Trong thời hạn tối đa 15 ngày, kể từ ngày nhận được quyết định cưỡng chế của Ủy ban nhân dân cấp huyện, tổ chức tín dụng đang quản lý tài khoản chung của chủ đầu tư có trách nhiệm kiểm tra, nếu trong tài khoản còn đủ số tiền thì chuyển toàn bộ kinh phí này sang tài khoản do Ban quản trị nhà chung cư lập để quản lý, sử dụng theo quy định; trường hợp tài khoản chung không còn tiền hoặc còn tiền nhưng không đủ để bàn giao cho Ban quản trị nhà chung cư thì tổ chức tín dụng chuyển số tiền này vào tài khoản do Ban quản trị nhà chung cư lập và có văn bản thông báo lại cho Ủy ban nhân dân cấp huyện để thực hiện cưỡng chế bàn giao số tiền còn thiếu theo quy định tại Điều 90, Điều 91 của Nghị định này. 4. Sau khi chuyển kinh phí bảo trì sang tài khoản của Ban quản trị nhà chung cư, tổ chức tín dụng phải có văn bản thông báo cho Ủy ban nhân dân cấp huyện, Ban quản trị nhà chung cư, cơ quan quản lý nhà ở cấp tỉnh và chủ đầu tư biết, trong đó nêu rõ số tiền chuyển giao, thời điểm chuyển giao, số tài khoản chuyển giao.", "dieu": "88"}, "21-VBHN-BXD-2026/d91": {"heading": "Trình tự, thủ tục cưỡng chế kê biên, bán đấu giá tài sản của chủ đầu tư", "text": "Điều 91. Trình tự, thủ tục cưỡng chế kê biên, bán đấu giá tài sản của chủ đầu tư 1. Trường hợp đã thực hiện cưỡng chế chủ đầu tư bàn giao kinh phí bảo trì phần sở hữu chung theo quy định tại Điều 88 hoặc Điều 90 của Nghị định này mà Ban quản trị vẫn chưa nhận đủ số tiền theo quy định tại Điều 153 của Luật Nhà ở thì Ban quản trị nhà chung cư có văn bản đề nghị Ủy ban nhân dân cấp huyện cưỡng chế kê biên, bán đấu giá tài sản của chủ đầu tư để thu hồi kinh phí bảo trì. 2. Việc cưỡng chế bàn giao kinh phí bảo trì hoặc kê biên tài sản của chủ đầu tư để bán đấu giá được thực hiện theo quy định của pháp luật về cưỡng chế thi hành quyết định xử phạt vi phạm hành chính, pháp luật về kê biên tài sản; Ủy ban nhân dân cấp huyện chỉ thực hiện kê biên diện tích nhà, đất hoặc tài sản khác có giá trị tương đương với số kinh phí bảo trì phải thu hồi để bàn giao cho Ban quản trị nhà chung cư và chi phí cho việc tổ chức thi hành cưỡng chế, bán đấu giá tài sản này. Việc bán đấu giá tài sản để thu hồi kinh phí bảo trì bàn giao lại cho Ban quản trị nhà chung cư được thực hiện theo quy định của pháp luật về bán đấu giá tài sản. Trường hợp số tiền bán đấu giá tài sản nhiều hơn số kinh phí phải bàn giao và chi phí cho việc thực hiện bán đấu giá tài sản thì trong thời hạn tối đa 30 ngày, Ủy ban nhân dân cấp huyện có trách nhiệm phối hợp với tổ chức bán đấu giá làm thủ tục trả lại phần giá trị chênh lệch cho chủ đầu tư có tài sản bị kê biên bán đấu giá. 26Điều 41, Điều 42 Nghị định số 54/2026/NĐ-CP sửa đổi, bổ sung một số điều của các Nghị định trong lĩnh vực nhà ở, kinh doanh bất động sản, có hiệu lực thi hành kể từ ngày 09 tháng 02 năm 2026 quy định như sau: “Điều 41. Điều khoản thi hành 1. Nghị định này có hiệu lực thi hành từ ngày 09 tháng 02 năm 2026. … 2. Về việc áp dụng quy định tại Nghị định số 144/2025/NĐ-CP quy định về phân quyền, phân cấp trong lĩnh vực quản lý nhà nước của Bộ Xây dựng: a) Trình tự, thủ tục, thẩm quyền chuyển đổi công năng nhà ở quy định tại Nghị định số 95/2024/NĐ-CP tiếp tục được thực hiện theo quy định tại Nghị định số 144/2025/NĐ-CP và quy định tại Điều 22 của Nghị định này; … 4. Cơ quan có thẩm quyền giải quyết thủ tục hành chính quy định tại Nghị định số 95/2024/NĐ- CP, Nghị định số 96/2024/NĐ-CP, Nghị định số 98/2024/NĐ-CP, Nghị định số 100/2024/NĐ- CP và Nghị định này có trách nhiệm cập nhật văn bản giải quyết thủ tục hành chính lên hệ thống thông tin về nhà ở và thị trường bất động sản theo quy định của pháp luật về kinh doanh bất động sản. 5. Trường hợp các văn bản quy phạm pháp luật viện dẫn tại Nghị định này được sửa đổi, bổ sung hoặc thay thế thì áp dụng quy định tại văn bản sửa đổi, bổ sung hoặc thay thế đó.", "dieu": "91"}, "17-VBHN-BXD-2026/quy-che/d21": {"heading": "Số lượng, thành phần Ban quản trị", "text": "Điều 21. Số lượng, thành phần Ban quản trị 1. Số lượng thành viên Ban quản trị tòa nhà chung cư, cụm nhà chung cư do Hội nghị nhà chung cư quyết định theo nguyên tắc sau đây: a) Đối với tòa nhà chỉ có một khối nhà (block) độc lập thì có tối thiểu 03 thành viên Ban quản trị; trường hợp tòa nhà có nhiều khối nhà (block) quy định tại khoản 2 Điều 3 của Quy chế này thì mỗi khối nhà (block) có tối thiểu 01 thành viên Ban quản trị; b) Đối với một cụm nhà chung cư thì có số lượng tối thiểu 06 thành viên Ban quản trị. 2. Thành phần Ban quản trị tòa nhà chung cư, cụm nhà chung cư có nhiều chủ sở hữu được quy định như sau: a) Ban quản trị của tòa nhà chung cư bao gồm 01 Trưởng ban, 01 hoặc 02 Phó ban và các thành viên khác đang sinh sống trong nhà chung cư đó do Hội nghị nhà chung cư quyết định. Trường hợp chủ đầu tư còn sở hữu diện tích trong nhà chung cư thì đại diện do chủ đầu tư cử có thể được Hội nghị nhà chung cư bầu làm Trưởng ban quản trị; nếu không được bầu làm Trưởng ban thì được cử làm Phó ban quản trị mà không phải bầu thành viên này; trường hợp chủ đầu tư không cử đại diện tham gia Ban quản trị thì Hội nghị nhà chung cư bầu một trong các chủ sở hữu của toà nhà chung cư để làm Phó ban quản trị thay thế cho Phó ban quản trị của chủ đầu tư.b) Ban quản trị của cụm nhà chung cư bao gồm 01 Trưởng ban; mỗi tòa nhà trong cụm tổ chức họp để cử 01 hoặc 02 đại diện làm Phó ban và các thành viên khác do Hội nghị cụm nhà chung cư quyết định. Trường hợp chủ đầu tư còn sở hữu diện tích trong cụm nhà chung cư thì đại diện của chủ đầu tư có thể được Hội nghị cụm nhà chung cư bầu làm Trưởng ban quản trị cụm nhà chung cư. Mỗi tòa nhà trong cụm nhà chung cư mà chủ đầu tư còn sở hữu diện tích thì chủ đầu tư được cử đại diện tham gia làm Phó ban quản trị của cụm, trừ trường hợp đại diện chủ đầu tư của tòa nhà đó được bầu làm Trưởng ban quản trị của cụm nhà chung cư.3. Thành phần Ban quản trị tòa nhà, cụm nhà chung cư có một chủ sở hữu bao gồm 01 Trưởng ban, 01 hoặc 02 Phó ban và các thành viên khác do Hội nghị tòa nhà, cụm nhà chung cư quyết định.", "dieu": "21"}, "17-VBHN-BXD-2026/quy-che/d44": {"heading": "Giải quyết tranh chấp", "text": "Điều 44. Giải quyết tranh chấp 1. Các tranh chấp về kinh phí quản lý vận hành nhà chung cư, về việc bàn giao, quản lý, sử dụng kinh phí bảo trì phần sở hữu chung của nhà chung cư do Ủy ban nhân dân cấp xã nơi có nhà chung cư đó hoặc Tòa án hoặc trọng tài thương mại giải quyết theo quy định của pháp luật. 2. Các tranh chấp giữa các thành viên Ban quản trị được giải quyết theo quy chế hoạt động của Ban quản trị đã được Hội nghị nhà chung cư thông qua. Trường hợp thành viên Ban quản trị hoặc Ban quản trị bị bãi nhiệm, miễn nhiệm, thay thế mà không bàn giao con dấu thì Ban quản trị được thành lập mới có quyền yêu cầu cơ quan có thẩm quyền về cấp, đăng ký con dấu thực hiện việc thu hồi, bàn giao hoặc hủy con dấu để đăng ký, cấp con dấu mới theo quy định về cấp, đăng ký và quản lý con dấu cho Ban quản trị mới thành lập. Trường hợp thành viên Ban quản trị hoặc Ban quản trị bị bãi nhiệm, miễn nhiệm, thay thế mà không bàn giao tài khoản quản lý kinh phí bảo trì phần sở hữu chung của nhà chung cư, tài khoản quản lý hoạt động của Ban quản trị thì Ban quản trị được thành lập mới có quyền yêu cầu tổ chức tín dụng đang quản lý các tài khoản này phong tỏa tài khoản, chấm dứt thực hiện các giao dịch có liên quan đến Ban quản trị bị bãi nhiệm, miễn nhiệm, thay thế và thực hiện lập, bàn giao tài khoản này cho Ban quản trị được thành lập mới theo quy định của Quy chế này và pháp luật có liên quan. Tổ chức tín dụng đang quản lý tài khoản này phải bàn giao cho Ban quản trị mới theo quy định của Quy chế này. 3. Các tranh chấp giữa Ban quản trị với chủ sở hữu, người sử dụng nhà chung cư về việc bầu, miễn nhiệm, bãi nhiệm, thay thế thành viên Ban quản trị hoặc các vấn đề khác liên quan đến công tác quản lý vận hành nhà chung cư được giải quyết trên cơ sở thương lượng; trường hợp không thương lượng được thì đề nghị tổ chức họp Hội nghị nhà chung cư để giải quyết. 4. Các tranh chấp về hợp đồng dịch vụ quản lý vận hành, hợp đồng bảo trì, hợp đồng dịch vụ quản lý vận hành nhà chung cư giữa đơn vị cung cấp dịch vụ và đơn vị quản lý vận hành được giải quyết theo thỏa thuận giữa các bên; trường hợp không thỏa thuận được thì yêu cầu Tòa án hoặc trọng tài thương mại giải quyết theo quy định của pháp luật.", "dieu": "44"}, "339-2026-ND-CP/d61": {"heading": "Vi phạm quy định của thành viên Ban quản trị, Ban quản trị nhà chung cư về quản lý, sử dụng nhà chung cư", "text": "Điều 61. Vi phạm quy định của thành viên Ban quản trị, Ban quản trị nhà chung cư về quản lý, sử dụng nhà chung cư 1. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với thành viên Ban quản trị không có giấy chứng nhận hoàn thành khóa đào tạo, bồi dưỡng kiến thức chuyên môn, nghiệp vụ quản lý vận hành nhà chung cư theo quy định. 2. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với Ban quản trị nhà chung cư có một trong các hành vi sau đây: a) Không bàn giao lại hồ sơ, giấy tờ đang quản lý cho Ban quản trị mới theo quy định; b) Không nhận bàn giao hồ sơ nhà chung cư, không tiếp nhận quỹ bảo trì phần sở hữu chung của nhà chung cư từ chủ đầu tư theo quy định của Luật Nhà ở trong trường hợp chủ đầu tư bàn giao theo đúng quy định của pháp luật về nhà ở; c) Không cung cấp hồ sơ nhà chung cư cho đơn vị quản lý, vận hành theo quy định; d) Không ký kết hợp đồng cung cấp dịch vụ quản lý vận hành nhà chung cư với chủ đầu tư dự án đầu tư xây dựng nhà ở hoặc đơn vị có chức năng quản lý vận hành nhà chung cư đã được Hội nghị nhà chung cư lựa chọn; đ) Không báo cáo Hội nghị nhà chung cư theo quy định về việc thu, chi kinh phí bảo trì phần sở hữu chung nhà chung cư. 3. Phạt tiền từ 50.000.000 đồng đến 60.000.000 đồng đối với ban quản trị nhà chung cư có một trong các hành vi sau đây: a) Quản lý, sử dụng kinh phí bảo trì không đúng quy định; b) Tự ý chuyển đổi công năng, mục đích sử dụng phần sở hữu chung, sử dụng chung của nhà chung cư; c) Quyết định mức giá dịch vụ quản lý, vận hành nhà chung cư mà không thông qua Hội nghị nhà chung cư; d) Thực hiện không đúng quy chế hoạt động hoặc quy chế thu, chi tài chính đã được Hội nghị nhà chung cư thông qua; đ) Không lập tài khoản để quản lý, sử dụng kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định; e) Không công khai việc sử dụng kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định. 4. Biện pháp khắc phục hậu quả: a) Buộc bàn giao lại hồ sơ, giấy tờ đang quản lý cho Ban quản trị mới theo quy định đối với hành vi quy định tại điểm a khoản 2 Điều này; b) Buộc tiếp nhận kinh phí bảo trì phần sở hữu chung nhà chung cư, hồ sơ nhà chung cư theo quy định đối với hành vi quy định tại điểm b khoản 2 Điều này; c) Buộc cung cấp hồ sơ nhà chung cư cho đơn vị quản lý, vận hành theo quy định đối với hành vi quy định tại điểm c khoản 2 Điều này; d) Buộc lựa chọn, ký hợp đồng với chủ đầu tư dự án đầu tư xây dựng nhà ở hoặc đơn vị có chức năng quản lý, vận hành nhà chung cư đã được Hội nghị nhà chung cư lựa chọn theo quy định đối với hành vi quy định tại điểm d khoản 2 Điều này; đ) Buộc báo cáo Hội nghị nhà chung cư gần nhất về việc thu, chi đối với hành vi quy định tại điểm đ khoản 2 Điều này; e) Buộc quản lý, sử dụng kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định đối với hành vi quy định tại điểm a khoản 3 Điều này; g) Buộc khôi phục tình trạng ban đầu và sử dụng đúng công năng, mục đích quy định đối với hành vi quy định tại điểm b khoản 3 Điều này; h) Buộc hủy bỏ giá dịch vụ quản lý, vận hành nhà chung cư và thực hiện theo giá đã được Hội nghị nhà chung cư thông qua đối với hành vi quy định tại điểm c khoản 3 Điều này; i) Buộc bồi hoàn số tiền sử dụng không đúng quy định đối với hành vi quy định tại điểm d khoản 3 Điều này; k) Buộc lập tài khoản kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định đối với hành vi quy định tại điểm đ khoản 3 Điều này; l) Buộc công khai việc sử dụng kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định đối với hành vi quy định tại điểm e khoản 3 Điều này.", "dieu": "61"}, "27-2023-QH15/d151": {"heading": "Giá dịch vụ quản lý vận hành nhà chung cư", "text": "Điều 151. Giá dịch vụ quản lý vận hành nhà chung cư 1. Việc xác định giá dịch vụ quản lý vận hành nhà chung cư phải bảo đảm công khai, minh bạch và căn cứ vào nội dung công việc cần quản lý vận hành và các dịch vụ sử dụng đối với từng loại nhà chung cư. 2. Giá dịch vụ quản lý vận hành nhà chung cư không bao gồm kinh phí mua bảo hiểm cháy, nổ, kinh phí bảo trì, chi phí trông giữ xe, chi phí sử dụng nhiên liệu, năng lượng, nước sinh hoạt, dịch vụ truyền hình, thông tin liên lạc, thù lao cho Ban quản trị nhà chung cư và chi phí dịch vụ khác phục vụ cho việc sử dụng riêng của chủ sở hữu, người sử dụng nhà chung cư. Giá dịch vụ quản lý vận hành nhà chung cư được xác định bằng tiền Việt Nam và tính trên mỗi mét vuông diện tích sử dụng căn hộ hoặc phần diện tích khác trong nhà chung cư. 3. Đối với nhà chung cư có nhiều chủ sở hữu, giá dịch vụ quản lý vận hành nhà chung cư được quy định như sau: a) Trường hợp chưa tổ chức được Hội nghị nhà chung cư lần đầu thì giá dịch vụ quản lý vận hành nhà chung cư thực hiện theo thỏa thuận trong hợp đồng mua bán, thuê mua nhà ở; b) Trường hợp đã tổ chức được Hội nghị nhà chung cư thì giá dịch vụ quản lý vận hành nhà chung cư do đơn vị quản lý vận hành và Hội nghị nhà chung cư thỏa thuận, thống nhất quyết định. 4. Đối với nhà chung cư có một chủ sở hữu, giá dịch vụ quản lý vận hành nhà chung cư được thực hiện theo thỏa thuận giữa chủ sở hữu và người sử dụng nhà chung cư trong hợp đồng thuê nhà; trường hợp nhà chung cư thuộc tài sản công thì giá dịch vụ quản lý vận hành nhà chung cư được thực hiện theo quy định tại khoản 7 Điều này. 5. Đối với nhà chung cư có mục đích sử dụng hỗn hợp, giá dịch vụ quản lý vận hành nhà chung cư áp dụng đối với phần diện tích kinh doanh dịch vụ, phần diện tích thuộc sở hữu riêng dùng làm chỗ để xe ô tô được xác định theo nguyên tắc sau đây: a) Giá dịch vụ quản lý vận hành áp dụng đối với phần diện tích kinh doanh dịch vụ do các bên thỏa thuận trên cơ sở tình hình thực tế của hoạt động trong khu kinh doanh và của từng vị trí nhà chung cư; b) Giá dịch vụ quản lý vận hành áp dụng đối với phần diện tích thuộc sở hữu riêng dùng làm chỗ để xe ô tô do các bên thỏa thuận và có thể được tính thấp hơn giá dịch vụ quản lý vận hành áp dụng đối với căn hộ trong cùng một nhà chung cư. 6. Đối với nhà chung cư chỉ có mục đích để ở, giá dịch vụ quản lý vận hành nhà chung cư áp dụng đối với phần diện tích thuộc sở hữu riêng dùng làm chỗ để xe ô tô thực hiện theo quy định tại điểm b khoản 5 Điều này. 7. Ủy ban nhân dân cấp tỉnh có trách nhiệm ban hành khung giá dịch vụ quản lý vận hành nhà chung cư để áp dụng cho các trường hợp sau đây: a) Thu kinh phí quản lý vận hành nhà chung cư thuộc tài sản công trên địa bàn; b) Làm cơ sở để các bên tham khảo khi thỏa thuận giá dịch vụ quản lý vận hành đối với nhà ở không thuộc tài sản công hoặc trong trường hợp có tranh chấp về giá dịch vụ giữa đơn vị quản lý vận hành nhà chung cư với chủ sở hữu, người sử dụng nhà chung
