:root{
  --bg:#F8FAFC; --fg:#020617; --card:#FFFFFF; --muted:#E8ECF1; --muted-fg:#475569; --border:#CBD5E1;
  --primary:#0F172A; --accent:#0369A1; --accent-soft:#E0F2FE; --line:#94A3B8;
  --q-bg:#0F172A; --q-fg:#FFFFFF;
  --info-bg:#EFF6FF; --info-bd:#93C5FD;
  --warn-bg:#FFFBEB; --warn-bd:#F59E0B; --warn-fg:#92400E;
  --end-bg:#F0FDF4; --end-bd:#22C55E; --end-fg:#166534;
  --chip-bg:#E0F2FE; --chip-fg:#075985; --chip-bd:#7DD3FC;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1120; --fg:#E2E8F0; --card:#111827; --muted:#1F2937; --muted-fg:#94A3B8; --border:#334155;
    --primary:#E2E8F0; --accent:#38BDF8; --accent-soft:#0C4A6E; --line:#475569;
    --q-bg:#1E293B; --q-fg:#F8FAFC;
    --info-bg:#0F1E36; --info-bd:#1D4ED8;
    --warn-bg:#2A1E05; --warn-bd:#B45309; --warn-fg:#FCD34D;
    --end-bg:#06251A; --end-bd:#15803D; --end-fg:#86EFAC;
    --chip-bg:#0C4A6E; --chip-fg:#E0F2FE; --chip-bd:#0369A1;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
strong,b{font-weight:600}
body{font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-inner{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.top h1{font-size:1.15rem;margin:0;font-weight:600}
.top p.sub{margin:0;color:var(--muted-fg);font-size:.9rem;flex:1 1 320px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.9rem;min-height:40px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.crumbs{max-width:1400px;margin:0 auto;padding:0 20px 10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.88rem;color:var(--muted-fg)}
.crumbs button{border:0;background:none;padding:2px 4px;border-radius:6px;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.crumbs .sep{opacity:.6}

main{padding:28px 12px 60px;overflow-x:auto}
.canvas{display:flex;flex-direction:column;align-items:center;min-width:max-content;margin:0 auto}
.canvas.all .card{width:300px;padding:12px 14px}
.canvas.all .card li{font-size:.88rem}
.goto-ref{border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;max-width:300px;font-size:.88rem;text-align:left}
.goto-ref:hover{border-style:solid}

/* chuỗi nút theo chiều dọc */
.chain{display:flex;flex-direction:column;align-items:center}
.vline{width:2px;height:26px;background:var(--line);position:relative;flex:none}
.vline.arrow::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top:8px solid var(--line);border-bottom:0}

/* thẻ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;width:min(420px,calc(100vw - 40px));scroll-margin:140px}
.card h3{margin:0 0 6px;font-size:1rem;line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.card ul{margin:0;padding-left:18px}
.card li{margin:4px 0;font-size:.95rem}
.card .ico{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:.8rem;font-weight:600;margin-top:1px}
.card.step .ico{background:var(--muted);color:var(--fg)}
.card.info{background:var(--info-bg);border-color:var(--info-bd)}
.card.info .ico{background:var(--accent);color:#fff}
.card.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.card.warn .ico{background:var(--warn-bd);color:#fff}
.card.end{background:var(--end-bg);border-color:var(--end-bd)}
.card.end .ico{background:var(--end-bd);color:#fff}
.card.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 40%,transparent)}100%{box-shadow:var(--shadow)}}
.jump{margin-top:10px;border:1px dashed var(--warn-bd);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--warn-fg);font-weight:600;font-size:.9rem}

/* câu hỏi: hình thoi */
.q{position:relative;display:grid;place-items:center;text-align:center;scroll-margin:140px}
.q .diamond{position:relative;width:260px;height:150px;display:grid;place-items:center;padding:0 52px}
.q .diamond::before{content:"";position:absolute;inset:0;background:var(--line);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.q .diamond::after{content:"";position:absolute;inset:2px 3.5px;background:var(--q-bg);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.q .diamond span{position:relative;z-index:1;color:var(--q-fg);font-weight:600;font-size:.98rem;line-height:1.35}
.q.root .diamond{width:280px;height:170px}
.q.root .diamond span{font-size:1.1rem}
.q .qnote{max-width:min(420px,calc(100vw - 40px));margin-top:8px;font-size:.88rem;color:var(--muted-fg)}

/* nhánh */
.choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:min(760px,calc(100vw - 40px));position:relative}
.opt{border:1.5px solid var(--border);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.93rem;min-height:42px;box-shadow:var(--shadow);transition:all .15s}
.opt:hover{border-color:var(--accent);color:var(--accent)}
.opt[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .n{display:inline-block;min-width:1.4em;font-weight:600;opacity:.75}
.hint{font-size:.85rem;color:var(--muted-fg);margin-top:6px}

/* chế độ hiện tất cả: dạng sơ đồ tổ chức */
.branches{display:flex;align-items:flex-start;justify-content:center}
.branch{display:flex;flex-direction:column;align-items:center;padding:0 14px;position:relative}
.branch::before{content:"";position:absolute;top:0;height:2px;background:var(--line);left:0;right:0}
.branch:first-child::before{left:50%}
.branch:last-child::before{right:50%}
.branch:only-child::before{display:none}
.edge{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:4px 10px;font-size:.85rem;color:var(--muted-fg);cursor:pointer}
.edge:hover{color:var(--accent);border-color:var(--accent)}

/* chip căn cứ */
.cite{display:inline;border:1px solid var(--chip-bd);background:var(--chip-bg);color:var(--chip-fg);border-radius:6px;padding:0 6px;margin:0 1px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:normal;line-height:1.7;text-align:left;max-width:100%;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cite{text-decoration:none}
.cite:hover{filter:brightness(.95);text-decoration:underline}

/* hộp thoại */
dialog{border:0;border-radius:14px;padding:0;width:min(720px,calc(100vw - 24px));max-height:min(86vh,900px);background:var(--card);color:var(--fg);box-shadow:0 20px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(2,6,23,.55)}
.dlg-head{position:sticky;top:0;background:var(--card);padding:16px 20px 10px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.dlg-head h2{margin:0;font-size:1.05rem;flex:1}
.dlg-head .doc{display:block;font-weight:400;font-size:.88rem;color:var(--muted-fg);margin-top:2px}
.dlg-close{border:1px solid var(--border);background:var(--card);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:1.2rem;flex:none}
.dlg-body{padding:14px 20px 20px;overflow:auto}
.badge{display:inline-block;font-size:.78rem;border-radius:999px;padding:1px 8px;background:var(--muted);color:var(--muted-fg);margin-right:6px}
.badge.ok{background:var(--end-bg);color:var(--end-fg)}
.badge.part{background:var(--warn-bg);color:var(--warn-fg)}
.law{white-space:pre-wrap;font-size:.98rem;line-height:1.7;margin:10px 0;padding:12px 14px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
.law p{margin:0 0 6px}
.law .pt{padding-left:18px}
.law mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px}
.notes{margin:10px 0 0;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn-fg);font-size:.9rem}
.notes ul{margin:0;padding-left:18px}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
.src{font-size:.85rem;color:var(--muted-fg);margin-top:14px}

footer{max-width:900px;margin:0 auto;padding:0 20px 40px;color:var(--muted-fg);font-size:.88rem;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
button,.opt,.cite,.edge,.goto-ref{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.nw{white-space:normal}
.intro,.btn .sm{display:none}

/* ---------- Điện thoại, máy tính bảng dọc ---------- */
@media (max-width:760px){
  body{font-size:16px}
  header.top{position:sticky}
  .top-inner{padding:8px 12px;gap:8px;flex-wrap:nowrap}
  .top h1{font-size:1.05rem;white-space:nowrap}
  .top p.sub{display:none}
  .tools{margin-left:auto;flex-wrap:nowrap}
  .btn{min-height:44px;padding:6px 12px}
  .btn .lg,#zoomIn,#zoomOut{display:none}
  .btn .sm{display:inline}
  /* đường đang xem: một dòng, vuốt ngang */
  .crumbs{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;padding:0 12px 8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 16px),transparent)}
  .crumbs::-webkit-scrollbar{display:none}
  .crumbs button{min-height:36px;padding:4px 6px}
  .intro{display:block;margin:0 auto 14px;max-width:560px;padding:0 4px;color:var(--muted-fg);font-size:.92rem;text-align:center}
  main{padding:16px 12px calc(48px + env(safe-area-inset-bottom));overflow-x:hidden}
  .canvas{min-width:0;width:100%}
  .chain{width:100%}
  .card,.q,[data-path]{scroll-margin:100px}
  .card{width:100%;max-width:560px;padding:14px}
  .card h3{font-size:1.02rem}
  .card li{font-size:1rem;line-height:1.6;margin:6px 0}
  /* câu hỏi: thẻ tối thay cho hình thoi (trừ ô gốc) */
  .q{width:100%;max-width:560px}
  .q:not(.root) .diamond{width:100%;height:auto;padding:14px 16px 14px 44px;background:var(--q-bg);border-radius:14px;text-align:left;justify-items:start}
  .q:not(.root) .diamond::before{content:"?";clip-path:none;inset:auto;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.85rem}
  .q:not(.root) .diamond::after{display:none}
  .q.root .diamond{width:240px;height:146px;padding:0 44px}
  .q .qnote{text-align:left}
  /* lựa chọn: nút xếp dọc, rộng hết khung */
  .choices{flex-direction:column;align-items:stretch;width:100%;max-width:560px}
  .opt{border-radius:12px;text-align:left;min-height:48px;padding:10px 14px;font-size:1rem}
  .opt[aria-expanded="true"]::after{content:"▾";float:right}
  .cite{display:inline;padding:3px 7px;margin:2px 1px;font-size:.82rem;line-height:2.1}
  .jump,.goto-ref{min-height:44px;width:100%;max-width:none}
  /* tất cả nhánh: dạng dàn ý thụt lề thay cho sơ đồ rộng */
  .canvas.all .branches{flex-direction:column;align-items:stretch;width:100%;gap:10px}
  .canvas.all .branch{padding:0 0 0 12px;border-left:2px solid var(--line);align-items:stretch;margin-left:6px}
  .canvas.all .branch::before{display:none}
  .canvas.all .branch>.vline:first-child{display:none}
  .canvas.all .edge{align-self:flex-start;font-weight:600;color:var(--fg);min-height:36px}
  .canvas.all .card{width:100%;max-width:none}
  .canvas.all .card li{font-size:.95rem}
  .canvas.all .q{max-width:none}
  .canvas.all .vline{align-self:center}
  /* hộp thoại: tấm trượt từ dưới lên */
  dialog{width:100vw;max-width:100vw;max-height:92vh;margin:auto 0 0;border-radius:16px 16px 0 0;animation:sheet .22s ease-out}
  .dlg-head{padding:14px 16px 10px}
  .dlg-head h2{font-size:1rem}
  .dlg-body{padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
  .law{padding:10px 12px;font-size:1rem}
  .law .pt{padding-left:10px}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (max-width:360px){
  .top h1{font-size:.95rem}
  .btn{padding:6px 10px}
}
@media print{header.top{position:static}.tools{display:none}main{overflow:visible}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Muốn làm gì?</h1>
    <p class="sub">Bấm vào từng lựa chọn để đi theo nhánh. Bấm vào ô căn cứ màu xanh để xem nguyên văn điều luật.</p>
    <div class="tools" role="toolbar" aria-label="Công cụ sơ đồ">
      <button class="btn" id="btnAll" aria-pressed="false" title="Mở mọi nhánh cùng lúc"><span class="lg">Hiện tất cả nhánh</span><span class="sm">Tất cả</span></button>
      <button class="btn" id="btnReset" title="Đóng mọi nhánh">Về đầu</button>
      <button class="btn" id="zoomOut" aria-label="Thu nhỏ">−</button>
      <button class="btn" id="zoomIn" aria-label="Phóng to">+</button>
    </div>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Đường đang xem"></nav>
</header>

<main><p class="intro">Bấm vào từng lựa chọn để đi theo nhánh. Bấm ô căn cứ màu xanh để xem nguyên văn điều luật.</p><div class="canvas" id="canvas"></div></main>

<footer id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlgTitle">

    <h2 id="dlgTitle"></h2>
    <button class="dlg-close" id="dlgClose" aria-label="Đóng">×</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

-thay"}}}, {"label": "Không chịu thôi", "node": {"kind": "question", "title": "Có bằng chứng vi phạm không?", "options": [{"label": "Có bằng chứng", "node": {"kind": "step", "title": "Bãi nhiệm vì vi phạm", "points": ["Bỏ nhiệm vụ, vắng 3 tháng liên tiếp hoặc dự < 30% số cuộc họp BQT trong năm [[QC/d26/k2/c]].", "Vi phạm quy chế hoạt động hoặc quy chế thu, chi tài chính [[QC/d26/k2/d]].", "Bị xử phạt hành chính về quản lý, sử dụng nhà chung cư, hoặc bị truy cứu hình sự [[QC/d26/k2/đ]].", "Lưu bằng chứng: biên bản họp, danh sách vắng, quyết định xử phạt."], "next": {"goto": "tc-bau-thay"}}}, {"label": "Không có bằng chứng", "node": {"kind": "step", "title": "Thu chữ ký đề nghị bãi nhiệm", "points": ["Đơn đề nghị bãi nhiệm có chữ ký của **≥ 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao** [[QC/d26/k2/e]].", "Người sử dụng ký thay phải có uỷ quyền của chủ sở hữu [[QC/d14/k2]]."], "next": {"goto": "tc-bau-thay"}}}]}}]}}, "tc-bau-thay": {"kind": "question", "title": "Người đó giữ chức vụ gì trong BQT?", "note": "Tòa nhà thiếu 1 thành viên thì BQT vẫn hoạt động; thiếu từ 2 người phải họp bầu bổ sung [[QC/d19/k4/a]]. Bầu thay không quá 60 ngày [[QC/d16/k4]].", "options": [{"label": "Trưởng ban hoặc Phó ban", "node": {"kind": "step", "title": "Họp Hội nghị để bầu thay", "points": ["Phải họp Hội nghị bất thường hoặc thường niên [[QC/d26/k3/a]] [[QC/d16/k1/a]]; cần ≥ 50% đại diện căn hộ tham dự [[QC/d16/k2/a]].", "Trong lúc chờ, Phó ban làm thay Trưởng ban [[QC/d19/k4/c]]."], "next": {"goto": "tc-cong-nhan"}}}, {"label": "Phó ban do CĐT cử", "node": {"kind": "end", "title": "CĐT cử người khác", "points": ["Không cần họp Hội nghị [[QC/d26/k3/a]]."]}}, {"label": "Thành viên thường", "node": {"kind": "step", "title": "BQT lấy ý kiến bằng văn bản", "points": ["BQT đề xuất người thay và gửi xin ý kiến đại diện chủ sở hữu căn hộ; lập biên bản lấy ý kiến [[QC/d26/k3/b]]."], "next": {"kind": "question", "title": "Có ≥ 50% đại diện căn hộ đồng ý không?", "options": [{"label": "Có", "node": {"goto": "tc-cong-nhan"}}, {"label": "Không đủ", "node": {"kind": "step", "title": "Họp Hội nghị bất thường để bầu", "points": ["Bầu thay thành viên khi lấy ý kiến không đủ người đồng ý [[QC/d16/k1/c]]; cần ≥ 50% tham dự [[QC/d16/k2/a]]."], "next": {"goto": "tc-cong-nhan"}}}]}}}]}, "tc-cong-nhan": {"kind": "end", "title": "Đề nghị UBND xã công nhận thành viên mới", "points": ["Nộp hồ sơ tại UBND cấp xã trong 10 ngày [[QC/d23/k1]]; UBND xã quyết định trong 7 ngày làm việc [[QC/d23/k2]].", "BQT hiện tại vẫn hoạt động đến khi thành viên mới được công nhận [[QC/d26/k5]]."]}, "bth-start": {"kind": "info", "title": "Hội nghị bất thường dùng để làm gì?", "points": ["Khác với hội nghị thường niên (mỗi năm 1 lần, cần ≥ 30% tham dự) [[QC/d17/k1]], hội nghị bất thường được họp **bất cứ lúc nào** để quyết định **một** trong các việc Quy chế liệt kê [[QC/d16/k1]].", "Những việc thường gặp: bầu thay Trưởng ban, Phó ban [[QC/d16/k1/a]]; bãi nhiệm toàn bộ BQT và bầu BQT mới [[QC/d16/k1/b]]; bầu thay thành viên khi lấy ý kiến không đủ người đồng ý [[QC/d16/k1/c]]; đổi đơn vị quản lý vận hành hoặc điều chỉnh giá dịch vụ [[QC/d16/k1/d]]; bảo trì đột xuất, sửa kế hoạch bảo trì [[QC/d16/k1/g]]; việc khác khi có đơn của ≥ 50% đại diện căn hộ [[QC/d16/k1/h]].", "Sắp tới kỳ thường niên? Có thể gộp các việc này vào hội nghị thường niên, khi đó cần **≥ 50%** tham dự [[QC/d17/k2]]."], "next": {"kind": "question", "title": "Cần họp để quyết định việc gì?", "options": [{"label": "Bãi nhiệm toàn bộ BQT, bầu BQT mới", "node": {"kind": "step", "title": "UBND cấp xã tổ chức, không phải BQT", "points": ["Cư dân gửi đơn tới UBND cấp xã [[QC/d16/k5/a]]; BQT đương nhiệm không có trách nhiệm tổ chức việc này [[QC/d16/k4]].", "UBND xã tổ chức trong **30 ngày** [[QC/d16/k6]]; cần **≥ 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao** tham dự [[QC/d16/k2/a]]."], "jump": {"label": "Xem đầy đủ: nhánh Bãi nhiệm toàn bộ BQT", "to": "bai-nhiem"}}}, {"label": "Việc do BQT đề xuất (giá dịch vụ, đơn vị vận hành, bầu thay, bảo trì đột xuất)", "node": {"kind": "step", "title": "BQT chuẩn bị và tổ chức", "points": ["BQT chuẩn bị nội dung, thông báo thời gian, địa điểm và tổ chức họp [[QC/d16/k4]].", "Đề xuất đổi đơn vị quản lý vận hành hoặc đổi giá phải được **≥ 50% tổng số thành viên BQT** tán thành trước [[QC/d25/k2]].", "Cần **≥ 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao** tham dự [[QC/d16/k2/a]].", "Bầu thay thành viên bị miễn nhiệm, bãi nhiệm: tổ chức không quá **60 ngày** từ khi phát sinh [[QC/d16/k4]]."], "next": {"kind": "question", "title": "BQT có tổ chức họp không?", "options": [{"label": "Có, và đủ ≥ 50% tham dự", "node": {"goto": "bth-hop"}}, {"label": "Có họp nhưng không đủ người", "node": {"kind": "step", "title": "BQT đề nghị UBND cấp xã tổ chức", "points": ["BQT có văn bản đề nghị UBND cấp xã tổ chức lại [[QC/d16/k5/b]].", "UBND xã tổ chức trong **30 ngày**; kết quả có giá trị như hội nghị do BQT tổ chức [[QC/d16/k6]]."], "next": {"goto": "bth-hop"}}}, {"label": "BQT không chịu tổ chức", "node": {"kind": "step", "title": "Cư dân gom đơn ≥ 50% gửi UBND cấp xã", "points": ["Đơn của **≥ 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao** đề nghị UBND cấp xã tổ chức [[QC/d16/k5/c]].", "UBND xã tổ chức trong **30 ngày** kể từ khi nhận đơn [[QC/d16/k6]]."], "next": {"goto": "bth-hop"}}}]}}}, {"label": "Việc khác do cư dân đề nghị", "node": {"kind": "step", "title": "Cư dân gom đơn ≥ 50% gửi BQT", "points": ["Việc không thuộc danh sách trên vẫn được họp khi có đơn của **≥ 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao** [[QC/d16/k1/h]].", "BQT chuẩn bị và tổ chức [[QC/d16/k4]].", "Điều kiện họp khác: cần **≥ 75% số người đã ký đơn** tham dự, không phải 50% tổng số căn hộ [[QC/d16/k2/b]]."], "next": {"kind": "question", "title": "BQT có tổ chức họp không?", "options": [{"label": "Có", "node": {"goto": "bth-hop"}}, {"label": "Không", "node": {"kind": "warn", "title": "Chưa có quy định UBND xã tổ chức thay", "points": ["Quy chế chỉ giao UBND cấp xã tổ chức thay khi BQT không họp với các việc nêu ở điểm a, c, d, e, g [[QC/d16/k5/c]]; việc khác do cư dân đề nghị (điểm h) **không** nằm trong danh sách này.", "Tranh chấp giữa BQT và cư dân về công tác quản lý vận hành: thương lượng trước; không được thì đề nghị họp Hội nghị nhà chung cư để giải quyết [[QC/d44/k3]].", "Nên hỏi luật sư hoặc UBND cấp xã về cách xử lý trường hợp này."]}}]}}}, {"label": "BQT hết nhiệm kỳ, chưa bầu được BQT mới", "node": {"kind": "step", "title": "UBND cấp xã tổ chức bầu BQT nhiệm kỳ mới", "points": ["UBND xã tổ chức khi BQT có văn bản đề nghị; BQT không đề nghị thì cần đơn của đại diện chủ sở hữu [[QC/d16/k5/d]].", "UBND xã tổ chức trong **30 ngày** kể từ khi nhận văn bản hoặc đơn [[QC/d16/k6]]."], "next": {"goto": "bth-hop"}}}]}}, "bth-hop": {"kind": "step", "title": "Thành phần và chi phí cuộc họp", "points": ["Thành phần: đại diện chủ sở hữu căn hộ, CĐT (nếu còn sở hữu diện tích), đơn vị quản lý vận hành, và mời UBND cấp xã. Bên nào không cử người dự vẫn phải chấp hành quyết định [[QC/d18/k2/b]].", "Chủ sở hữu được uỷ quyền cho chủ sở hữu khác hoặc người đang sử dụng căn hộ dự họp, biểu quyết thay [[QC/d18/k5]].", "Chi phí do cư dân đóng góp; **không được** dùng quỹ bảo trì 2% [[LNO/d155/k1]]."], "next": {"kind": "end", "title": "Họp, biểu quyết và lập biên bản", "points": ["Họp trực tiếp; chỉ họp trực tuyến khi dịch bệnh, thiên tai và vẫn phải đủ số người tham dự [[QC/d18/k4]]. Người khuyết tật được lấy phiếu tại căn hộ [[QC/d18/k4]].", "**1 m² sở hữu riêng = 1 phiếu**; quyết định theo đa số phiếu của người tham dự [[QC/d18/k3]].", "Lưu ý: ngưỡng 50% hoặc 75% để **đủ điều kiện họp** đếm theo số đại diện căn hộ, còn **biểu quyết** tính theo m².", "Lập biên bản có chữ ký của chủ trì và thư ký [[LNO/d145/k5]]."]}}}, "cites": {"QC/d26/k3/b": {"label": "Điểm b khoản 3 Điều 26 Quy chế nhà chung cư", "ref": "điểm b khoản 3 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Trường hợp bầu thành viên Ban quản trị không thuộc đối tượng quy định tại điểm a khoản này thì Ban quản trị đề xuất người thay thế và gửi xin ý kiến bằng văn bản của các đại diện chủ sở hữu căn hộ; nếu được tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao hoặc có số lượng ít hơn theo quyết định đã được Hội nghị nhà chung cư lần đầu hoặc Hội nghị nhà chung cư trước đó thống nhất thì người được đề xuất được công nhận là thành viên Ban quản trị; trường hợp không có đủ số người đồng ý theo quy định tại điểm này thì phải họp Hội nghị nhà chung cư bất thường của tòa nhà để bầu người thay thế theo quy định tại Điều 16 của Quy chế này. Việc lấy ý kiến bầu thành viên Ban quản trị quy định tại điểm này cũng phải lập thành biên bản có chữ ký của các thành viên chủ trì việc lấy ý kiến.", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k6": {"label": "Khoản 6 Điều 16 Quy chế nhà chung cư", "ref": "khoản 6 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "khoan", "text": "Trong thời hạn 30 ngày, kể từ ngày nhận được văn bản đề nghị của Ban quản trị hoặc nhận được đơn của đại diện chủ sở hữu căn hộ quy định tại khoản 5 Điều này, Ủy ban nhân dân cấp xã có trách nhiệm tổ chức Hội nghị nhà chung cư bất thường. Kết quả của Hội nghị nhà chung cư bất thường do Ủy ban nhân dân cấp xã tổ chức có giá trị áp dụng đối với các chủ sở hữu, người đang sử dụng nhà chung cư như Hội nghị nhà chung cư bất thường do Ban quản trị tổ chức quy định tại Điều này.", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d19/k4/a": {"label": "Điểm a khoản 4 Điều 19 Quy chế nhà chung cư", "ref": "điểm a khoản 4 Điều 19", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Ban quản trị nhà chung cư", "level": "diem", "text": "Đối với Ban quản trị tòa nhà chung cư nếu thiếu 01 thành viên thì Ban quản trị vẫn tiếp tục hoạt động cho đến khi bầu được thành viên Ban quản trị mới và được công nhận theo quy định tại Điều 23 của Quy chế này; nếu thiếu từ 02 thành viên trở lên thì thành viên Ban quản trị còn lại phải tổ chức họp Hội nghị nhà chung cư theo quy định tại Điều 16 hoặc Điều 17 của Quy chế này để bầu bổ sung các thành viên còn thiếu;", "article": "17-VBHN-BXD-2026/quy-che/d19", "footnotes": [], "amended": [], "notes": []}, "ND95/d88/k2": {"label": "Khoản 2 Điều 88 Nghị định 95/2024", "ref": "khoản 2 Điều 88", "doc": "Nghị định 95/2024/NĐ-CP quy định chi tiết một số điều của Luật Nhà ở (văn bản hợp nhất số 21/VBHN-BXD năm 2026)", "status": "hop_nhat", "heading": "Trình tự, thủ tục cưỡng chế bàn giao kinh phí bảo trì phần sở hữu chung từ tài khoản chung của chủ đầu tư", "level": "khoan", "text": "Hết thời hạn quy định tại khoản 3 Điều 154 của Luật Nhà ở mà chủ đầu tư không bàn giao kinh phí bảo trì theo yêu cầu của Ủy ban nhân dân cấp huyện thì Ban quản trị nhà chung cư có văn bản đề nghị Ủy ban nhân dân cấp huyện ban hành quyết định cưỡng chế thu hồi kinh phí bảo trì để bàn giao cho Ban quản trị nhà chung cư; quyết định cưỡng chế này được gửi đến chủ đầu tư, cơ quan quản lý nhà ở cấp tỉnh nơi có nhà chung cư và tổ chức tín dụng hoặc chi nhánh ngân hàng nước ngoài nơi chủ đầu tư đang mở tài khoản quản lý kinh phí bảo trì này (gọi chung là tổ chức tín dụng).", "article": "21-VBHN-BXD-2026/d88", "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 12 Nghị định 140/2025/NĐ-CP."]}, "ND95/d91/k2": {"label": "Khoản 2 Điều 91 Nghị định 95/2024", "ref": "khoản 2 Điều 91", "doc": "Nghị định 95/2024/NĐ-CP quy định chi tiết một số điều của Luật Nhà ở (văn bản hợp nhất số 21/VBHN-BXD năm 2026)", "status": "hop_nhat", "heading": "Trình tự, thủ tục cưỡng chế kê biên, bán đấu giá tài sản của chủ đầu tư", "level": "khoan", "text": "Việc cưỡng chế bàn giao kinh phí bảo trì hoặc kê biên tài sản của chủ đầu tư để bán đấu giá được thực hiện theo quy định của pháp luật về cưỡng chế thi hành quyết định xử phạt vi phạm hành chính, pháp luật về kê biên tài sản; Ủy ban nhân dân cấp huyện chỉ thực hiện kê biên diện tích nhà, đất hoặc tài sản khác có giá trị tương đương với số kinh phí bảo trì phải thu hồi để bàn giao cho Ban quản trị nhà chung cư và chi phí cho việc tổ chức thi hành cưỡng chế, bán đấu giá tài sản này. Việc bán đấu giá tài sản để thu hồi kinh phí bảo trì bàn giao lại cho Ban quản trị nhà chung cư được thực hiện theo quy định của pháp luật về bán đấu giá tài sản. Trường hợp số tiền bán đấu giá tài sản nhiều hơn số kinh phí phải bàn giao và chi phí cho việc thực hiện bán đấu giá tài sản thì trong thời hạn tối đa 30 ngày, Ủy ban nhân dân cấp huyện có trách nhiệm phối hợp với tổ chức bán đấu giá làm thủ tục trả lại phần giá trị chênh lệch cho chủ đầu tư có tài sản bị kê biên bán đấu giá. 26Điều 41, Điều 42 Nghị định số 54/2026/NĐ-CP sửa đổi, bổ sung một số điều của các Nghị định trong lĩnh vực nhà ở, kinh doanh bất động sản, có hiệu lực thi hành kể từ ngày 09 tháng 02 năm 2026 quy định như sau: “Điều 41. Điều khoản thi hành", "article": "21-VBHN-BXD-2026/d91", "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 12 Nghị định 140/2025/NĐ-CP."]}, "QC/d21/k1": {"label": "Khoản 1 Điều 21 Quy chế nhà chung cư", "ref": "khoản 1 Điều 21", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Số lượng, thành phần Ban quản trị", "level": "khoan", "text": "Số lượng thành viên Ban quản trị tòa nhà chung cư, cụm nhà chung cư do Hội nghị nhà chung cư quyết định theo nguyên tắc sau đây: a) Đối với tòa nhà chỉ có một khối nhà (block) độc lập thì có tối thiểu 03 thành viên Ban quản trị; trường hợp tòa nhà có nhiều khối nhà (block) quy định tại khoản 2 Điều 3 của Quy chế này thì mỗi khối nhà (block) có tối thiểu 01 thành viên Ban quản trị; b) Đối với một cụm nhà chung cư thì có số lượng tối thiểu 06 thành viên Ban quản trị.", "article": "17-VBHN-BXD-2026/quy-che/d21", "footnotes": [], "amended": [], "notes": []}, "QC/d44/k2": {"label": "Khoản 2 Điều 44 Quy chế nhà chung cư", "ref": "khoản 2 Điều 44", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Giải quyết tranh chấp", "level": "khoan", "text": "Các tranh chấp giữa các thành viên Ban quản trị được giải quyết theo quy chế hoạt động của Ban quản trị đã được Hội nghị nhà chung cư thông qua. Trường hợp thành viên Ban quản trị hoặc Ban quản trị bị bãi nhiệm, miễn nhiệm, thay thế mà không bàn giao con dấu thì Ban quản trị được thành lập mới có quyền yêu cầu cơ quan có thẩm quyền về cấp, đăng ký con dấu thực hiện việc thu hồi, bàn giao hoặc hủy con dấu để đăng ký, cấp con dấu mới theo quy định về cấp, đăng ký và quản lý con dấu cho Ban quản trị mới thành lập. Trường hợp thành viên Ban quản trị hoặc Ban quản trị bị bãi nhiệm, miễn nhiệm, thay thế mà không bàn giao tài khoản quản lý kinh phí bảo trì phần sở hữu chung của nhà chung cư, tài khoản quản lý hoạt động của Ban quản trị thì Ban quản trị được thành lập mới có quyền yêu cầu tổ chức tín dụng đang quản lý các tài khoản này phong tỏa tài khoản, chấm dứt thực hiện các giao dịch có liên quan đến Ban quản trị bị bãi nhiệm, miễn nhiệm, thay thế và thực hiện lập, bàn giao tài khoản này cho Ban quản trị được thành lập mới theo quy định của Quy chế này và pháp luật có liên quan. Tổ chức tín dụng đang quản lý tài khoản này phải bàn giao cho Ban quản trị mới theo quy định của Quy chế này.", "article": "17-VBHN-BXD-2026/quy-che/d44", "footnotes": [], "amended": [], "notes": []}, "ND339/d61/k2/đ": {"label": "Điểm đ khoản 2 Điều 61 Nghị định 339/2026", "ref": "điểm đ khoản 2 Điều 61", "doc": "Nghị định 339/2026/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực xây dựng, quản lý, phát triển nhà, kinh doanh bất động sản", "status": "Còn hiệu lực", "heading": "Vi phạm quy định của thành viên Ban quản trị, Ban quản trị nhà chung cư về quản lý, sử dụng nhà chung cư", "level": "diem", "text": "Không báo cáo Hội nghị nhà chung cư theo quy định về việc thu, chi kinh phí bảo trì phần sở hữu chung nhà chung cư.", "article": "339-2026-ND-CP/d61", "footnotes": [], "amended": [], "notes": []}, "ND339/d61/k3/c": {"label": "Điểm c khoản 3 Điều 61 Nghị định 339/2026", "ref": "điểm c khoản 3 Điều 61", "doc": "Nghị định 339/2026/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực xây dựng, quản lý, phát triển nhà, kinh doanh bất động sản", "status": "Còn hiệu lực", "heading": "Vi phạm quy định của thành viên Ban quản trị, Ban quản trị nhà chung cư về quản lý, sử dụng nhà chung cư", "level": "diem", "text": "Quyết định mức giá dịch vụ quản lý, vận hành nhà chung cư mà không thông qua Hội nghị nhà chung cư;", "article": "339-2026-ND-CP/d61", "footnotes": [], "amended": [], "notes": []}, "LNO/d151/k7": {"label": "Khoản 7 Điều 151 Luật Nhà ở", "ref": "khoản 7 Điều 151", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Giá dịch vụ quản lý vận hành nhà chung cư", "level": "khoan", "text": "Ủy ban nhân dân cấp tỉnh có trách nhiệm ban hành khung giá dịch vụ quản lý vận hành nhà chung cư để áp dụng cho các trường hợp sau đây: a) Thu kinh phí quản lý vận hành nhà chung cư thuộc tài sản công trên địa bàn; b) Làm cơ sở để các bên tham khảo khi thỏa thuận giá dịch vụ quản lý vận hành đối với nhà ở không thuộc tài sản công hoặc trong trường hợp có tranh chấp về giá dịch vụ giữa đơn vị quản lý vận hành nhà chung cư với chủ sở hữu, người sử dụng nhà chung cư; trường hợp không thỏa thuận được giá dịch vụ quản lý vận hành nhà chung cư thì áp dụng mức giá trong khung giá dịch vụ do Ủy ban nhân dân cấp tỉnh ban hành.", "article": "27-2023-QH15/d151", "footnotes": [], "amended": [], "notes": []}, "QC/d7/k1": {"label": "Khoản 1 Điều 7 Quy chế nhà chung cư", "ref": "khoản 1 Điều 7", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Các hoạt động quản lý vận hành nhà chung cư", "level": "khoan", "text": "Hoạt động quản lý vận hành nhà chung cư bao gồm các công việc sau đây: a) Điều khiển, duy trì hoạt động, kiểm tra thường xuyên hệ thống thang máy, bảo dưỡng máy bơm nước, máy phát điện, hệ thống báo cháy tự động, hệ thống chữa cháy, dụng cụ chữa cháy, các thiết bị dự phòng và các thiết bị khác thuộc phần sở hữu chung, sử dụng chung của tòa nhà chung cư, cụm nhà chung cư để đảm bảo cho các hệ thống thiết bị này hoạt động bình thường; b) Cung cấp các dịch vụ bảo vệ, vệ sinh môi trường, thu gom rác thải, chăm sóc vườn hoa, cây cảnh, diệt côn trùng và các dịch vụ khác bảo đảm cho nhà chung cư hoạt động bình thường; c) Các công việc khác có liên quan do Hội nghị nhà chung cư quyết định.", "article": "17-VBHN-BXD-2026/quy-che/d7", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k1/g": {"label": "Điểm g khoản 1 Điều 16 Quy chế nhà chung cư", "ref": "điểm g khoản 1 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Báo cáo việc bảo trì, sửa chữa các hạng mục đột xuất không có trong kế hoạch bảo trì đã được Hội nghị nhà chung cư thông qua hoặc sửa đổi, điều chỉnh kế hoạch bảo trì đã được thông qua;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d14/k2": {"label": "Khoản 2 Điều 14 Quy chế nhà chung cư", "ref": "khoản 2 Điều 14", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư", "level": "khoan", "text": "Đối với nhà chung cư có nhiều chủ sở hữu thì Hội nghị nhà chung cư là hội nghị của các chủ sở hữu hoặc người sử dụng nếu chủ sở hữu không tham dự và có văn bản ủy quyền có chữ ký xác nhận của chủ sở hữu này (bao gồm cả trường hợp đã nhận bàn giao căn hộ hoặc phần diện tích khác trong nhà chung cư nhưng chưa thanh toán hết tiền cho chủ đầu tư, trừ trường hợp thuộc diện chấm dứt hợp đồng mua bán, thuê mua căn hộ).", "article": "17-VBHN-BXD-2026/quy-che/d14", "footnotes": [], "amended": [], "notes": []}, "QC/d21/k2": {"label": "Khoản 2 Điều 21 Quy chế nhà chung cư", "ref": "khoản 2 Điều 21", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Số lượng, thành phần Ban quản trị", "level": "khoan", "text": "Thành phần Ban quản trị tòa nhà chung cư, cụm nhà chung cư có nhiều chủ sở hữu được quy định như sau: a) Ban quản trị của tòa nhà chung cư bao gồm 01 Trưởng ban, 01 hoặc 02 Phó ban và các thành viên khác đang sinh sống trong nhà chung cư đó do Hội nghị nhà chung cư quyết định. Trường hợp chủ đầu tư còn sở hữu diện tích trong nhà chung cư thì đại diện do chủ đầu tư cử có thể được Hội nghị nhà chung cư bầu làm Trưởng ban quản trị; nếu không được bầu làm Trưởng ban thì được cử làm Phó ban quản trị mà không phải bầu thành viên này; trường hợp chủ đầu tư không cử đại diện tham gia Ban quản trị thì Hội nghị nhà chung cư bầu một trong các chủ sở hữu của toà nhà chung cư để làm Phó ban quản trị thay thế cho Phó ban quản trị của chủ đầu tư.b) Ban quản trị của cụm nhà chung cư bao gồm 01 Trưởng ban; mỗi tòa nhà trong cụm tổ chức họp để cử 01 hoặc 02 đại diện làm Phó ban và các thành viên khác do Hội nghị cụm nhà chung cư quyết định. Trường hợp chủ đầu tư còn sở hữu diện tích trong cụm nhà chung cư thì đại diện của chủ đầu tư có thể được Hội nghị cụm nhà chung cư bầu làm Trưởng ban quản trị cụm nhà chung cư. Mỗi tòa nhà trong cụm nhà chung cư mà chủ đầu tư còn sở hữu diện tích thì chủ đầu tư được cử đại diện tham gia làm Phó ban quản trị của cụm, trừ trường hợp đại diện chủ đầu tư của tòa nhà đó được bầu làm Trưởng ban quản trị của cụm nhà chung cư.3. Thành phần Ban quản trị tòa nhà, cụm nhà chung cư có một chủ sở hữu bao gồm 01 Trưởng ban, 01 hoặc 02 Phó ban và các thành viên khác do Hội nghị tòa nhà, cụm nhà chung cư quyết định.", "article": "17-VBHN-BXD-2026/quy-che/d21", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k1/b": {"label": "Điểm b khoản 1 Điều 16 Quy chế nhà chung cư", "ref": "điểm b khoản 1 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Miễn nhiệm hoặc bãi nhiệm toàn bộ các thành viên Ban quản trị và bầu Ban quản trị mới;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d26/k2/a": {"label": "Điểm a khoản 2 Điều 26 Quy chế nhà chung cư", "ref": "điểm a khoản 2 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Ban quản trị không báo cáo kết quả hoạt động cho Hội nghị nhà chung cư theo quy định của Quy chế này;", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k1/h": {"label": "Điểm h khoản 1 Điều 16 Quy chế nhà chung cư", "ref": "điểm h khoản 1 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Các trường hợp khác khi có đơn đề nghị của tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao.", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d19/k4/c": {"label": "Điểm c khoản 4 Điều 19 Quy chế nhà chung cư", "ref": "điểm c khoản 4 Điều 19", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Ban quản trị nhà chung cư", "level": "diem", "text": "Trường hợp thiếu thành viên quy định tại điểm a hoặc điểm b khoản này là Trưởng ban thì Phó ban quản trị nhà chung cư đó thực hiện nhiệm vụ của Trưởng ban cho đến khi bầu được Trưởng ban quản trị mới; trường hợp Ban quản trị có 02 Phó ban thì phải thống nhất cử 01 Phó ban làm nhiệm vụ của Trưởng ban;", "article": "17-VBHN-BXD-2026/quy-che/d19", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k5/b": {"label": "Điểm b khoản 5 Điều 16 Quy chế nhà chung cư", "ref": "điểm b khoản 5 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Trường hợp đã tổ chức Hội nghị nhà chung cư để quyết định một trong các nội dung quy định tại điểm a, c, d, e và điểm g khoản 1 Điều này nhưng không có đủ số người tham dự theo quy định tại điểm a khoản 2 hoặc điểm a khoản 3 Điều này và có văn bản đề nghị của Ban quản trị;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d18/k4": {"label": "Khoản 4 Điều 18 Quy chế nhà chung cư", "ref": "khoản 4 Điều 18", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thành phần tham dự và việc biểu quyết tại Hội nghị nhà chung cư", "level": "khoan", "text": "Việc biểu quyết tại Hội nghị tòa nhà chung cư, cụm nhà chung cư được thực hiện theo quy định tại khoản 5 Điều 145 của Luật Nhà ở; trường hợp do dịch bệnh, thiên tai mà không thể tổ chức họp trực tiếp thì họp trực tuyến hoặc trực tiếp kết hợp trực tuyến để biểu quyết nhưng phải đáp ứng đủ số lượng và thành phần tham dự Hội nghị nhà chung cư theo quy định của Quy chế này. Đối với chủ sở hữu, người sử dụng là người khuyết tật không thể tham dự Hội nghị nhà chung cư thì lấy phiếu biểu quyết tại địa chỉ căn hộ nơi người này cư trú.", "article": "17-VBHN-BXD-2026/quy-che/d18", "footnotes": [], "amended": [], "notes": []}, "ND140/d15/k3": {"label": "Khoản 3 Điều 15 Nghị định 140/2025", "ref": "khoản 3 Điều 15", "doc": "Nghị định 140/2025/NĐ-CP phân định thẩm quyền của chính quyền địa phương 2 cấp trong lĩnh vực xây dựng", "status": "Hết hiệu lực một phần", "heading": "Nhiệm vụ, thẩm quyền liên quan đến giải quyết khiếu nại, giải quyết tranh chấp về nhà ở", "level": "khoan", "text": "Trách nhiệm giải quyết tranh chấp về kinh phí quản lý vận hành nhà chung cư, quản lý sử dụng kinh phí bảo trì quy định tại khoản 4 Điều 194 Luật Nhà ở năm 2023 do Ủy ban nhân dân cấp xã thực hiện.", "article": "140-2025-ND-CP/d15", "footnotes": [], "amended": [], "notes": []}, "LNO/d153/k2/c": {"label": "Điểm c khoản 2 Điều 153 Luật Nhà ở", "ref": "điểm c khoản 2 Điều 153", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Quản lý, bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "diem", "text": "Căn cứ số liệu quyết toán kinh phí bảo trì quy định tại điểm b khoản này, chủ đầu tư dự án đầu tư xây dựng nhà ở đề nghị tổ chức tín dụng, chi nhánh ngân hàng nước ngoài đang quản lý tài khoản kinh phí bảo trì chuyển kinh phí này và lãi phát sinh từ kinh phí bảo trì sang tài khoản quản lý kinh phí do Ban quản trị nhà chung cư lập;", "article": "27-2023-QH15/d153", "footnotes": [], "amended": [], "notes": []}, "LNO/d153/k2/a": {"label": "Điểm a khoản 2 Điều 153 Luật Nhà ở", "ref": "điểm a khoản 2 Điều 153", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Quản lý, bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "diem", "text": "Sau khi có quyết định công nhận Ban quản trị nhà chung cư của cơ quan có thẩm quyền, Ban quản trị nhà chung cư có trách nhiệm mở tài khoản tại tổ chức chức tín dụng, chi nhánh ngân hàng nước ngoài đang hoạt động tại Việt Nam để quản lý kinh phí bảo trì và có văn bản đề nghị chủ đầu tư dự án đầu tư xây dựng nhà ở bàn giao kinh phí bảo trì đã thu theo quy định tại khoản 1 Điều này;", "article": "27-2023-QH15/d153", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k2/b": {"label": "Điểm b khoản 2 Điều 16 Quy chế nhà chung cư", "ref": "điểm b khoản 2 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Trường hợp họp Hội nghị nhà chung cư theo đề nghị của các chủ sở hữu căn hộ quy định tại điểm h khoản 1 Điều này thì phải có tối thiểu 75% số người đã có đơn đề nghị tổ chức họp Hội nghị nhà chung cư bất thường tham dự.", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "LNO/d154/k3": {"label": "Khoản 3 Điều 154 Luật Nhà ở", "ref": "khoản 3 Điều 154", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Cưỡng chế bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "khoan", "text": "Trong thời hạn 10 ngày, kể từ ngày có văn bản của Ủy ban nhân dân cấp huyện mà chủ đầu tư dự án đầu tư xây dựng nhà ở không bàn giao kinh phí bảo trì thì Ủy ban nhân dân cấp huyện có trách nhiệm ban hành quyết định cưỡng chế và tổ chức thu hồi kinh phí bảo trì để bàn giao cho Ban quản trị nhà chung cư theo quyết định cưỡng chế. Trong quá trình thực hiện cưỡng chế bàn giao kinh phí bảo trì, nếu phát hiện chủ đầu tư dự án đầu tư xây dựng nhà ở có dấu hiệu tội phạm thì Ủy ban nhân dân cấp huyện kiến nghị bằng văn bản và gửi kèm theo chứng cứ, tài liệu liên quan cho cơ quan điều tra có thẩm quyền xem xét, xử lý theo quy định của pháp luật.", "article": "27-2023-QH15/d154", "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 12 Nghị định 140/2025/NĐ-CP."]}, "QC/d19/k8": {"label": "Khoản 8 Điều 19 Quy chế nhà chung cư", "ref": "khoản 8 Điều 19", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Ban quản trị nhà chung cư", "level": "khoan", "text": "Ban quản trị khi hết nhiệm kỳ phải có trách nhiệm bàn giao hồ sơ nhà chung cư đang lưu giữ, các hồ sơ, giấy tờ liên quan đến việc thu, chi các kinh phí hoạt động, kinh phí bảo trì, bàn giao tài khoản đang được giao quản lý, con dấu và các hồ sơ, giấy tờ có liên quan sang cho Ban quản trị mới trong thời hạn tối đa 15 ngày, kể từ ngày Ban quản trị mới được cơ quan có thẩm quyền công nhận và có văn bản đề nghị bàn giao; trường hợp Ban quản trị bị bãi nhiệm, miễn nhiệm thì vẫn phải tiếp tục thực hiện các quyền và trách nhiệm với đơn vị quản lý vận hành cho đến khi bầu được Ban quản trị mới.", "article": "17-VBHN-BXD-2026/quy-che/d19", "footnotes": [], "amended": [], "notes": []}, "QC/d23/k4": {"label": "Khoản 4 Điều 23 Quy chế nhà chung cư", "ref": "khoản 4 Điều 23", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thủ tục công nhận và thông báo hoạt động của Ban quản trị", "level": "khoan", "text": "Sau khi có quyết định công nhận Ban quản trị của 32Ủy ban nhân dân cấp xã, Ban quản trị được công nhận có trách nhiệm lập tài khoản hoạt động của Ban quản trị; trường hợp nhà chung cư có nhiều chủ sở hữu thì Ban quản trị phải lập tài khoản quản lý kinh phí bảo trì phần sở hữu chung theo quy định của pháp luật về nhà ở, Quy chế này và đăng ký con dấu theo quy định của pháp luật về đăng ký quản lý con dấu (tên Ban quản trị khắc trên con dấu phải trùng với tên Ban quản trị đã được công nhận), trừ trường hợp Ban quản trị đã có con dấu và có tài khoản được lập theo quy định.", "article": "17-VBHN-BXD-2026/quy-che/d23", "footnotes": [], "amended": [], "notes": []}, "QC/d23/k5": {"label": "Khoản 5 Điều 23 Quy chế nhà chung cư", "ref": "khoản 5 Điều 23", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thủ tục công nhận và thông báo hoạt động của Ban quản trị", "level": "khoan", "text": "Ban quản trị có một chủ sở hữu được hoạt động kể từ khi được 33Ủy ban nhân dân cấp xã công nhận. Ban quản trị có nhiều chủ sở hữu được hoạt động kể từ khi có con dấu được đăng ký theo quy định của pháp luật và có các tài khoản được lập theo quy định của Quy chế này. Đối với Ban quản trị có nhiều chủ sở hữu đã có con dấu, có tài khoản được lập theo quy định mà không thuộc trường hợp đổi tên Ban quản trị thì phải có văn bản thông báo cho tổ chức tín dụng nơi đã mở tài khoản kèm theo bản sao có chứng thực quyết định công nhận Ban quản trị để thực hiện các giao dịch với tổ chức tín dụng theo quy định.", "article": "17-VBHN-BXD-2026/quy-che/d23", "footnotes": [], "amended": [], "notes": []}, "QC/d17/k2": {"label": "Khoản 2 Điều 17 Quy chế nhà chung cư", "ref": "khoản 2 Điều 17", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư thường niên", "level": "khoan", "text": "Đối với Hội nghị tòa nhà chung cư thường niên mà kết hợp quyết định một trong các vấn đề sau đây thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao tham dự: a) Bầu thay thế Trưởng ban hoặc Phó ban quản trị trong trường hợp phải bầu các vị trí này theo quy định tại điểm a khoản 3 Điều 26 hoặc điểm a khoản 4 Điều 26 của Quy chế này; b) Miễn nhiệm hoặc bãi nhiệm toàn bộ các thành viên Ban quản trị và bầu Ban quản trị mới; c) Bầu thay thế thành viên Ban quản trị không phải là Trưởng ban, Phó ban do bị miễn nhiệm, bãi nhiệm hoặc bị chết, mất tích trong trường hợp đã tổ chức lấy ý kiến của các chủ sở hữu nhà chung cư nhưng không đủ số người đồng ý theo quy định tại điểm b khoản 3 Điều 26 hoặc theo quy định tại điểm b khoản 4 Điều 26 của Quy chế này; d) Quyết định nội dung quy định tại điểm d khoản 1 Điều 16 của Quy chế này hoặc việc tiếp tục ký hợp đồng dịch vụ quản lý vận hành với đơn vị đang thực hiện quản lý vận hành nhưng hết hạn hợp đồng theo quy định tại khoản 1 Điều 29 của Quy chế này.", "article": "17-VBHN-BXD-2026/quy-che/d17", "footnotes": [], "amended": [], "notes": []}, "HN25/d1/k2": {"label": "Khoản 2 Điều 1 Quyết định 25/2026 của UBND Hà Nội", "ref": "khoản 2 Điều 1", "doc": "Quyết định 25/2026/QĐ-UBND của UBND thành phố Hà Nội sửa đổi khung giá dịch vụ quản lý vận hành nhà chung cư", "status": "Còn hiệu lực", "heading": "Sửa đổi, bổ sung khoản 1 Điều 3", "level": "khoan", "text": "Nhà chung cư có thang máy 1.200 16.500 (Trong khung giá này chưa bao gồm: Bảo hiểm cháy nổ; mức thù lao của các thành viên của Ban quản trị; các khoản thu được từ kinh doanh dịch vụ cao cấp như tắm hơi, bể bơi, truyền hình cáp, internet, hoặc các dịch vụ cao cấp khác)”", "article": "HN-25-2026-QD-UBND/d1", "footnotes": [], "amended": [], "notes": []}, "QC/d18/k3": {"label": "Khoản 3 Điều 18 Quy chế nhà chung cư", "ref": "khoản 3 Điều 18", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thành phần tham dự và việc biểu quyết tại Hội nghị nhà chung cư", "level": "khoan", "text": "Quyền biểu quyết tại Hội nghị tòa nhà chung cư, cụm nhà chung cư được tính theo diện tích sở hữu riêng của chủ sở hữu căn hộ, chủ sở hữu phần diện tích khác trong nhà chung cư theo nguyên tắc 1m2 diện tích sở hữu riêng tương đương với 01 phiếu biểu quyết; nếu diện tích căn hộ có số lẻ không đủ 1m2 thì không được tính 01 phiếu để biểu quyết; trường hợp không thống nhất được về diện tích sở hữu riêng của chủ sở hữu nhà chung cư thì xác định theo diện tích ghi trong hợp đồng mua bán, thuê mua căn hộ hoặc phần diện tích khác trong nhà chung cư. Các quyết định của Hội nghị nhà chung cư được thông qua theo nguyên tắc đa số phiếu biểu quyết của các chủ sở hữu, người sử dụng tham dự Hội nghị nhà chung cư.", "article": "17-VBHN-BXD-2026/quy-che/d18", "footnotes": [], "amended": [], "notes": []}, "ND339/d59/k4/g": {"label": "Điểm g khoản 4 Điều 59 Nghị định 339/2026", "ref": "điểm g khoản 4 Điều 59", "doc": "Nghị định 339/2026/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực xây dựng, quản lý, phát triển nhà, kinh doanh bất động sản", "status": "Còn hiệu lực", "heading": "Vi phạm quy định của chủ đầu tư về quản lý, sử dụng nhà chung cư và kinh phí bảo trì", "level": "diem", "text": "Không bàn giao, bàn giao chậm, bàn giao không đầy đủ kinh phí bảo trì và tiền lãi gửi kinh phí bảo trì phần sở hữu chung nhà chung cư theo quy định;", "article": "339-2026-ND-CP/d59", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k2/a": {"label": "Điểm a khoản 2 Điều 16 Quy chế nhà chung cư", "ref": "điểm a khoản 2 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Trường hợp họp Hội nghị nhà chung cư để quyết định một trong các vấn đề quy định tại các điểm a, b, c, d, e hoặc g khoản 1 Điều này thì phải có tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao tham dự. Trường hợp quyết định việc phá dỡ để cải tạo, xây dựng lại nhà chung cư quy định tại điểm đ khoản 1 Điều này thì thực hiện theo quy định của pháp luật về cải tạo, xây dựng lại nhà chung cư;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d26/k2/d": {"label": "Điểm d khoản 2 Điều 26 Quy chế nhà chung cư", "ref": "điểm d khoản 2 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Thành viên Ban quản trị vi phạm quy chế hoạt động hoặc quy chế thu, chi tài chính của Ban quản trị;", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "LNO/d153/k2/d": {"label": "Điểm d khoản 2 Điều 153 Luật Nhà ở", "ref": "điểm d khoản 2 Điều 153", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Quản lý, bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "diem", "text": "Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài có trách nhiệm chuyển kinh phí quy định tại điểm c khoản này cho Ban quản trị nhà chung cư theo số liệu hai bên đã quyết toán. Các chi phí phát sinh từ việc chuyển giao kinh phí bảo trì được khấu trừ vào kinh phí bảo trì.", "article": "27-2023-QH15/d153", "footnotes": [], "amended": [], "notes": []}, "LNO/d194/k4": {"label": "Khoản 4 Điều 194 Luật Nhà ở", "ref": "khoản 4 Điều 194", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Giải quyết tranh chấp về nhà ở", "level": "khoan", "text": "Tranh chấp về kinh phí quản lý vận hành nhà chung cư, quản lý, sử dụng kinh phí bảo trì do Ủy ban nhân dân cấp huyện nơi có nhà ở đó hoặc Tòa án, trọng tài thương mại giải quyết theo quy định của pháp luật.", "article": "27-2023-QH15/d194", "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 15 Nghị định 140/2025/NĐ-CP."]}, "LNO/d152/k2": {"label": "Khoản 2 Điều 152 Luật Nhà ở", "ref": "khoản 2 Điều 152", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "khoan", "text": "Đối với căn hộ, phần diện tích khác trong nhà chung cư mà chủ đầu tư dự án đầu tư xây dựng nhà ở giữ lại không bán, không cho thuê mua hoặc chưa bán, chưa cho thuê mua tính tại thời điểm bàn giao đưa nhà chung cư vào sử dụng, trừ phần diện tích thuộc sở hữu chung thì chủ đầu tư dự án đầu tư xây dựng nhà ở phải đóng kinh phí bảo trì là 2% giá trị căn hộ, phần diện tích giữ lại; phần giá trị này được tính theo giá bán căn hộ có giá cao nhất của nhà chung cư đó tại thời điểm bàn giao đưa nhà chung cư vào sử dụng.", "article": "27-2023-QH15/d152", "footnotes": [], "amended": [], "notes": []}, "LNO/d145/k5": {"label": "Khoản 5 Điều 145 Luật Nhà ở", "ref": "khoản 5 Điều 145", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Hội nghị nhà chung cư", "level": "khoan", "text": "Quyết định của Hội nghị nhà chung cư về vấn đề quy định tại khoản 3 Điều này được thông qua theo nguyên tắc đa số bằng hình thức biểu quyết hoặc bỏ phiếu, được lập thành biên bản có chữ ký của các thành viên chủ trì Hội nghị và thư ký Hội nghị nhà chung cư.", "article": "27-2023-QH15/d145", "footnotes": [], "amended": [], "notes": []}, "ND95/d90": {"label": "Điều 90 Nghị định 95/2024", "ref": "Điều 90", "doc": "Nghị định 95/2024/NĐ-CP quy định chi tiết một số điều của Luật Nhà ở (văn bản hợp nhất số 21/VBHN-BXD năm 2026)", "status": "hop_nhat", "heading": "Trình tự, thủ tục cưỡng chế bàn giao kinh phí từ tài khoản dùng để hoạt động kinh doanh của chủ đầu tư", "level": "dieu", "text": "Điều 90. Trình tự, thủ tục cưỡng chế bàn giao kinh phí từ tài khoản dùng để hoạt động kinh doanh của chủ đầu tư Trình tự, thủ tục cưỡng chế bàn giao kinh phí từ tài khoản dùng để hoạt động kinh doanh của chủ đầu tư trong trường hợp tài khoản chung của chủ đầu tư không còn tiền hoặc còn tiền nhưng không đủ để bàn giao cho Ban quản trị nhà chung cư theo quy định tại Điều 89 của Nghị định này được thực hiện như sau: 1. Ban quản trị nhà chung cư đề nghị cơ quan có thẩm quyền thực hiện xử lý vi phạm hành chính đối với chủ đầu tư theo quy định của pháp luật về xử lý vi phạm hành chính trong lĩnh vực xây dựng, nhà ở và kinh doanh bất động sản. 2. Trong thời hạn tối đa 10 ngày, sau khi có quyết định xử lý mà chủ đầu tư vẫn không bàn giao kinh phí theo quyết định xử lý hành chính thì Ban quản trị nhà chung cư đề nghị Ủy ban nhân dân cấp huyện kiểm tra; nếu đúng như đề nghị của Ban quản trị nhà chung cư thì Ủy ban nhân dân cấp huyện nơi có nhà chung cư có văn bản yêu cầu tổ chức tín dụng cung cấp thông tin về tài khoản dùng để hoạt động kinh doanh của chủ đầu tư và số tiền có trong tài khoản này. Trong thời hạn tối đa 15 ngày, kể từ ngày nhận được văn bản của Ủy ban nhân dân cấp huyện, tổ chức tín dụng có trách nhiệm cung cấp các thông tin liên quan cho Ủy ban nhân dân cấp huyện. 3. Căn cứ vào thông tin do tổ chức tín dụng cung cấp, Ủy ban nhân dân cấp huyện có văn bản yêu cầu tổ chức tín dụng chuyển số kinh phí mà chủ đầu tư phải bàn giao từ tài khoản dùng để hoạt động kinh doanh của chủ đầu tư sang tài khoản của Ban quản trị nhà chung cư để quản lý, sử dụng theo quy định. Sau khi hoàn tất việc chuyển giao số kinh phí này, tổ chức tín dụng phải có văn bản thông báo đến Ủy ban nhân dân cấp huyện, cơ quan quản lý nhà ở cấp tỉnh, chủ đầu tư và Ban quản trị nhà chung cư để biết, trong đó nêu rõ số tiền chuyển giao, thời điểm chuyển giao, số tài khoản chuyển giao.", "article": null, "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 12 Nghị định 140/2025/NĐ-CP."]}, "QC/d16/k4": {"label": "Khoản 4 Điều 16 Quy chế nhà chung cư", "ref": "khoản 4 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "khoan", "text": "Ban quản trị có trách nhiệm chuẩn bị nội dung, thông báo thời gian, địa điểm và tổ chức họp hội nghị chính thức cho các chủ sở hữu, người sử dụng nhà chung cư đối với các nội dung quy định tại khoản 1 Điều này, trừ trường hợp quy định tại điểm b khoản 1 Điều này. Thời gian tổ chức bầu Ban quản trị hoặc thành viên Ban quản trị trong trường hợp bị miễn nhiệm hoặc bãi nhiệm tối đa không quá 60 ngày, kể từ ngày xuất hiện trường hợp bị miễn nhiệm hoặc bãi nhiệm.", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d17/k1": {"label": "Khoản 1 Điều 17 Quy chế nhà chung cư", "ref": "khoản 1 Điều 17", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư thường niên", "level": "khoan", "text": "Hội nghị nhà chung cư thường niên được tổ chức mỗi năm một lần khi có tối thiểu 30% đại diện chủ sở hữu căn hộ đã nhận bàn giao tham dự hoặc có số lượng ít hơn do các chủ sở hữu nhà chung cư thống nhất trong Hội nghị nhà chung cư lần đầu. Hội nghị tòa nhà chung cư, cụm nhà chung cư thường niên có các nội dung sau đây: a) Thông qua báo cáo của Ban quản trị về kết quả hoạt động của Ban quản trị và thông qua các khoản thu, chi hàng năm của Ban quản trị; b) Xem xét, thông qua quyết toán kinh phí bảo trì phần sở hữu chung của nhà chung cư trong năm và thông qua kế hoạch bảo trì phần sở hữu chung nhà chung cư của năm sau do Ban quản trị báo cáo; c) Xem xét, quyết định việc tiếp tục ký hợp đồng với đơn vị quản lý vận hành nhà chung cư trong trường hợp hợp đồng có thời hạn 12 tháng; d) Quyết định các nội dung khác theo quy định tại điểm g khoản 3 Điều 145 của Luật Nhà ở (nếu có).", "article": "17-VBHN-BXD-2026/quy-che/d17", "footnotes": [], "amended": [], "notes": []}, "QC/d26/k5": {"label": "Khoản 5 Điều 26 Quy chế nhà chung cư", "ref": "khoản 5 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "khoan", "text": "Khi đề nghị bầu thành viên Ban quản trị mới thay thế thì Ban quản trị đã được công nhận vẫn tiếp tục hoạt động theo quy chế hoạt động đến khi cơ quan có thẩm quyền công nhận Ban quản trị mới; trường hợp bầu lại Ban quản trị do bị miễn nhiệm, bãi nhiệm thì Ban quản trị mới được Hội nghị nhà chung cư bầu phối hợp với Ủy ban nhân dân cấp xã nơi có nhà chung cư và đơn vị quản lý vận hành thực hiện các quyền hạn, trách nhiệm của Ban quản trị cho đến khi cơ quan có thẩm quyền công nhận Ban quản trị mới.", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "QC/d23/k3/e": {"label": "Điểm e khoản 3 Điều 23 Quy chế nhà chung cư", "ref": "điểm e khoản 3 Điều 23", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thủ tục công nhận và thông báo hoạt động của Ban quản trị", "level": "diem", "text": "Thay thế quyết định công nhận trước đó (nếu có).", "article": "17-VBHN-BXD-2026/quy-che/d23", "footnotes": [], "amended": [], "notes": []}, "QC/d25/k2/a": {"label": "Điểm a khoản 2 Điều 25 Quy chế nhà chung cư", "ref": "điểm a khoản 2 Điều 25", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Biểu quyết thông qua các quyết định của Ban quản trị", "level": "diem", "text": "Đề xuất thay đổi đơn vị quản lý vận hành;", "article": "17-VBHN-BXD-2026/quy-che/d25", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k1/d": {"label": "Điểm d khoản 1 Điều 16 Quy chế nhà chung cư", "ref": "điểm d khoản 1 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Ban quản trị đề nghị thay thế đơn vị quản lý vận hành hoặc đề nghị điều chỉnh giá dịch vụ quản lý vận hành nhà chung cư;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d23/k1": {"label": "Khoản 1 Điều 23 Quy chế nhà chung cư", "ref": "khoản 1 Điều 23", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thủ tục công nhận và thông báo hoạt động của Ban quản trị", "level": "khoan", "text": "Trong thời hạn 10 ngày, kể từ ngày có biên bản bầu Ban quản trị hoặc thành viên Ban quản trị theo quy định (bao gồm trường hợp bầu Ban quản trị lần đầu, bầu Ban quản trị khi hết nhiệm kỳ, bầu Ban quản trị khi bị bãi nhiệm, miễn nhiệm, bầu Ban quản trị mới khi tách, nhập Ban quản trị), Ban quản trị có trách nhiệm nộp trực tiếp hoặc qua dịch vụ bưu chính hoặc trực tuyến 01 bộ hồ sơ đề nghị công nhận Ban quản trị quy định tại Điều 22 của Quy chế này tại Ủy ban nhân dân cấp xã nơi có nhà chung cư.", "article": "17-VBHN-BXD-2026/quy-che/d23", "footnotes": ["Cụm từ “Ủy ban nhân dân cấp huyện” được thay thế bằng cụm từ “Ủy ban nhân dân cấp xã” theo quy định tại điểm c khoản 5 Điều 2 của Thông tư số 09/2025/TT-BXD sửa đổi, bổ sung một số điều của các Thông tư thuộc lĩnh vực quản lý nhà nước của Bộ Xây dựng liên quan đến sắp xếp tổ chức bộ máy, thực hiện chính quyền địa phương 02 cấp và phân cấp cho chính quyền địa phương, có hiệu lực kể từ ngày 01 tháng 7 năm 2025."], "amended": [], "notes": []}, "QC/d18/k5": {"label": "Khoản 5 Điều 18 Quy chế nhà chung cư", "ref": "khoản 5 Điều 18", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thành phần tham dự và việc biểu quyết tại Hội nghị nhà chung cư", "level": "khoan", "text": "Chủ sở hữu căn hộ hoặc chủ sở hữu phần diện tích khác trong nhà chung cư được ủy quyền cho chủ sở hữu khác trong nhà chung cư đó hoặc người đang sử dụng nhà chung cư đó dự họp và thay mặt chủ sở hữu biểu quyết tại Hội nghị nhà chung cư. Đối với các căn hộ thuộc tài sản công (bao gồm cả căn hộ chưa có người sử dụng) thì cơ quan đại diện chủ sở hữu dự họp và thực hiện quyền biểu quyết. Trường hợp căn hộ đang có người sử dụng mà cơ quan đại diện chủ sở hữu ủy quyền cho người sử dụng căn hộ tham gia dự họp thì người sử dụng căn hộ được dự họp và thực hiện biểu quyết tại Hội nghị nhà chung cư.", "article": "17-VBHN-BXD-2026/quy-che/d18", "footnotes": [], "amended": [], "notes": []}, "QC/d26/k2": {"label": "Khoản 2 Điều 26 Quy chế nhà chung cư", "ref": "khoản 2 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "khoan", "text": "Việc bãi nhiệm Ban quản trị, thành viên Ban quản trị tòa nhà chung cư, cụm nhà chung cư được thực hiện khi có một trong các trường hợp sau đây: a) Ban quản trị không báo cáo kết quả hoạt động cho Hội nghị nhà chung cư theo quy định của Quy chế này; b) Ban quản trị không hoạt động sau khi được bầu; c) Thành viên Ban quản trị không thực hiện các nhiệm vụ được giao trong quy chế hoạt động của nhà chung cư hoặc không tham gia các hoạt động của Ban quản trị trong 03 tháng liên tiếp hoặc không tham dự tối thiểu 30% tổng số các cuộc họp của Ban quản trị trong 01 năm; d) Thành viên Ban quản trị vi phạm quy chế hoạt động hoặc quy chế thu, chi tài chính của Ban quản trị; đ) Thành viên Ban quản trị bị xử phạt vi phạm hành chính do vi phạm quy định về quản lý, sử dụng nhà chung cư hoặc bị truy cứu trách nhiệm hình sự; e) Khi có đơn đề nghị bãi nhiệm có chữ ký của tối thiểu 50% đại diện chủ sở hữu căn hộ đã nhận bàn giao.", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "LNO/d151/k1": {"label": "Khoản 1 Điều 151 Luật Nhà ở", "ref": "khoản 1 Điều 151", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Giá dịch vụ quản lý vận hành nhà chung cư", "level": "khoan", "text": "Việc xác định giá dịch vụ quản lý vận hành nhà chung cư phải bảo đảm công khai, minh bạch và căn cứ vào nội dung công việc cần quản lý vận hành và các dịch vụ sử dụng đối với từng loại nhà chung cư.", "article": "27-2023-QH15/d151", "footnotes": [], "amended": [], "notes": []}, "LNO/d155/k1": {"label": "Khoản 1 Điều 155 Luật Nhà ở", "ref": "khoản 1 Điều 155", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Sử dụng kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "khoan", "text": "Kinh phí bảo trì chỉ được sử dụng để bảo trì, thay thế các hạng mục, trang thiết bị thuộc phần sở hữu chung của nhà chung cư theo kế hoạch bảo trì được Hội nghị nhà chung cư thông qua. Ban quản trị nhà chung cư không được sử dụng kinh phí bảo trì này vào mục đích quản lý vận hành nhà chung cư và các mục đích khác. Trường hợp nhà chung cư phải phá dỡ theo quy định của Luật này mà kinh phí bảo trì chưa sử dụng hết thì được sử dụng để hỗ trợ tái định cư hoặc đưa vào quỹ bảo trì phần sở hữu chung của nhà chung cư mới sau khi được xây dựng lại.", "article": "27-2023-QH15/d155", "footnotes": [], "amended": [], "notes": []}, "BVDL/d16/k1": {"label": "Khoản 1 Điều 16 Luật Bảo vệ dữ liệu cá nhân", "ref": "khoản 1 Điều 16", "doc": "Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15", "status": "Còn hiệu lực", "heading": "Công khai dữ liệu cá nhân", "level": "khoan", "text": "Dữ liệu cá nhân chỉ được công khai với mục đích cụ thể. Phạm vi công khai, loại dữ liệu cá nhân được công khai phải phù hợp với mục đích công khai. Việc công khai dữ liệu cá nhân không được xâm phạm đến quyền, lợi ích hợp pháp của chủ thể dữ liệu cá nhân.", "article": "91-2025-QH15/d16", "footnotes": [], "amended": [], "notes": ["Nội dung được nhận dạng từ bản scan của văn bản nên có thể sai chính tả; nên đối chiếu với bản chính thức."]}, "ND339/d61/k2/d": {"label": "Điểm d khoản 2 Điều 61 Nghị định 339/2026", "ref": "điểm d khoản 2 Điều 61", "doc": "Nghị định 339/2026/NĐ-CP về xử phạt vi phạm hành chính trong lĩnh vực xây dựng, quản lý, phát triển nhà, kinh doanh bất động sản", "status": "Còn hiệu lực", "heading": "Vi phạm quy định của thành viên Ban quản trị, Ban quản trị nhà chung cư về quản lý, sử dụng nhà chung cư", "level": "diem", "text": "Không ký kết hợp đồng cung cấp dịch vụ quản lý vận hành nhà chung cư với chủ đầu tư dự án đầu tư xây dựng nhà ở hoặc đơn vị có chức năng quản lý vận hành nhà chung cư đã được Hội nghị nhà chung cư lựa chọn;", "article": "339-2026-ND-CP/d61", "footnotes": [], "amended": [], "notes": []}, "QC/d26/k2/đ": {"label": "Điểm đ khoản 2 Điều 26 Quy chế nhà chung cư", "ref": "điểm đ khoản 2 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Thành viên Ban quản trị bị xử phạt vi phạm hành chính do vi phạm quy định về quản lý, sử dụng nhà chung cư hoặc bị truy cứu trách nhiệm hình sự;", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "ND140/d12/k3": {"label": "Khoản 3 Điều 12 Nghị định 140/2025", "ref": "khoản 3 Điều 12", "doc": "Nghị định 140/2025/NĐ-CP phân định thẩm quyền của chính quyền địa phương 2 cấp trong lĩnh vực xây dựng", "status": "Hết hiệu lực một phần", "heading": "Nhiệm vụ, thẩm quyền liên quan đến quản lý nhà chung cư", "level": "khoan", "text": "Trách nhiệm tổ chức cưỡng chế bàn giao kinh phí bảo trì phần sở hữu chung trong nhà chung cư quy định tại Điều 154 Luật Nhà ở năm 2023, Điều 88, Điều 89, Điều 90, Điều 91 Nghị định số 95/2024/NĐ-CP ngày 24 tháng 7 năm 2024 của Chính phủ do Ủy ban nhân dân cấp xã thực hiện.", "article": "140-2025-ND-CP/d12", "footnotes": [], "amended": [], "notes": []}, "LNO/d154/k1": {"label": "Khoản 1 Điều 154 Luật Nhà ở", "ref": "khoản 1 Điều 154", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Cưỡng chế bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "khoan", "text": "Trường hợp chủ đầu tư dự án đầu tư xây dựng nhà ở không bàn giao kinh phí bảo trì theo quy định tại khoản 2 Điều 153 của Luật này, Ban quản trị nhà chung cư có văn bản đề nghị Ủy ban nhân dân cấp huyện nơi có nhà chung cư yêu cầu chủ đầu tư dự án đầu tư xây dựng nhà ở bàn giao kinh phí bảo trì.", "article": "27-2023-QH15/d154", "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 12 Nghị định 140/2025/NĐ-CP."]}, "QC/d16/k1/c": {"label": "Điểm c khoản 1 Điều 16 Quy chế nhà chung cư", "ref": "điểm c khoản 1 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Bầu thay thế thành viên Ban quản trị không phải là Trưởng ban, Phó ban do bị miễn nhiệm, bãi nhiệm hoặc bị chết, mất tích trong trường hợp đã tổ chức lấy ý kiến của các chủ sở hữu nhà chung cư nhưng không đủ số người đồng ý theo quy định tại điểm b khoản 3 Điều 26 của Quy chế này hoặc bầu thay thế thành viên Ban quản trị theo quy định tại điểm b khoản 4 Điều 26 của Quy chế này;", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "QC/d15/k1/a": {"label": "Điểm a khoản 1 Điều 15 Quy chế nhà chung cư", "ref": "điểm a khoản 1 Điều 15", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư lần đầu", "level": "diem", "text": "Hội nghị của tòa nhà chung cư phải được tổ chức trong thời hạn 12 tháng, kể từ ngày nhà chung cư đó được bàn giao đưa vào sử dụng và có tối thiểu 50% số căn hộ đã được bàn giao cho người mua, thuê mua (không bao gồm số căn hộ mà chủ đầu tư giữ lại không bán, không cho thuê mua hoặc chưa bán, chưa cho thuê mua); trường hợp quá thời hạn quy định tại điểm này mà tòa nhà chung cư chưa có đủ 50% số căn hộ được bàn giao thì Hội nghị nhà chung cư được tổ chức sau khi có đủ 50% số căn hộ được bàn giao;", "article": "17-VBHN-BXD-2026/quy-che/d15", "footnotes": [], "amended": [], "notes": []}, "QC/d26/k3/a": {"label": "Điểm a khoản 3 Điều 26 Quy chế nhà chung cư", "ref": "điểm a khoản 3 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Trường hợp bầu thay thế Ban quản trị hoặc bầu thay thế Trưởng ban hoặc Phó ban quản trị thì phải tổ chức Hội nghị nhà chung cư bất thường để quyết định theo quy định tại Điều 16 của Quy chế này hoặc Hội nghị thường niên tại Điều 17 của Quy chế này để quyết định; trường hợp miễn nhiệm hoặc bãi nhiệm Phó ban quản trị là đại diện của chủ đầu tư thì chủ đầu tư cử đại diện khác thay thế mà không phải tổ chức Hội nghị nhà chung cư; trường hợp chủ đầu tư không cử thành viên khác thay thế mà trong Ban quản trị còn có Phó ban quản trị khác thì không phải tổ chức Hội nghị nhà chung cư để bầu thay thế. Trường hợp sau khi Ban quản trị được công nhận mà chủ đầu tư có văn bản xin thôi tham gia làm Phó ban quản trị mà trong Ban quản trị không có Phó ban khác thì tổ chức Hội nghị nhà chung cư theo quy định tại Điều 16 hoặc Điều 17 của Quy chế này để bầu một trong các chủ sở hữu của toà nhà chung cư làm Phó ban quản trị; chủ đầu tư vẫn phải chịu trách nhiệm về các nội dung liên quan đến kỹ thuật trong việc bảo hành, bảo trì nhà chung cư theo quy định của pháp luật về nhà ở;", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "QC/d26/k2/c": {"label": "Điểm c khoản 2 Điều 26 Quy chế nhà chung cư", "ref": "điểm c khoản 2 Điều 26", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Miễn nhiệm, bãi nhiệm thành viên Ban quản trị hoặc toàn bộ Ban quản trị", "level": "diem", "text": "Thành viên Ban quản trị không thực hiện các nhiệm vụ được giao trong quy chế hoạt động của nhà chung cư hoặc không tham gia các hoạt động của Ban quản trị trong 03 tháng liên tiếp hoặc không tham dự tối thiểu 30% tổng số các cuộc họp của Ban quản trị trong 01 năm;", "article": "17-VBHN-BXD-2026/quy-che/d26", "footnotes": [], "amended": [], "notes": []}, "QC/d23/k2": {"label": "Khoản 2 Điều 23 Quy chế nhà chung cư", "ref": "khoản 2 Điều 23", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Thủ tục công nhận và thông báo hoạt động của Ban quản trị", "level": "khoan", "text": "Trong thời hạn 07 ngày làm việc, kể từ ngày nhận đầy đủ hồ sơ đề nghị của Ban quản trị, 31Ủy ban nhân dân cấp xã nơi có nhà chung cư kiểm tra hồ sơ và ban hành quyết định công nhận Ban quản trị.", "article": "17-VBHN-BXD-2026/quy-che/d23", "footnotes": [], "amended": [], "notes": []}, "LKN/d17": {"label": "Điều 17 Luật Khiếu nại", "ref": "Điều 17", "doc": "Luật Khiếu nại (văn bản hợp nhất số 28/VBHN-VPQH năm 2026)", "status": "hop_nhat", "heading": "Thẩm quyền của Chủ tịch Ủy ban nhân dân cấp xã", "level": "dieu", "text": "Điều 17. Thẩm quyền của Chủ tịch Ủy ban nhân dân cấp xã Chủ tịch Ủy ban nhân dân cấp xã có thẩm quyền giải quyết khiếu nại lần đầu đối với quyết định hành chính, hành vi hành chính của mình, của người đứng đầu cơ quan chuyên môn, tổ chức hành chính khác thuộc Ủy ban nhân dân cấp xã, của công chức, viên chức do mình quản lý trực tiếp.", "article": null, "footnotes": ["Điều này được sửa đổi, bổ sung theo quy định tại khoản 7 Điều 2 của Luật số 136/2025/QH15 sửa đổi, bổ sung một số điều của Luật Tiếp công dân, Luật Khiếu nại, Luật Tố cáo, có hiệu lực kể từ ngày 01 tháng 7 năm 2026."], "amended": [], "notes": []}, "LNO/d151/k3/b": {"label": "Điểm b khoản 3 Điều 151 Luật Nhà ở", "ref": "điểm b khoản 3 Điều 151", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Giá dịch vụ quản lý vận hành nhà chung cư", "level": "diem", "text": "Trường hợp đã tổ chức được Hội nghị nhà chung cư thì giá dịch vụ quản lý vận hành nhà chung cư do đơn vị quản lý vận hành và Hội nghị nhà chung cư thỏa thuận, thống nhất quyết định.", "article": "27-2023-QH15/d151", "footnotes": [], "amended": [], "notes": []}, "QC/d16/k5/d": {"label": "Điểm d khoản 5 Điều 16 Quy chế nhà chung cư", "ref": "điểm d khoản 5 Điều 16", "doc": "Quy chế quản lý, sử dụng nhà chung cư (văn bản hợp nhất số 17/VBHN-BXD năm 2026 của Bộ Xây dựng)", "status": "hop_nhat", "heading": "Hội nghị nhà chung cư bất thường", "level": "diem", "text": "Khi Ban quản trị hết nhiệm kỳ hoạt động mà chưa lựa chọn được Ban quản trị nhiệm kỳ mới và có văn bản đề nghị của Ban quản trị; trường hợp Ban quản trị không có đề nghị thì phải có đơn của đại diện chủ sở hữu nhà chung cư.", "article": "17-VBHN-BXD-2026/quy-che/d16", "footnotes": [], "amended": [], "notes": []}, "LNO/d154/k2": {"label": "Khoản 2 Điều 154 Luật Nhà ở", "ref": "khoản 2 Điều 154", "doc": "Luật Nhà ở số 27/2023/QH15", "status": "Hết hiệu lực một phần", "heading": "Cưỡng chế bàn giao kinh phí bảo trì của nhà chung cư có nhiều chủ sở hữu", "level": "khoan", "text": "Trong thời hạn 15 ngày, kể từ ngày nhận được văn bản của Ban quản trị nhà chung cư, Ủy ban nhân dân cấp huyện phải có văn bản yêu cầu chủ đầu tư dự án đầu tư xây dựng nhà ở bàn giao kinh phí bảo trì cho Ban quản trị nhà chung cư.", "article": "27-2023-QH15/d154", "footnotes": [], "amended": [], "notes": ["Điều luật ghi “cấp huyện”. Từ 01/7/2025 không còn cấp huyện; việc này do Ủy ban nhân dân cấp xã thực hiện theo khoản 3 Điều 12 Nghị định 140/2025/NĐ-CP."]}, "LKN/d7": {"label": "Điều 7 Luật Khiếu nại", "ref": "Điều 7", "doc": "Luật Khiếu nại (văn bản hợp nhất số 28/VBHN-VPQH năm 2026)", "status": "hop_nhat", "heading": "Trình tự khiếu nại", "level": "dieu", "text": "Điều 7. Trình tự khiếu nại 1. Khi có căn cứ cho rằng quyết định hành chính, hành vi hành chính là trái pháp luật, xâm phạm trực tiếp đến quyền, lợi ích hợp pháp của mình thì người khiếu nại khiếu nại lần đầu đến người đã ra quyết định hành chính hoặc cơ quan có người có hành vi hành chính hoặc khởi kiện vụ án hành chính tại Tòa án theo quy định của Luật Tố tụng hành chính. Trường hợp người khiếu nại không đồng ý với quyết định giải quyết khiếu nại lần đầu hoặc quá thời hạn quy định mà khiếu nại không được giải quyết thì có quyền khiếu nại lần hai đến Thủ trưởng cấp trên trực tiếp của người có thẩm quyền giải quyết khiếu nại lần đầu hoặc khởi kiện vụ án hành chính tại Tòa án theo quy định của Luật Tố tụng hành chính. Trường hợp người khiếu nại không đồng ý với quyết định giải quyết khiếu nại lần hai hoặc hết thời hạn quy định mà khiếu nại không được giải quyết thì có quyền khởi kiện vụ án hành chính tại Tòa án theo quy định của Luật Tố tụng hành chính. 2. Đối với quyết định hành chính, hành vi hành chính của Bộ trưởng, Thủ trưởng cơ quan ngang Bộ, Thủ trưởng cơ quan thuộc Chính phủ (sau đây gọi chung là Bộ trưởng) thì người khiếu nại khiếu nại đến Bộ trưởng hoặc khởi kiện vụ án hành chính tại Tòa án theo quy định của Luật Tố tụng hành chính. Trường hợp người khiếu nại không đồng ý với quyết định giải quyết khiếu nại của Bộ trưởng hoặc quá thời hạn quy định mà khiếu nại không được giải quyết thì có quyền khởi kiện vụ án hành chính tại Tòa án theo quy định của Luật Tố tụng hành chính. 3. Đối với quyết định hành chính, hành vi hành chính của Chủ tịch Ủy ban nhân dân tỉnh, thành phố trực thuộc trung ương (sau đây gọi chung là cấp tỉnh) thì người khiếu nại khiếu nại lần đầu đến Chủ tịch Ủy ban nhân dân cấp tỉnh hoặc khởi kiện vụ án hành chính tại Tòa án theo quy định của Luật Tố tụng hành chính. Trường hợp người khiếu nại không đồng ý với quyết định giải quyết khiếu nại lần đầu của Chủ tịch Ủy ban nhâ
